[package]
description = "Tabsdata Authorization Extension - Open Source"
name = "te-authz"

authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[lib]

[features]
enterprise = []
td-test = [
    "dummy",
    "mock-env",
    "test-utils",
    "td-authz/td-test",
]
dummy = []
mock-env = []
test_logging = []
test-utils = []

[package.metadata.cargo-machete]
ignored = ["openssl", "strum", "te-authz", "thiserror"]

# Internal dependencies

[dependencies]

## Libraries

td-authz = { workspace = true }
td-database = { workspace = true }
td-error = { workspace = true }
td-security = { workspace = true }
strum = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
te-authz = { workspace = true, features = ["td-test"] }

[target.'cfg(target_os = "linux")'.dependencies]
openssl = { workspace = true, features = ["vendored"] }
