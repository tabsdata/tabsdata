[package]
description = "Tabsdata Execution Extension Implementation - Open Source"
name = "te-execution"
build = "build.rs"

authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[lib]

[features]
enterprise = []
td-test = [
    "dummy",
    "mock-env",
    "test-utils",
    "td-error/td-test",
    "td-objects/td-test",
]
dummy = []
mock-env = []
test-utils = []

[package.metadata.cargo-machete]
ignored = ["openssl", "te-execution", "tokio"]

[dependencies]

# Internal dependencies

td-error = { workspace = true }
td-objects = { workspace = true }

# External dependencies

serde = { workspace = true, features = ["derive"] }
strum = { workspace = true, features = ["derive"] }

# Development dependencies

[dev-dependencies]
# Deliberately cyclic (td-services depends on td-execution, which depends on
# this crate): cargo permits dev-dependency cycles. The plan-shape test runs
# the execute service to assert what this edition's graph options yield.
td-services = { workspace = true, features = ["td-test"] }
td-database = { workspace = true, features = ["test-utils"] }
td-queries = { workspace = true, features = ["test-utils"] }
td-test = { workspace = true }
te-execution = { workspace = true, features = ["td-test"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }


[target.'cfg(target_os = "linux")'.dependencies]
openssl = { workspace = true, features = ["vendored"] }
