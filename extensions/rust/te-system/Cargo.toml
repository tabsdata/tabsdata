[package]
description = "Tabsdata System Extension Implementation - Open Source"
name = "te-system"
build = "build.rs"

authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[lib]

[features]
enterprise = []
dummy = []
mock-env = []
td-test = [
    "dummy",
    "mock-env",
    "test-utils",
    "ta-system/td-test",
]
test-utils = []

[package.metadata.cargo-machete]
ignored = ["td-build", "te-system"]

[dependencies]

# Internal dependencies

ta-system = { workspace = true }

# External dependencies

[build-dependencies]
td-build = { workspace = true }

[dev-dependencies]
te-system = { workspace = true, features = ["td-test"] }

