[package]
description = "Tabsdata Server"
name = "td-server"
build = "build.rs"

authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[[bin]]
name = "tdserver"
path = "src/tdserver.rs"

[[bin]]
name = "tdkserver"
path = "src/tdkserver.rs"

[[bin]]
name = "td_about"
path = "src/tdabout.rs"

[[bin]]
name = "td_apiserver"
path = "src/apiserver.rs"

[[bin]]
name = "td_bootloader"
path = "src/bootloader.rs"

[[bin]]
name = "td_crontrigger"
path = "src/crontrigger.rs"

[[bin]]
name = "td_supervisor"
path = "src/supervisor.rs"

[[bin]]
name = "td_transporter"
path = "src/transporter.rs"

# tdk dummy workers (lifecycle simulators for K Pop -- internal testing only)

[[bin]]
name = "td_ic"
path = "src/dummy/tdk_ic.rs"

[[bin]]
name = "td_ac"
path = "src/dummy/tdk_ac.rs"

[[bin]]
name = "td_fc"
path = "src/dummy/tdk_fc.rs"

[[bin]]
name = "td_ec"
path = "src/dummy/tdk_ec.rs"

[features]
api-docs = []
enterprise = []
td-test = [
    "dummy",
    "mock-env",
    "test-utils",
    "td-apiserver/td-test",
    "td-common/td-test",
    "td-crontrigger/td-test",
    "td-process/td-test",
    "td-shuttle/td-test",
    "td-supervisor/td-test",
]
dummy = []
mock-env = []
test_logging = []
test_tower_metadata = []
test-utils = []

[package.metadata.cargo-machete]
ignored = ["openssl", "paste", "td-server", "td-tower", "toml", "utoipa", "utoipa-axum", "windows"]

# Build dependencies

[build-dependencies]

# Internal dependencies

td-build = { workspace = true }

[dependencies]

# Internal dependencies


## Macros

td-build = { workspace = true }
tm-workspace = { workspace = true }

## Libraries

td-apiserver = { workspace = true }
td-common = { workspace = true }
td-crontrigger = { workspace = true }
td-kubernetes = { workspace = true }
td-process = { workspace = true }
td-shuttle = { workspace = true }
td-supervisor = { workspace = true }

## Extensions

te-system = { workspace = true }

# External dependencies

clap = { workspace = true, features = ["derive"] }
path-slash = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }

[dev-dependencies]
td-server = { workspace = true, features = ["td-test"] }

[target.'cfg(target_os = "linux")'.dependencies]
openssl = { workspace = true, features = ["vendored"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security", "Win32_System_Threading"] }
windows-sys = { workspace = true, features = ["Win32", "Win32_System_Threading", "Win32_System_Console"] }
