[package]
description = "Tabsdata Supervisor"
name = "td-supervisor"
build = "build.rs"

authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[lib]

[features]
api-docs = []
enterprise = []
td-test = [
    "dummy",
    "mock-env",
    "test-utils",
    "td-apiserver/td-test",
    "td-common/td-test",
    "td-error/td-test",
    "td-process/td-test",
    "td-python/td-test",
    "te-system/td-test",
]
dummy = []
mock-env = []
test_logging = []
test-utils = []

[package.metadata.cargo-machete]
ignored = ["console", "ignore", "indicatif", "td-apiserver", "td-supervisor", "toml", "windows"]

# Build dependencies

[build-dependencies]

# Internal dependencies

td-build = { workspace = true }
td-python = { workspace = true }

# External dependencies

toml = { workspace = true }

[dependencies]

# Internal dependencies

## Macros

td-build = { workspace = true }
tm-workspace = { workspace = true }

## Libraries

td-apiserver = { workspace = true }
td-bridge = { workspace = true }
td-common = { workspace = true }
td-error = { workspace = true }
te-system = { workspace = true }
td-process = { workspace = true }
td-python = { workspace = true }

## Extensions

# External dependencies

async-trait = { workspace = true }
atomic_enum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive"] }
clap_derive = { workspace = true }
colored = { workspace = true }
console = { workspace = true, features = ["std"] }
derive_builder = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
getset = { workspace = true }
http = { workspace = true }
humantime = { workspace = true }
indicatif = { workspace = true, features = ["default", "improved_unicode"] }
ignore = { workspace = true }
include_dir = { workspace = true }
indexmap = { workspace = true }
linemux = { workspace = true }
netstat2 = { workspace = true }
num-format = { workspace = true }
path-slash = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
supports-color = { workspace = true }
strum = { workspace = true }
sysinfo = { workspace = true }
tabled = { workspace = true }
tempfile = { workspace = true }
terminal_size = { workspace = true }
textwrap = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
td-supervisor = { workspace = true, features = ["td-test"] }


[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security", "Win32_System_Threading"] }
windows-sys = { workspace = true, features = ["Win32", "Win32_System_Threading", "Win32_System_Console"] }
