[package]
description = "Tabsdata Test Features"
name = "td-test"
build = "build.rs"

authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[lib]

[features]
# Workspace convention (enforced by td-build's Manifest.toml descriptor): every
# crate's `td-test` umbrella feature aggregates the three workspace-standard
# marker features below plus its own dependency routing.
enterprise = []
td-test = [
    "dummy",
    "mock-env",
    "test-utils",
    "td-common/td-test",
    "td-database/td-test",
    "td-schema/td-test",
]
dummy = []
mock-env = []
test_logging = []
test_tower_metadata = []
test-utils = []

[package.metadata.cargo-machete]
ignored = ["openssl", "td-build", "td-schema", "td-test", "toml"]

# Build dependencies

[build-dependencies]

# Internal dependencies

td-build = { workspace = true }

# External dependencies

[dependencies]

# Internal dependencies

## Macros

tm-test = { workspace = true }

## Libraries

td-common = { workspace = true }
td-database = { workspace = true, features = ["test-utils"] }
td-schema = { workspace = true }

# External dependencies

base64 = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
homedir = { workspace = true }
object_store = { workspace = true }
path-slash = { workspace = true }
ring = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["full"] }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
whoami = { workspace = true }

[dev-dependencies]
td-test = { workspace = true, features = ["td-test"] }
temp-env = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
openssl = { workspace = true, features = ["vendored"] }
