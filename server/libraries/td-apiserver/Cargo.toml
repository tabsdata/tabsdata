url = { workspace = true }
utoipa = { workspace = true, features = ["axum_extras", "preserve_order", "uuid"] }
utoipa-axum = { workspace = true }
utoipa-swagger-ui = { workspace = true, features = ["axum", "reqwest"] }

[dev-dependencies]
td-apiserver = { workspace = true, features = ["td-test"] }
td-test = { workspace = true }

rand = { workspace = true }
indicatif = { workspace = true, features = ["rayon"] }
