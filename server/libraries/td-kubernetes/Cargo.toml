[package]
description = "Tabsdata Kubernetes"
name = "td-kubernetes"
build = "build.rs"

authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[lib]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(td_k8s_development)'] }

[features]
api-docs = []
enterprise = []
td-test = [
    "dummy",
    "mock-env",
    "test-utils",
]
dummy = []
mock-env = []
test_logging = []
test-utils = []

[package.metadata.cargo-machete]
ignored = ["openssl", "td-build", "te-system", "td-kubernetes", "tera"]

# Build dependencies

[build-dependencies]

# Internal dependencies

td-build = { workspace = true }

[dependencies]

# Internal dependencies

## Macros

td-build = { workspace = true }
tm-workspace = { workspace = true }

## Libraries

td-bridge = { workspace = true }
td-common = { workspace = true }
td-database = { workspace = true }
td-error = { workspace = true }
td-objects = { workspace = true }
td-python = { workspace = true }

## Extensions

te-system = { workspace = true }

# External dependencies

async-stream = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive"] }
clap_derive = { workspace = true }
colored = { workspace = true }
const_format = { workspace = true }
cron-descriptor = { workspace = true }
dirs = { workspace = true }
fslock = { workspace = true }
futures = { workspace = true }
