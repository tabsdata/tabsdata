[package]
description = "Tabsdata Kubernetes"
name = "td-kubernetes"
build = "build.rs"

authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[lib]

[features]
api-docs = []
enterprise = []
td-test = [
    "dummy",
    "mock-env",
    "test-utils",
]
dummy = []
mock-env = []
test_logging = []
test-utils = []

[package.metadata.cargo-machete]
ignored = ["openssl", "td-build", "td-kubernetes", "tm-workspace"]

# Build dependencies

[build-dependencies]

# Internal dependencies

td-build = { workspace = true }

[dependencies]

# Internal dependencies

## Macros

td-build = { workspace = true }
tm-workspace = { workspace = true }

## Libraries

td-common = { workspace = true }
td-python = { workspace = true }

## Extensions

# External dependencies

clap = { workspace = true, features = ["derive"] }
clap_derive = { workspace = true }
colored = { workspace = true }
dirs = { workspace = true }
getset = { workspace = true }
k8s-openapi = { workspace = true, features = ["latest"] }
kube = { workspace = true, default-features = false, features = ["client", "config", "rustls-tls"] }
reedline = { workspace = true }
rustls = { workspace = true, features = ["aws-lc-rs", "ring"] }
shlex = { workspace = true }
supports-color = { workspace = true }
terminal_size = { workspace = true }
textwrap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
td-kubernetes = { workspace = true, features = ["td-test"] }

[target.'cfg(target_os = "linux")'.dependencies]
openssl = { workspace = true, features = ["vendored"] }
