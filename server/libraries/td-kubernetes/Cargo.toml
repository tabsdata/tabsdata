[package]
description = "Tabsdata Kubernetes"
name = "td-kubernetes"
build = "build.rs"

authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[lib]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(td_k8s_development)'] }

[features]
api-docs = []
enterprise = []
td-test = [
    "dummy",
    "mock-env",
    "test-utils",
]
dummy = []
mock-env = []
test_logging = []
test-utils = []

[package.metadata.cargo-machete]
ignored = ["openssl", "td-build", "td-kubernetes", "tm-workspace"]

# Build dependencies

[build-dependencies]

# Internal dependencies

td-build = { workspace = true }

[dependencies]

# Internal dependencies

## Macros

td-build = { workspace = true }
tm-workspace = { workspace = true }

## Libraries

td-common = { workspace = true }
td-error = { workspace = true }
td-python = { workspace = true }

## Extensions

# External dependencies

async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive"] }
clap_derive = { workspace = true }
colored = { workspace = true }
dirs = { workspace = true }
indicatif = { workspace = true }
k8s-openapi = { workspace = true, features = ["latest"] }
kube = { workspace = true, default-features = false, features = ["client", "config", "runtime", "rustls-tls"] }
libc = { workspace = true }
reedline = { workspace = true }
rustls = { workspace = true, features = ["aws-lc-rs", "ring"] }
semver = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
shlex = { workspace = true }
strum = { workspace = true, features = ["derive"] }
supports-color = { workspace = true }
sysinfo = { workspace = true }
tera = { workspace = true }
terminal_size = { workspace = true }
textwrap = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
vfs = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
td-kubernetes = { workspace = true, features = ["td-test"] }
tempfile = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
openssl = { workspace = true, features = ["vendored"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true }
