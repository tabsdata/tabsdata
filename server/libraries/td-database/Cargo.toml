[package]
description = "Tabsdata Database Features"
name = "td-database"
build = "build.rs"

authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[lib]

[features]
# embedded-postgres is enabled for DEV, remove on release
default = ["embedded-postgres"]

enterprise = []
td-test = [
    "dummy",
    "mock-env",
    "test-utils",
    "td-common/td-test",
    "td-error/td-test",
    "td-schema/td-test",
    "td-security/td-test",
    "te-system/td-test",
]
dummy = []
mock-env = []
test_logging = []
# `test-utils` exposes the test pool factories in `td_database::test_utils`.
test-utils = []
# `embedded-postgres` enables the in-process Postgres server used by the
# apiserver's default-when-no-URL path.
embedded-postgres = ["dep:postgresql_embedded"]

[package.metadata.cargo-machete]
ignored = ["openssl", "strum", "td-build", "td-database", "thiserror", "toml"]

# Build dependencies

[build-dependencies]

# Internal dependencies

td-build = { workspace = true }

# External dependencies

[dependencies]

# Internal dependencies

## Macros

## Libraries

ta-services = { workspace = true }
td-error = { workspace = true }
td-common = { workspace = true }
td-schema = { workspace = true }
td-security = { workspace = true }
te-system = { workspace = true }

# External dependencies

async-trait = { workspace = true }
futures-util = { workspace = true }
inventory = { workspace = true }
postgresql_embedded = { workspace = true, features = ["bundled", "tokio"], optional = true }
sea-query = { workspace = true, features = ["derive", "sqlx-utils"] }
sea-query-sqlx = { workspace = true, features = ["sqlx-postgres"] }
serde = { workspace = true, features = ["derive"] }
serde_with = { workspace = true }
sqlx = { workspace = true, features = ["postgres"] }
strum = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }

[dev-dependencies]
serde_yaml = { workspace = true }
serial_test = { workspace = true }
td-database = { workspace = true, features = ["td-test"] }

[target.'cfg(target_os = "linux")'.dependencies]
openssl = { workspace = true, features = ["vendored"] }
