[package]
description = "Tabsdata Database Features"
name = "td-database"
build = "build.rs"

authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[lib]

[features]
enterprise = []
td-test = ["dummy", "mock-env", "test-utils"]
dummy = []
mock-env = []
test_logging = []
test_tower_metadata = []
test-utils = []
# database features
sqlite = ["sqlx/sqlite", "sea-query-sqlx/sqlx-sqlite"]
postgres = ["sqlx/postgres", "sea-query-sqlx/sqlx-postgres"]
mysql = ["sqlx/mysql", "sea-query-sqlx/sqlx-mysql"]

[package.metadata.cargo-machete]
ignored = ["openssl", "td-build", "td-database", "thiserror", "strum", "toml"]

# Build dependencies

[build-dependencies]

# Internal dependencies

td-build = { workspace = true }

# External dependencies

[dependencies]

# Internal dependencies

## Macros

## Libraries

td-error = { workspace = true }
td-common = { workspace = true }
td-schema = { workspace = true }
td-security = { workspace = true }
te-system = { workspace = true }

# External dependencies

async-stream = { workspace = true }
futures-util = { workspace = true }
sea-query = { workspace = true, features = ["derive", "sqlx-utils"] }
sea-query-sqlx = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_with = { workspace = true }
sqlx = { workspace = true }
