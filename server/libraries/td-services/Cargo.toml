[dev-dependencies]
# Test-only, and deliberately cyclic (td-apiserver depends on td-services):
# cargo permits dev-dependency cycles. The scheduler's dispatch tests assert on
# the callbacks and token scopes it builds, so they read the apiserver's served
# route templates instead of a second copy of them.
td-apiserver = { workspace = true }
td-services = { workspace = true, features = ["td-test"] }
td-database = { workspace = true, features = ["test-utils"] }
td-test = { workspace = true }

temp-env = { workspace = true, features = ["async_closure"] }

