[package]
description = "Tabsdata Python Enablement Components"
name = "td-python"

authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[lib]

[features]
enterprise = []
td-test = [
    "dummy",
    "mock-env",
    "test-utils",
    "td-common/td-test",
    "td-error/td-test",
]
dummy = []
mock-env = []
test_logging = []
test-utils = []

[package.metadata.cargo-machete]
ignored = ["openssl", "td-python", "strum", "thiserror", "toml", "windows"]

# Build dependencies

[build-dependencies]

# Internal dependencies

[dependencies]

# Internal dependencies

## Libraries

td-build = { workspace = true }
td-common = { workspace = true }
td-error = { workspace = true }

## Macros

# External dependencies

rand = { workspace = true }
semver = { workspace = true }
strum = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
td-python = { workspace = true, features = ["td-test"] }

[target.'cfg(target_os = "linux")'.dependencies]
openssl = { workspace = true, features = ["vendored"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security", "Win32_System_Threading"] }
windows-sys = { workspace = true, features = ["Win32", "Win32_System_Threading", "Win32_System_Console"] }
