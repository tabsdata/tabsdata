[build-dependencies]

# Internal dependencies

td-build = { workspace = true }

# External dependencies

toml = { workspace = true }

[dependencies]

# Internal dependencies


## Macros

td-build = { workspace = true }
tm-workspace = { workspace = true }

## Libraries

td-common = { workspace = true }
td-error = { workspace = true }
td-process = { workspace = true }
td-tableframe = { workspace = true }
