[build-system]
requires = []
build-backend = "setuptools.build_meta"

[project]
name = "tabsdata"
description = "Tabsdata is a publish-subscribe (pub/sub) server for tables."
authors = [{name = "Tabs Data Inc."}]
keywords = [
    "tabsdatta",
    "data",
    "tables",
    "pub/sub",
    "publish/subscribe",
]
classifiers = [
    "Development Status :: Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: JavaScript",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
]
dynamic = [
    "version",
    "license",
    "readme",
    "requires-python",
    "dependencies",
    "optional-dependencies",
    "scripts",
]

[project.urls]
Homepage = "https://tabsdata.com"
Documentation = "https://docs.tabsdata.com"
Source = "https://github.com/tabsdata/tabsdata"

[tool.pytest.ini_options]
norecursedirs = ["./templates"]

[tool.coverage.html]
directory = "coverage_html_report"

[tool.coverage.report]
exclude_also = [
    "@(abc\\.)?abstractmethod",
]

[tool.licensecheck]
using = "requirements:requirements.txt"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".tabsdata",
    ".venv",
    "dist",
    "build",
    "tabsdata-ui",
    "target",
    "/templates",
    "venv",
    "*.pyi",
    "docker/",
]
extend-exclude = [
    "**/src/utest/**",
]

[tool.ruff.format]
preview = true
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "W",
    "C90",
]
extend-select = [
    "E9",
    "F63",
    "F7",
    "F82"
]
ignore = []
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = [
    "tabsdata",
    "test_tabsdata",
    "test_tabsdata_agent",
    "test_tabsdata_bigquery",
    "test_tabsdata_databricks",
    "test_tabsdata_example",
    "test_tabsdata_kafka",
    "test_tabsdata_mongodb",
    "test_tabsdata_mssql",
    "test_tabsdata_salesforce",
    "test_tabsdata_snowflake",
    "test_tabsdata_toolkit",
    "test_ta_features",
    "test_ta_tableframe",
    "test_te_examples",
    "test_te_tableframe",
    "test_te_variant",
    "test_to_foundation",
    "test_ty_tableframe",
]
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.tabsdata]
name = "tabsdata"
display = "Tabsdata"
