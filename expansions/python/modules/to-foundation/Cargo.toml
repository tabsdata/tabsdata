[package]
description = "Tabsdata PyO3 Module for Foundation Features"
name = "to-foundation"

authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[[bin]]
name = "to_pystubs"
path = "src/pystubs.rs"
required-features = ["pyconfig-init"]

[[bin]]
name = "td_python"
path = "src/python.rs"

[lib]
name = "to_foundation"
crate-type = ["cdylib", "rlib"]

[package.metadata.maturin]
name = "foundation"

[features]

pyconfig-init = []
without-polars-alloc = []

td-test = ["dummy"]
dummy = []

extension-module = ["pyo3/extension-module"]

[package.metadata.cargo-machete]
ignored = ["openssl", "td-build", "td-error", "td-common", "thiserror", "toml"]

# Build dependencies

[build-dependencies]

# Internal dependencies

[dependencies]

# Internal dependencies

## Libraries

td-build = { workspace = true }
td-common = { workspace = true }
td-error = { workspace = true }

## Macros

tm-pyo3 = { workspace = true }

# External dependencies

pyo3 = { workspace = true, features = ["abi3-py312", "anyhow", "macros", "multiple-pymethods", "num-bigint", "num-complex", "num-rational", "rust_decimal", "serde", "smallvec"] }
pyo3-log = { workspace = true }
pyo3-stub-gen = { workspace = true }
tracing = { workspace = true }


[target.'cfg(target_os = "linux")'.dependencies]
openssl = { workspace = true, features = ["vendored"] }
