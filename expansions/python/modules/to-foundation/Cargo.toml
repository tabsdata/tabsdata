[package]
description = "Tabsdata PyO3 Module for Foundation Features"
name = "to-foundation"

authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[[bin]]
name = "to_pystubs"
path = "src/pystubs.rs"
required-features = ["pyconfig-init"]

[[bin]]
name = "td_python"
path = "src/python.rs"

[lib]
name = "to_foundation"
crate-type = ["cdylib", "rlib"]

[package.metadata.maturin]
name = "foundation"

[features]

pyconfig-init = []
without-polars-alloc = []

td-test = ["dummy"]
dummy = []

extension-module = ["pyo3/extension-module"]

[package.metadata.cargo-machete]
ignored = ["liblzma-sys", "td-build", "td-error", "td-common", "toml"]

# Build dependencies

[build-dependencies]

pyo3-build-config = { workspace = true }

# Internal dependencies

[dependencies]

# Internal dependencies

## Libraries

td-build = { workspace = true }
td-common = { workspace = true }
td-error = { workspace = true }

## Macros

tm-pyo3 = { workspace = true }

# External dependencies

arrow = { workspace = true }
arrow-avro = { workspace = true }
base64 = { workspace = true }
brotli-decompressor = { workspace = true }
bytes = { workspace = true }
bzip2 = { workspace = true }
calamine = { workspace = true }
chrono = { workspace = true }
csv-core = { workspace = true }
flate2 = { workspace = true }
image = { workspace = true, features = ["png"] }
liblzma = { workspace = true }
liblzma-sys = { workspace = true }
lz4_flex = { workspace = true }
pyo3 = { workspace = true, features = ["abi3-py312", "anyhow", "macros", "multiple-pymethods", "num-bigint", "num-complex", "num-rational", "rust_decimal", "serde", "smallvec"] }
pyo3-log = { workspace = true }
pyo3-stub-gen = { workspace = true }
ratatui = { workspace = true }
ratatui-image = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]

tm-workspace = { workspace = true }

brotli = { workspace = true }
serde_json = { workspace = true }


