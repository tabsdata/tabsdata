[package]
description = "Tabsdata Rust PyO3 Expansions"
name = "to-expansions"
edition = "2024"
version = "2.4.1"
license = "Apache 2.0"
build = "build.rs"

[workspace.package]
authors = [
    "Aleix Lascorz Guiu    (tabsleix)      <aleix@tabsdata.com>",
    "Alejandro Abdelnur    (tucu0)         <tucu@tabsdata.com>",
    "Arvind Prabhakar      (aptabs)        <arvind@tabsdata.com>",
    "David Sánchez Frías   (tabsdavid)     <david@tabsdata.com>",
    "Dimas Cabré i Chacón  (aoinokimi)     <dragon@tabsdata.com>",
    "Joaquín Bo Díaz       (joaquin041)    <joaquin@tabsdata.com>",
    "Shreyas Vankayalapati (shreyasvan001) <shreyans@tabsdata.com>"
]
edition = "2024"
homepage = "https://www.tabsdata.com"
license = "Apache 2.0"
publish = false
readme = "../../README.md"
repository = "https://github.com/tabsdata/tabsdata"
rust-version = "1.99.1"
version = "2.4.1"

[workspace]
members = [
    "./modules/to-foundation",
]

[[bin]]
name = "auto"
path = "auto.rs"

[profile.dev]
codegen-units = 4096
debug = true
incremental = true
lto = "off"
opt-level = 0
panic = "unwind"
strip = "none"

[profile.dev.package."*"]
debug = false

[profile.integration]
inherits = "release"
codegen-units = 16
incremental = true
lto = false
opt-level = 0

[profile.assembly]
inherits = "release"
codegen-units = 1
debug = 0
incremental = false
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "debuginfo"

[package.metadata.cargo-machete]
ignored = ["toml", "td-build", "ta-system", "te-system"]

[features]

# This feature enbles enterprise functionalities not available in the open source implementation.
# It should be normally used only for cross-crates tests.
enterprise = []

td-test = ["dummy"]
dummy = []

# Internal dependencies

## Libraries

[workspace.dependencies.td-build]
path = "../../devutils/automation/tasks/cargo/td-build"

## Macros

[workspace.dependencies.tm-pyo3]
path = "../../macros/facets/tm-pyo3"

[workspace.dependencies.tm-workspace]
path = "../../macros/facets/tm-workspace"

[workspace.dependencies.ta-system]
path = "../../server/libraries/ta-system"

[workspace.dependencies.te-system]
path = "../../extensions/rust/te-system"

[workspace.dependencies.td-common]
path = "../../server/libraries/td-common"

[workspace.dependencies.td-error]
path = "../../server/libraries/td-error"

# External dependencies

[workspace.dependencies.arrow]
version = "60.1.0"
default-features = false
features = ["ffi"]

[workspace.dependencies.arrow-avro]
version = "60.1.0"

[workspace.dependencies.base64]
version = "0.23.1"

[workspace.dependencies.brotli]
version = "8.0.4"

[workspace.dependencies.brotli-decompressor]
version = "5.0.3"

[workspace.dependencies.bytes]
version = "1.12.1"

[workspace.dependencies.bzip2]
version = "0.6.1"

[workspace.dependencies.calamine]
version = "0.38.0"

[workspace.dependencies.chrono]
version = "0.4.45"

[workspace.dependencies.flate2]
version = "1.1.10"

[workspace.dependencies.csv-core]
version = "0.1.13"

[workspace.dependencies.image]
version = "0.25.10"
default-features = false

[workspace.dependencies.libc]
version = "0.2.191"

[workspace.dependencies.liblzma]
version = "0.4.9"

[workspace.dependencies.liblzma-sys]
version = "0.4.9"
features = ["static"]

[workspace.dependencies.lz4_flex]
version = "0.14.0"
features = ["frame"]

[workspace.dependencies.pyo3]
version = "0.30.1"
features = ["abi3-py312", "anyhow", "macros", "multiple-pymethods", "num-bigint", "num-complex", "num-rational", "rust_decimal", "serde", "smallvec"]

[workspace.dependencies.pyo3-log]
version = "0.13.5"

[workspace.dependencies.pyo3-build-config]
version = "0.30.1"

[workspace.dependencies.pyo3-stub-gen]
version = "0.23.2"

[workspace.dependencies.pyo3-stub-gen-derive]
version = "0.23.2"

[workspace.dependencies.ratatui]
version = "0.30.2"
default-features = false

[workspace.dependencies.ratatui-image]
version = "11.1.0"
default-features = false

[workspace.dependencies.serde_json]
version = "1.0.154"

[workspace.dependencies.thiserror]
version = "2.0.21"

[workspace.dependencies.toml]
version = "1.1.8"

[workspace.dependencies.tracing]
version = "0.1.44"

[workspace.dependencies.tracing-subscriber]
version = "0.3.23"

[workspace.dependencies.zstd]
version = "0.14.3"

[build-dependencies]

# Internal dependencies

td-build = { workspace = true }

# External dependencies

toml = { workspace = true }

[dependencies]

# Internal dependencies

ta-system = { workspace = true }
te-system = { workspace = true }


# External dependencies

