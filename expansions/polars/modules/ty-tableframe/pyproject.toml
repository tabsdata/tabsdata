[build-system]
requires = [
    "archspec==0.2.5",
    "colorama==0.4.6",
    "maturin==1.11.5",
    "polars==1.38.1",
    "psutil==7.2.2",
    "py-cpuinfo==9.0.0",
    "PyYAML==6.0.3",
    "setuptools==78.1.1",
    "tqdm==4.67.3",
    "tzlocal==5.3.1"]
build-backend = "maturin"

[tool.flake8]
exclude = ["*.pyi"]

[project]
name = "ty-tableframe"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]

[tool.maturin]
python-source = "python/src/main/python"
module-name = "tabsdata.expansions.tableframe._tableframe"
compatibility = "musllinux_1_1"

[tool.black]
line-length = 88
preview = true
extend-exclude = '\.pyi$'
enable-unstable-feature = ["string_processing"]

[tool.coverage.html]
directory = "coverage_html_report"

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_also = [
    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
]

[tool.isort]
profile = "black"
skip_glob = ["*.pyi"]
known_first_party = [
    "tabsdata",
    "ta_features",
    "ta_tableframe",
    "te_examples",
    "te_tableframe",
    "te_variant",
    "to_foundation",
    "ty_tableframe",
    "test_tabsdata",
    "test_tabsdata_agent",
    "test_tabsdata_bigquery",
    "test_tabsdata_databricks",
    "test_tabsdata_example",
    "test_tabsdata_kafka",
    "test_tabsdata_mongodb",
    "test_tabsdata_mssql",
    "test_tabsdata_salesforce",
    "test_tabsdata_snowflake",
    "test_ta_features",
    "test_ta_tableframe",
    "test_te_examples",
    "test_te_tableframe",
    "test_te_variant",
    "test_to_foundation",
    "test_ty_tableframe",
]
known_third_party = ["docker"]
skip = ["docker/"]

[tool.licensecheck]
using = "requirements:requirements.txt"