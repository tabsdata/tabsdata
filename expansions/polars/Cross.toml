# docker run -it --rm --platform linux/amd64 ghcr.io/cross-rs/x86_64-unknown-linux-musl:main bash

[target.x86_64-unknown-linux-musl]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-musl:main"
pre-build = [
    "ln -snf /home/runner/.theseus /root/.theseus",
    "echo ...",
    "echo Configuring regional settings...",
    "export DEBIAN_FRONTEND=noninteractive",
    "export TZ=Etc/UTC",
    "ln -snf /usr/share/zoneinfo/$TZ /etc/localtime && echo $TZ > /etc/timezone",
    "echo Updating package manager...",
    "apt-get update",
    "apt-get install -y software-properties-common",
    "add-apt-repository ppa:deadsnakes/ppa -y",
    "apt-get update",
    "echo Installing dependencies...",
    "apt-get install -y curl",
    "apt-get install -y clang",
    "apt-get install -y libssl3t64",
    "apt-get install -y libgssapi-krb5-2",
    "getent passwd 1001 || echo 'runner:x:1001:1001::/home/runner:/bin/bash' >> /etc/passwd",
    "echo Installing python...",
    "apt-get install -y python3.12",
    "apt-get install -y python3.12-dev",
    "apt-get install -y python3.12-venv",
    "echo Configuring python...",
    "update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.12 1",
    "update-alternatives --install /usr/bin/python python /usr/bin/python3.12 1",
    "echo Installing pip...",
    "curl -sS https://bootstrap.pypa.io/get-pip.py | python3.12",
    "python -m pip install --upgrade pip",
    "echo Checking python and pip...",
    "python --version",
    "python3 --version",
    "pip --version",
    "pip3 --version",
    "echo Installing maturin...",
    "pip install maturin[patchelf]==1.9.4",
    "echo Checking maturin...",
    "rustc --version",
    "cargo --version",
    "maturin --version",
    "patchelf --version",
    "echo Done!",
]

[target.x86_64-unknown-linux-musl.env]
volumes = ["TABSDATA_SOLUTION_HOME", "THESEUS_CACHE_HOME"]
passthrough = [
    # >>> passthrough:MOUNTS:BEGIN >>>
    "TABSDATA_SOLUTION_HOME",
    "THESEUS_CACHE_HOME",
    # >>> passthrough:MOUNTS:END >>>
    "CC_x86_64_unknown_linux_gnu=clang",
    "CXX_x86_64_unknown_linux_gnu=clang++",
    "HOME=/home/runner",
    "TD_CROSS_BUILD=true",
    # >>> passthrough:MAKE:BEGIN >>>
    "TD_ON_GA",
    "CARGO_TERM_COLOR",
    "RUST_BACKTRACE",
    "RUST_LOG",
    "RUSTDOC_LOG",
    "RUST_TEST_THREADS",
    "TD_CLI_SHOW",
    "TD_SHOW_ENV",
    "LOG_CRATE_TM_WORKSPACE",
    "LOG_CRATE_TD_BUILD",
    "TD_DISABLE_OPENAPI_DOCS_ENDPOINT",
    "REQUIRE_SERVER_BINARIES",
    "REQUIRE_THIRD_PARTY",
    "TD_IGNORE_CONNECTOR_REQUIREMENTS",
    "TD_SKIP_NON_EXISTING_ASSETS",
    "TD_SETUP_GENERATE_LOCKS",
    "PYTHON_IGNORE_UNAVAILABLE_PUBLIC_PACKAGES",
    "TD_AIAGENT_BASELINE_FILE",
