[tasks.start]
plugin = "td-task-tracker"
category = "90 - Lifecycle"
description = "Handle make tasks start"
private = false
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds

    project_tabsdata_root_folder = get_env PROJECT_TABSDATA_ROOT_FOLDER
    ko = starts_with ${project_tabsdata_root_folder} "\${"
    if ${ko}
        exit 0
    end

    os = os_family
    debug "🏈 Current os: ${os}"
    if eq ${os} "windows"
        temp = temp_dir
        marker = join_path ${temp} .td.make
        exists = is_path_exists ${marker}
        debug "🍐 The marker temp file is ${marker}"
        if ${exists}
            debug "🍅 Marker for make exists. Skipping setup."
            ok = rm ${marker}
            exit 0
        end
        debug "🍏 Marker for make does not exist. Resuming setup."
        ok = touch ${marker}
    else
        pid = pid
        debug "🏀 Current proces id: ${pid}"
        output = exec ps -o ppid= -p ${pid}
        ppid = trim ${output.stdout}
        debug "🥎 Parent process id: ${ppid}"
        temp = temp_dir
        pid_marker = join_path ${temp} .td.pid.${pid}
        ppid_marker = join_path ${temp} .td.pid.${ppid}
        debug "🍊 The pid temp file is ${pid_marker}"
        debug "🍋 The ppid temp file is ${ppid_marker}"
        exists = is_path_exists ${pid_marker}
        if ${exists}
            debug "🍅 Marker for pid exists. Skipping setup."
            ok = rm ${pid_marker}
            exit 0
        end
        debug "🍏 Marker for pid does not exist. Resuming setup."
        ok = touch ${ppid_marker}
    end

    make_with_banners = get_env TD_MAKE_WITH_BANNERS
    make_with_banners_empty = is_empty ${make_with_banners}
    make_with_banners_true = eq ${make_with_banners} "true"
    make_with_banners = set ${make_with_banners_empty} or ${make_with_banners_true}
    if ${make_with_banners}
        cm_run_task banner
    end

    info "🐢 Running task: ${CARGO_MAKE_TASK}"
    if is_info
        echo ""
    end

    user_home = get_env HOME
    info "🏠 User HOME: ${HOME}"
    if is_info
        echo ""
    end

    no_user_home = eq ${user_home} ""
    if ${no_user_home}
        error "🚷 Environment variable HOME is not defined. Please set it before running this script."
        error "🚷 The USERPROFILE Windows environment variable will not work. Use HOME instead."
        if is_error
            echo ""
        end
        exit 1
    end

    user_home_exists = is_path_exists ${user_home}
    if not ${user_home_exists}
        error "🚷 Environment variable HOME points to a non-existing path: ${user_home}"
        if is_error
            echo ""
        end
        exit 1
    end

    user_home_is_dir = is_dir ${user_home}
    if not ${user_home_is_dir}
        error "🚷 Environment variable HOME points to a non-folder path: ${user_home}"
        if is_error
            echo ""
        end
        exit 1
    end

    PATH = get_env PATH
    debug "✅ Real PATH: ${PATH}"

    on_ga_for_defaults = get_env TD_ON_GA
    if eq ${on_ga_for_defaults} "true"
        set_env TD_AUTO_LICENSE "true"
        set_env TD_WITH_PERMIT "true"
    end
    auto_license = get_env TD_AUTO_LICENSE
    if not eq ${auto_license} "true"
        set_env TD_AUTO_LICENSE "false"
    end

    with_permit = get_env TD_WITH_PERMIT
    with_permit_true = eq ${with_permit} "true"
    if ${with_permit_true}
        with_permit = set true
    else
        with_permit = set false
    end
    at_fast = get_env TD_AT_FAST
    at_fast = eq ${at_fast} "true"
    at_warp = get_env TD_AT_WARP
    at_warp = eq ${at_warp} "true"
    demands_permit = set false
    if eq ${on_ga_for_defaults} "true"
        demands_permit = set true
    end
    arguments = split ${CARGO_MAKE_TASK_ARGS} ;
    for argument in ${arguments}
        argument = trim ${argument}
        is_permit = eq ${argument} "--permit"
        if ${is_permit}
            with_permit = set true
            demands_permit = set true
        end
        is_no_permit = eq ${argument} "--no-permit"
        if ${is_no_permit}
            with_permit = set false
            demands_permit = set false
        end
        if eq ${argument} "--fast"
            at_fast = set true
        end
        if eq ${argument} "--warp"
            at_warp = set true
        end
    end
    make_task = get_env CARGO_MAKE_TASK
    backends_tasks = map
    map_put ${backends_tasks} tabsdata_start true
    map_put ${backends_tasks} tabsdata_stop true
    map_put ${backends_tasks} tabsdata_drop true
    map_put ${backends_tasks} tabsdata_status true
    map_put ${backends_tasks} tabsdata_info true
    map_put ${backends_tasks} tabsdata_list true
    map_put ${backends_tasks} systems_create true
    map_put ${backends_tasks} systems_destroy true
    map_put ${backends_tasks} systems_status true
    map_put ${backends_tasks} systems_info true
    map_put ${backends_tasks} systems_list true
    map_put ${backends_tasks} domains_create true
    map_put ${backends_tasks} domains_destroy true
    map_put ${backends_tasks} domains_status true
    map_put ${backends_tasks} domains_info true
    map_put ${backends_tasks} domains_list true
    is_backends_task = map_contains_key ${backends_tasks} ${make_task}
    release ${backends_tasks}
    if ${is_backends_task}
        at_fast = set true
    end

    if ${at_warp}
        at_fast = set true
    end
    if ${at_fast}
        if not ${demands_permit}
            with_permit = set false
        end
        set_env TD_AT_FAST "true"
        set_env TD_MAKE_WITH_BANNERS "false"
        set_env TD_MAKE_WITH_RESPONSIVE "false"
    end
    if ${at_warp}
        if not ${demands_permit}
            with_permit = set false
        end
        set_env TD_AT_WARP "true"
        set_env TD_MAKE_WITH_BANNERS "false"
        set_env TD_MAKE_WITH_RESPONSIVE "false"
    end
    if ${with_permit}
        set_env TD_WITH_PERMIT "true"
    else
        set_env TD_WITH_PERMIT "false"
    end

    is_permit_task = starts_with ${make_task} "permit"
    if eq ${make_task} "update"
        is_permit_task = set true
    end
    if eq ${make_task} "docs"
        noop
    elseif eq ${make_task} "setup"
        noop
    elseif ${is_permit_task}
        debug "✈️ Skipping proactive permit; '${make_task}' is itself a permit task."
    elseif ${with_permit}
        cm_run_task permit
    else
        warn "✈️ Skipping permit"
        if is_warn
            echo ""
        end
    end

    td_override_build_timestamp = get_env TD_OVERRIDE_BUILD_TIMESTAMP
    if eq ${td_override_build_timestamp} "true"
        td_build_timestamp = current_time
        set_env TD_BUILD_TIMESTAMP ${td_build_timestamp}
        td_build_timestamp = get_env TD_BUILD_TIMESTAMP
        info "🔩 TD_OVERRIDE_BUILD_TIMESTAMP is 'true'. Using 'TD_BUILD_TIMESTAMP': '${td_build_timestamp}'."
    end

    on_ga = get_env TD_ON_GA
    on_ga_true = eq ${on_ga} "true"
    if ${on_ga_true}
        td_vcore_path = get_env TD_VCORE_PATH
        if eq ${td_vcore_path} ""
            noop
        else
            echo "🐵 CI python virtual environment is set: ${td_vcore_path}"

            # source ${td_vcore_path}

            python_version = exec python --version
            python_version = trim ${python_version.stdout}
            echo "🐵 CI Core python version: ${python_version}"

            python_path = exec which python
            python_path = trim ${python_path.stdout}
            echo "🐵 CI python path: ${python_path}"

            pip_path = exec which pip
            pip_path = trim ${pip_path.stdout}
            echo "🐵 CI pip path: ${pip_path}"
        end
    end
    ''']
