[tasks.failure]
plugin = "td-task-tracker"
category = "90 - Lifecycle"
description = "Handle make errors"
private = false
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds

    os_family = os_family

    dump_duckscript = get_env TD_DUMP_DUCKSCRIPT
    if eq ${dump_duckscript} "true"
        python = which python
        if not is_empty ${python}
            exec python ./make/make-os/libraries/failure.py ./target/make/notes
        end
    else
        info "If the error above comes from duckscript code, run again with TD_DUMP_DUCKSCRIPT=true to print the script of the failed task, numbered as in the error line"
    end

    make_with_banners = get_env TD_MAKE_WITH_BANNERS
    make_with_banners_empty = is_empty ${make_with_banners}
    make_with_banners_true = eq ${make_with_banners} "true"
    make_with_banners = set ${make_with_banners_empty} or ${make_with_banners_true}

    if ${make_with_banners}
        if eq ${os_family} "windows"
            cm_run_task failure_windows
        else
            if eq ${os_family} "mac"
                cm_run_task failure_mac
            else
                if eq ${os_family} "linux"
                    cm_run_task failure_linux
                end
            end
        end
    else
        echo "⭕️ Ko!"
    end
    ''']

[tasks.failure_windows]
plugin = "td-task-tracker"
category = "90 - Lifecycle"
private = true
ignore_errors = true
env = { MAKE_SUCCESS = "false" }

[tasks.failure_linux]
plugin = "td-task-tracker"
category = "90 - Lifecycle"
private = true
ignore_errors = true
env = { MAKE_SUCCESS = "false" }

[tasks.failure_mac]
plugin = "td-task-tracker"
category = "90 - Lifecycle"
private = true
ignore_errors = true
env = { MAKE_SUCCESS = "false" }
script = [
    '''
    if [[ -z "$PROJECT_TABSDATA_ROOT_FOLDER" || ! -d "$PROJECT_TABSDATA_ROOT_FOLDER" ]]; then
        TD_ROOT="."
    else
        TD_ROOT="$PROJECT_TABSDATA_ROOT_FOLDER"
    fi

    if command -v imgcat &> /dev/null; then
        echo
        imgcat --width 32 ${TD_ROOT}/make/make-os/resources/images/ferri-sad.png
    fi
    if command -v lolcat &> /dev/null && command -v figlet &> /dev/null; then
        echo
        figlet -f ${TD_ROOT}/make/make-os/resources/fonts/3d.flf Failed! | lolcat
        echo
    else
        echo "⭕️ Ko!"
    fi
    ''']
