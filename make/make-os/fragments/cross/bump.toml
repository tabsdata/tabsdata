[tasks.__os__bump]
plugin = "td-task-tracker"
category = "02 - Tidy"
private = true
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds

    parts = split ${CARGO_MAKE_TASK_ARGS} ";"
    q_parts = array_length ${parts}
    if not eq ${q_parts} 2
        error "❌ Usage: cargo make bump <old_version> <new_version>"
        exit 1
    end
    old_version = array_get ${parts} 0
    new_version = array_get ${parts} 1
    info "🔖 Bumping version from ${old_version} to ${new_version}"

    project = set ${PROJECT_TABSDATA_BASE_FOLDER}/../tabsdata-ee
    project_exists = is_path_exists ${project}
    if ${project_exists}
        cd ${project}/macros/
        info "🚀 cargo workspaces -v version custom ${new_version} --all --no-git-commit --yes --force \"*\""
        exec --fail-on-error cargo workspaces -v version custom ${new_version} --all --no-git-commit --yes --force "*"

        cd ${project}/
        info "🚀 cargo workspaces -v version custom ${new_version} --all --no-git-commit --yes --force \"*\""
        exec --fail-on-error cargo workspaces -v version custom ${new_version} --all --no-git-commit --yes --force "*"

        cd ${project}/expansions/python/
        info "🚀 cargo workspaces -v version custom ${new_version} --all --no-git-commit --yes --force \"*\""
        exec --fail-on-error cargo workspaces -v version custom ${new_version} --all --no-git-commit --yes --force "*"

        cd ${project}/expansions/polars/
        info "🚀 cargo workspaces -v version custom ${new_version} --all --no-git-commit --yes --force \"*\""
        exec --fail-on-error cargo workspaces -v version custom ${new_version} --all --no-git-commit --yes --force "*"

        cd ${project}/
        info "🚀 python ${BUMP_VERSION_SCRIPT} ${project} ${new_version}"
        exec --fail-on-error python ${BUMP_VERSION_SCRIPT} ${project} ${new_version}
    end

    project = set ${PROJECT_TABSDATA_BASE_FOLDER}/../tabsdata-ag
    project_exists = is_path_exists ${project}
    if ${project_exists}
        cd ${project}/
        info "🚀 python ${BUMP_VERSION_SCRIPT} ${project} ${new_version}"
        exec --fail-on-error python ${BUMP_VERSION_SCRIPT} ${project} ${new_version}
    end

    project = set ${PROJECT_TABSDATA_BASE_FOLDER}/../tabsdata-ui
    project_exists = is_path_exists ${project}
    if ${project_exists}
        cd ${project}/
        info "🚀 python ${BUMP_VERSION_SCRIPT} ${project} ${new_version}"
        exec --fail-on-error python ${BUMP_VERSION_SCRIPT} ${project} ${new_version}
    end

    km_primary = get_env TD_KM_PROJECT_PRIMARY_NAME
    km_alternate = get_env TD_KM_PROJECT_ALTERNATE_NAME
    project = set ${PROJECT_TABSDATA_BASE_FOLDER}/../${km_primary}
    project_exists = is_path_exists ${project}
    if not ${project_exists}
        project = set ${PROJECT_TABSDATA_BASE_FOLDER}/../${km_alternate}
        project_exists = is_path_exists ${project}
    end
    if ${project_exists}
        cd ${project}/mods/kcommon
        info "🚀 cargo set-version ${new_version}"
        exec --fail-on-error cargo set-version ${new_version}

        cd ${project}/mods/kminus
        info "🚀 cargo set-version ${new_version}"
        exec --fail-on-error cargo set-version ${new_version}

        cd ${project}/mods/pod-runner
        info "🚀 cargo set-version ${new_version}"
        exec --fail-on-error cargo set-version ${new_version}

        cd ${project}/
        info "🚀 python ${BUMP_VERSION_SCRIPT} ${project} ${new_version}"
        exec --fail-on-error python ${BUMP_VERSION_SCRIPT} ${project} ${new_version}
    end

    project = set ${PROJECT_TABSDATA_BASE_FOLDER}/../tabsdata-os
    project_exists = is_path_exists ${project}
    if ${project_exists}
        cd ${project}/macros/
        info "🚀 cargo workspaces -v version custom ${new_version} --all --no-git-commit --yes --force \"*\""
        exec --fail-on-error cargo workspaces -v version custom ${new_version} --all --no-git-commit --yes --force "*"

        cd ${project}/
        info "🚀 cargo workspaces -v version custom ${new_version} --all --no-git-commit --yes --force \"*\""
        exec --fail-on-error cargo workspaces -v version custom ${new_version} --all --no-git-commit --yes --force "*"

        cd ${project}/expansions/python/
        info "🚀 cargo workspaces -v version custom ${new_version} --all --no-git-commit --yes --force \"*\""
        exec --fail-on-error cargo workspaces -v version custom ${new_version} --all --no-git-commit --yes --force "*"

        cd ${project}/expansions/polars/
        info "🚀 cargo workspaces -v version custom ${new_version} --all --no-git-commit --yes --force \"*\""
        exec --fail-on-error cargo workspaces -v version custom ${new_version} --all --no-git-commit --yes --force "*"

        cd ${project}/
        info "🚀 python ${BUMP_VERSION_SCRIPT} ${project} ${new_version}"
        exec --fail-on-error python ${BUMP_VERSION_SCRIPT} ${project} ${new_version}
    end

    base_folder = set ${PROJECT_TABSDATA_BASE_FOLDER}/..
    info "🔍 python ${SCAN_VERSION_SCRIPT} ${base_folder} ${old_version} ${new_version}"
    exec --fail-on-error python ${SCAN_VERSION_SCRIPT} ${base_folder} ${old_version} ${new_version}

    ''']