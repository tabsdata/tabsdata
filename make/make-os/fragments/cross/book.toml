[tasks.book_dguide]
plugin = "td-task-tracker"
category = "50 - Documentation"
cwd = "${PROJECT_TABSDATA_ROOT_FOLDER}"
description = "Read book 'Tabsdata Developer Guide'"
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds

    debug "🚀 python ${SERVE_BOOK_SCRIPT} ${BOOK_DEVELOPER_GUIDE_FOLDER} ${TEDS_PY_SCRIPT}"
    exec --fail-on-error python "${SERVE_BOOK_SCRIPT}" "${BOOK_DEVELOPER_GUIDE_FOLDER}" "${TEDS_PY_SCRIPT}"
    ''']
