[tasks.__os__brush_rs_expansions]
plugin = "td-task-tracker"
category = "01 - Clean"
private = true
run_task = [
    { name = [
        "__os__brush_rs_expansions_python",
        "__os__brush_rs_expansions_polars"
    ] }
]

[tasks.__os__brush_rs_expansions_python]
plugin = "td-task-tracker"
category = "01 - Clean"
private = true
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds

    wheels_folder = join_path ${PROJECT_RS_TO_EXPANSIONS_PYTHON_FOLDER} target wheels
    if is_directory ${wheels_folder}
        info "🧹 Brushing wheels folder: ${wheels_folder}"
        rm -r ${wheels_folder}
    end

    brush_roots = array
    components_folders = array modules extensions
    for component_folder in ${components_folders}
        component_path = join_path ${PROJECT_RS_TO_EXPANSIONS_PYTHON_FOLDER} ${component_folder}
        is_dir = is_directory ${component_path}
        if ${is_dir}
            cd "${component_path}"
            python_folders = glob_array ./*/python/src/main/python
            for python_folder in ${python_folders}
                python_folder = join_path ${component_path} ${python_folder}
                is_python_folder = is_directory ${python_folder}
                if ${is_python_folder}
                    array_push ${brush_roots} ${python_folder}
                end
            end
        end
    end
    brush_count = array_length ${brush_roots}
    if greater_than ${brush_count} 0
        exec --fail-on-error python ${BRUSH_NATIVE_LIBS_SCRIPT} %{brush_roots}
    end
    ''']

