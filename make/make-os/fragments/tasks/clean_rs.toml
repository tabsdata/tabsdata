[tasks.__os__clean_rs_expansions]
plugin = "td-task-tracker"
category = "01 - Clean"
private = true
run_task = [
    { name = [
        "__os__clean_rs_expansions_python",
        "__os__clean_rs_expansions_polars"
    ] }
]

[tasks.__os__clean_rs_expansions_python]
plugin = "td-task-tracker"
category = "01 - Clean"
private = true
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds

    debug "🚀 cargo %{td-toolchain-token}%{td-toolchain} clean --locked --manifest-path ${PROJECT_RS_TO_EXPANSIONS_PYTHON_CARGO_TOML}"
    exec --fail-on-error cargo %{td-toolchain-token}%{td-toolchain} clean --locked --manifest-path ${PROJECT_RS_TO_EXPANSIONS_PYTHON_CARGO_TOML}

    modules_path = join_path ${PROJECT_RS_TO_EXPANSIONS_PYTHON_FOLDER} modules
    cd "${modules_path}"
    extensions = array .so .dll .dylib .pyd
    for extension in ${extensions}
        info "🧹🧹 Cleaning extension: ${extension}"
        glob_files = glob_array ./**/*${extension}*
        for file in ${glob_files}
            file = join_path ${modules_path} ${file}
            info "🧹 Cleaning file: ${file}"
            retries = set 36
            retry = set 0
            keep = set true
            while ${keep}
                file_Exists = exec python -c "import os, sys; sys.exit(0 if os.path.lexists(sys.argv[1]) else 1)" "${file}"
                if equals ${file_Exists.code} 0
                    output = exec python -c "import os, sys; os.unlink(sys.argv[1])" "${file}"
                    if equals ${output.code} 0
                        info "✅ Successfully deleted file: ${file}"
                        keep = set false
                    else
                        retry = calc ${retry} + 1
                        if greater_than ${retry} ${retries}
                            error "❌ Failed to delete file after 3 minutes: ${file}"
                            code = exit 1
                        else
                            info "⏳ Failed to delete ${file}. Retrying in 5 seconds... (${retry}/${retries})"
                            sleep 5000
                        end
                    end
                else
                    info "🚹 File no longer exists: ${file}. Break."
                    keep = set false
                end
            end
        end
    end
    ''']

