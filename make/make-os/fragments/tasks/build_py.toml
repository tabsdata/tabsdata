[tasks.__os__egg_py_tabsdata]
plugin = "td-task-tracker"
category = "03 - Build"
private = true
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds

    set_env PYTHONWARNINGS ignore

    debug "🔷 🔷 _____ Setting up tabsdata pytest context (tabsdata)..."

    on_ga = get_env TD_ON_GA
    on_ga_true = eq ${on_ga} "true"

    cd ${PROJECT_TABSDATA_ROOT_FOLDER}

    # Prevent make from using the local system scripts generated by setup.py

    # debug "🚀 python setup.py --quiet develop --script-dir target/pytest/build"
    # exec --fail-on-error python setup.py --quiet develop --script-dir target/pytest/build

    trace "🔸🔸🔸 Environment variable PROJECT_TABSDATA_ROOT_FOLDER: ${PROJECT_TABSDATA_ROOT_FOLDER}"

    uv_version = exec uv --version
    uv_version = trim ${uv_version.stdout}
    debug "️🔸🔸🔸 Version of uv: ${uv_version}"

    python_version = exec python --version
    python_version = trim ${python_version.stdout}
    debug "️🔸🔸🔸 Version of python: ${python_version}"

    virtual_env = get_env VIRTUAL_ENV
    debug "️🔸🔸🔸 Environment variable VIRTUAL_ENV: ${virtual_env}"

    if is_empty ${profile}
        build-folder = set "debug"
    else
        is_dev = eq ${profile} "dev"
        if ${is_dev}
            build-folder = set "debug"
        else
            build-folder = set ${profile}
        end
    end
    if not is_empty ${td-target}
        build-folder = set ${td-target}/${build-folder}
    end
    debug "🔸🔸🔸 Build folder: ${build-folder}"

    os_family = os_family
    debug "🔸🔸🔸 OS family: ${os_family}"

    if is_empty ${virtual_env}
        if ${on_ga_true}
            debug "🚀 uv pip install --system -e ."
            exec --fail-on-error uv pip install --system -e .
        else
            debug "🚀 uv pip install --quiet -e ."
            exec --fail-on-error uv pip install --quiet -e .
        end
    else
        if ${on_ga_true}
            debug "🚀 uv pip install -e ."
            exec --fail-on-error uv pip install -e .
        else
            debug "🚀 uv pip install --quiet -e ."
            exec --fail-on-error uv pip install --quiet -e .
        end
    end

    python_scripts_folder = exec python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
    python_scripts_folder = trim ${python_scripts_folder.stdout}
    trace "🔸🔸🔸 Value of python_scripts_folder is ${python_scripts_folder}"

    mkdir target/pytest/build

    current_folder = pwd
    trace "🔸🔸🔸 Current folder: ${current_folder.stdout}"

    target_python = exec python -c "from pathlib import Path; print(Path('.').resolve())"
    target_python = trim  ${target_python.stdout}
    trace "🔸🔸🔸 Folder ./target/python resolves to: ${target_python}"

    trace "🔸🔸🔸 Contents of ./target/python >>>>>"
    target_python_tree = exec python -c "import os; [print(root) or [print(f'  {name}') for name in files+folders] for root, folders, files in os.walk('target/python')]"
    target_python_tree = trim ${target_python_tree.stdout}
    debug "${target_python_tree}"
    trace "🔸🔸🔸 <<<<<"

    entry_points_file = set "./target/python/egg/tabsdata.egg-info/entry_points.txt"
    if is_path_exists ${entry_points_file}
        trace "🔸🔸🔸 The expected file ./target/python/egg/tabsdata.egg-info/entry_points.txt does exist."

        entry_points_content = readfile ${entry_points_file}

        trace "🔸🔸🔸 The contets of file ./target/python/egg/tabsdata.egg-info/entry_points.txt is >>>>>"
        debug "${entry_points_content}"
        trace "🔸🔸🔸 <<<<<"

        entry_points_lines = split ${entry_points_content} "\n"
        in_console_scripts = set false
        for entry_points_line in ${entry_points_lines}
            entry_points_line = trim ${entry_points_line}
            if eq ${entry_points_line} "[console_scripts]"
                in_console_scripts = set true
            elif starts_with ${entry_points_line} "["
                in_console_scripts = set false
            else
                is_entry_points_line_empty = is_empty ${entry_points_line}
                is_entry_points_line_not_empty = not ${is_entry_points_line_empty}
                if ${in_console_scripts} and ${is_entry_points_line_not_empty}
                    script_parts = split ${entry_points_line} "="
                    script_parts_length = array_length ${script_parts}
                    if greater_than ${script_parts_length} 0
                        script_name = array_get ${script_parts} 0
                        script_name = trim ${script_name}
                        source_script = set "${python_scripts_folder}/${script_name}"
                        target_script = set "target/pytest/build/${script_name}"
                        if is_path_exists ${source_script}
                            cp ${source_script} ${target_script}
                        end
                    end
                end
            end
        end
    else
        trace "🔸🔸🔸 The expected file ./target/python/egg/tabsdata.egg-info/entry_points.txt does not exist."
    end

    # Prevent make from using the local system scripts generated by pip
    rm target/pytest/build/pip
    rm target/pytest/build/pip.exe
    rm target/pytest/build/pip3
    rm target/pytest/build/pip3.exe
    rm target/pytest/build/wheel
    rm target/pytest/build/wheel.exe

    setup_toml_file = set "${PROJECT_TABSDATA_ROOT_FOLDER}/setup.toml"
    if is_path_exists ${setup_toml_file}
        debug "🔸🔸🔸 Reading setup.toml to extract base_binaries"
        setup_toml_content = readfile ${setup_toml_file}
        setup_toml_lines = split ${setup_toml_content} "\n"
        in_base_binaries = set false
        base_binaries = array
        for setup_toml_line in ${setup_toml_lines}
            setup_toml_line = trim ${setup_toml_line}
            is_in_base_binaries = starts_with ${setup_toml_line} "binaries = ["
            is_out_base_binaries = starts_with ${setup_toml_line} "]"
            if ${is_in_base_binaries}
                in_base_binaries = set true
            elif ${is_out_base_binaries}
                in_base_binaries = set false
            else
                if ${in_base_binaries}
                    binary_name = replace ${setup_toml_line} "\"" ""
                    binary_name = replace ${binary_name} "," ""
                    binary_name = trim ${binary_name}
                    array_push ${base_binaries} ${binary_name}
                    debug "🔸🔸🔸 Found binary: ${binary_name}"
                end
            end
        end

        base_binaries_size = array_length ${base_binaries}
        debug "🔸🔸🔸 Found ${base_binaries_size} base binaries"

        for base_binary in ${base_binaries}
            if eq ${os_family} "windows"
                binary_name = set "${base_binary}.exe"
            else
                binary_name = set "${base_binary}"
            end
            source_binary = set "${PROJECT_TABSDATA_ROOT_FOLDER}/target/${build-folder}/${binary_name}"
            target_binary = set "${python_scripts_folder}/${binary_name}"
            if eq ${os_family} "windows"
                source_binary = replace ${source_binary} "/" "\\"
                target_binary = replace ${target_binary} "/" "\\"
            else
                source_binary = replace ${source_binary} "\\" "/"
                target_binary = replace ${target_binary} "\\" "/"
            end
            exists = is_path_exists ${source_binary}
            if not ${exists}
                warn "🔥 Binary not found: ${source_binary}"
            end
            debug "🔅 Creating symbolic link for '${binary_name}': ${source_binary} -> ${target_binary}"
            target_exists = is_path_exists ${target_binary}
            if ${target_exists}
                rm ${target_binary}
            end
            exec --fail-on-error python -c "import os; os.symlink('${source_binary}', '${target_binary}')"
        end
    else
        warn "⚠️ setup.toml file not found at ${setup_toml_file}"
    end
    ''']

[tasks.__os__egg_py_connectors]
plugin = "td-task-tracker"
category = "03 - Build"
private = true
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds

    set_env PYTHONWARNINGS ignore

    cd ${PROJECT_TABSDATA_ROOT_FOLDER}

    connectors = glob_array ${OS_CONNECTORS_PY_ROOT_FOLDER}/tabsdata_*

    for connector in ${connectors}
        is_connector = is_dir ${connector}
        if ${is_connector}
            connector_name = basename ${connector}

            debug "🔷 🔷 _____ Setting up tabsdata pytest context (${connector_name})..."

            cd ${connector}

            # Prevent make from using the local system scripts generated by setup.py

            debug "🚀 python setup.py --quiet develop --script-dir target/pytest/build"
            exec --fail-on-error python setup.py --quiet develop --script-dir target/pytest/build

            # Prevent make from using the local system scripts generated by setup.py
            rm target/pytest/build/pip
            rm target/pytest/build/pip.exe
            rm target/pytest/build/pip3
            rm target/pytest/build/pip3.exe
            rm target/pytest/build/wheel
            rm target/pytest/build/wheel.exe

            cd ${PROJECT_TABSDATA_ROOT_FOLDER}
        end
    end
    ''']
