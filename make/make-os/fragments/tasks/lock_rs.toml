[tasks.__os__lock_rs_macros]
plugin = "td-task-tracker"
category = "02 - Tidy"
private = true
cwd = "${PROJECT_TABSDATA_ROOT_FOLDER}"
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds

    cd "${PROJECT_RS_TD_MACROS_FOLDER}"

    debug "🚀 cargo generate-lockfile"
    exec --fail-on-error cargo generate-lockfile

    # debug "🚀 cargo update --verbose -p planus --precise 1.1.1"
    # exit_code = exec --get-exit-code cargo update --verbose -p planus --precise 1.1.1
    ''']


