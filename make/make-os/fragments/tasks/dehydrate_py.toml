[tasks.__os__dehydrate_py_tabsdata]
plugin = "td-task-tracker"
category = "11 - Development"
private = true
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds

    set_env PYTHONWARNINGS ignore

    debug "🔷 🔷 _____ Dehydrating the Python environment (tabsdata)..."

    cd "${PROJECT_TABSDATA_ROOT_FOLDER}"

    debug "🔸🔸🔸 Environment variable PROJECT_TABSDATA_ROOT_FOLDER: ${PROJECT_TABSDATA_ROOT_FOLDER}"

    uv_version = exec uv --version
    uv_version = trim ${uv_version.stdout}
    debug "️🔸🔸🔸 Version of uv: ${uv_version}"

    python_version = exec python --version
    python_version = trim ${python_version.stdout}
    debug "️🔸🔸🔸 Version of python: ${python_version}"

    python_scripts_folder = exec python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
    python_scripts_folder = trim ${python_scripts_folder.stdout}
    debug "🔸🔸🔸 Value of python_scripts_folder is ${python_scripts_folder}"

    virtual_env = get_env VIRTUAL_ENV
    debug "️🔸🔸🔸 Environment variable VIRTUAL_ENV: ${virtual_env}"

    if is_empty ${profile}
        build-folder = set "debug"
    else
        is_dev = eq ${profile} "dev"
        if ${is_dev}
            build-folder = set "debug"
        else
            build-folder = set ${profile}
        end
    end
    if not is_empty ${td-target}
        build-folder = set ${td-target}/${build-folder}
    end
    debug "🔸🔸🔸 Build folder: ${build-folder}"

    os_family = os_family
    debug "🔸🔸🔸 OS family: ${os_family}"

    debug "🚀 pip uninstall tabsdata --yes"
    exec --fail-on-error pip uninstall tabsdata --yes

    result = exec python setup.py --quiet clean --all
    if not eq ${result.code} 0
        error "Clean failed: ${result.stderr}"
    end

    rm -r ${PROJECT_TABSDATA_ROOT_FOLDER}/target/python/

    debug "🔸🔸🔸 Unlinking the binaries declared by every setup.toml"
    exec --fail-on-error python ${LINK_BINARIES_SCRIPT} ${PROJECT_TABSDATA_ROOT_FOLDER} ${python_scripts_folder} "${PROJECT_TABSDATA_ROOT_FOLDER}/target/${build-folder}" --unlink

    pytthon_target_folder = set "${PROJECT_TABSDATA_ROOT_FOLDER}/target/python"
    if ${pytthon_target_folder}
        debug "🔅 Deleting python target folder: ${pytthon_target_folder}"
        rm -r ${pytthon_target_folder}
    end
    ''']

[tasks.__os__dehydrate_py_connectors]
plugin = "td-task-tracker"
category = "11 - Development"
private = true
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds

    cd "${PROJECT_TABSDATA_ROOT_FOLDER}"

    connectors = glob_array ${OS_CONNECTORS_PY_ROOT_FOLDER}/tabsdata-*

    for connector in ${connectors}
        is_connector = is_dir ${connector}
        if ${is_connector}
            cd ${connector}

            connector_name = basename ${connector}
            connector_package = replace ${connector_name} "_" "-"

            debug "🚀 pip uninstall ${connector_package} --yes"
            exec --fail-on-error pip uninstall ${connector_package} --yes

            result = exec python setup.py --quiet clean --all --package-folder ${connector}
            if not eq ${result.code} 0
                error "Clean failed for ${connector_name}: ${result.stderr}"
            end

            pytthon_target_folder = set "${connector}/target/python"
            if ${pytthon_target_folder}
                debug "🔅 Deleting python target folder: ${pytthon_target_folder}"
                rm -r ${pytthon_target_folder}
            end

            cd ${PROJECT_TABSDATA_ROOT_FOLDER}
        end
    end
    ''']
