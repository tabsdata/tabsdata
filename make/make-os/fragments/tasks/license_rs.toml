[tasks.__os__license_check_deny_rs_macros]
plugin = "td-task-tracker"
private = true
cwd = "${PROJECT_TABSDATA_ROOT_FOLDER}"
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds

    debug "🚀 cargo %{td-toolchain-token}%{td-toolchain} deny --locked %{td-target-token} %{td-target} --log-level error --workspace --all-features --manifest-path ${PROJECT_RS_TD_MACROS_CARGO_TOML} --config ${DENY_TOML} check --hide-inclusion-graph licenses"
    exec --fail-on-error cargo %{td-toolchain-token}%{td-toolchain} deny --locked %{td-target-token} %{td-target} --log-level error --workspace --all-features --manifest-path ${PROJECT_RS_TD_MACROS_CARGO_TOML} --config ${DENY_TOML} check --hide-inclusion-graph licenses
    ''']

