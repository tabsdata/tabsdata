[tasks.__os__publish_py_tabsdata]
plugin = "td-task-tracker"
category = "11 - Publish"
private = true
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds
    !include_files ./make/make-os/libraries/pi.ds

    is_empty_index = is_empty ${devpi_index}
    if ${is_empty_index}
        error "❌ --index is required. Usage: cargo make publish --index <url> [--user <user>] [--password <pw>] [--packages ...]"
        trigger_error "Missing --index argument"
    end

    skip_package = set false
    if not is_empty ${included_packages_filter}
        has_package = map_contains_key ${included_packages_map} tabsdata
        if not ${has_package}
            skip_package = set true
        end
    end
    if not is_empty ${excluded_packages_filter}
        has_package = map_contains_key ${excluded_packages_map} tabsdata
        if ${has_package}
            skip_package = set true
        end
    end
    if ${skip_package}
        info "⏭️ Skipping tabsdata (filtered out)"
    else
        set_env PIP_INDEX_URL ${devpi_index}
        set_env UV_DEFAULT_INDEX ${devpi_index}

        info "📦 Publishing tabsdata wheels to ${devpi_index}"

        cd "${PROJECT_TABSDATA_ROOT_FOLDER}"

        dist_folder = set "${PROJECT_TABSDATA_ROOT_FOLDER}/target/python/dist"
        wheels = glob_array ${dist_folder}/*.whl

        for wheel in ${wheels}
            filename = basename ${wheel}
            info "📦 🛞 Processing wheel: ${filename}"

            parts = split ${filename} -
            package_name = array_get ${parts} 0
            package_name = replace ${package_name} _ -
            package_version = array_get ${parts} 1

            info "🗑️ 🛞 Removing existing ${package_name}==${package_version} (if any)..."
            exec bash -c "devpi use ${devpi_index} && devpi login ${devpi_user} --password ${devpi_password} && devpi remove -y ${package_name}==${package_version}"

            info "📤 🛞 Uploading ${filename}..."
            exec --fail-on-error twine upload --repository-url ${devpi_index} -u ${devpi_user} -p ${devpi_password} ${wheel}

            info "🧹 🛞 Cleaning uv cache for ${package_name}..."
            exec --fail-on-error uv cache clean ${package_name}

            info "🧹 🛞 Cleaning pip cache for ${package_name}..."
            exec --fail-on-error pip cache remove ${package_name}

            info "🔖 🛞 Published ${filename}"
        end
    end
    ''']

[tasks.__os__publish_py_connectors]
plugin = "td-task-tracker"
category = "11 - Publish"
private = true
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds
    !include_files ./make/make-os/libraries/pi.ds

    is_empty_index = is_empty ${devpi_index}
    if ${is_empty_index}
        error "❌ --index is required. Usage: cargo make publish --index <url> [--user <user>] [--password <pw>] [--packages ...]"
        trigger_error "Missing --index argument"
    end

    set_env PIP_INDEX_URL ${devpi_index}
    set_env UV_DEFAULT_INDEX ${devpi_index}

    info "📦 Publishing os connector wheels to ${devpi_index}"

    cd "${PROJECT_TABSDATA_ROOT_FOLDER}"

    connectors = glob_array ${OS_CONNECTORS_PY_ROOT_FOLDER}/tabsdata-*

    for connector in ${connectors}
        is_connector = is_dir ${connector}
        if ${is_connector}
            connector_name = basename ${connector}
            skip_package = set false
            if not is_empty ${included_packages_filter}
                has_package = map_contains_key ${included_packages_map} ${connector_name}
                if not ${has_package}
                    skip_package = set true
                end
            end
            if not is_empty ${excluded_packages_filter}
                has_package = map_contains_key ${excluded_packages_map} ${connector_name}
                if ${has_package}
                    skip_package = set true
                end
            end
            if ${skip_package}
                info "⏭️ Skipping ${connector_name} (filtered out)"
            else
                dist_folder = set "${connector}/target/python/dist"
                wheels = glob_array ${dist_folder}/*.whl

                for wheel in ${wheels}
                    filename = basename ${wheel}
                    info "📦 🛞 Processing wheel: ${filename}"

                    parts = split ${filename} -
                    package_name = array_get ${parts} 0
                    package_name = replace ${package_name} _ -
                    package_version = array_get ${parts} 1

                    info "🗑️ 🛞 Removing existing ${package_name}==${package_version} (if any)..."
                    exec bash -c "devpi use ${devpi_index} && devpi login ${devpi_user} --password ${devpi_password} && devpi remove -y ${package_name}==${package_version}"

                    info "📤 🛞 Uploading ${filename}..."
                    exec --fail-on-error twine upload --repository-url ${devpi_index} -u ${devpi_user} -p ${devpi_password} ${wheel}

                    info "🧹 🛞 Cleaning uv cache for ${package_name}..."
                    exec --fail-on-error uv cache clean ${package_name}

                    info "🧹 🛞 Cleaning pip cache for ${package_name}..."
                    exec --fail-on-error pip cache remove ${package_name}

                    info "🔖 🛞 Published ${filename}"
                end
            end
        end
    end
    ''']
