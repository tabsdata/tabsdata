    is_dev = eq ${td_check_build_folder} "dev"
    if ${is_dev}
        td_check_build_folder = set "debug"
    end
    td_target_value = get_env TD_TARGET
    td_target_empty = is_empty ${td_target_value}
    if not ${td_target_empty}
        td_check_build_folder = concat ${td_target_value} "/" ${td_check_build_folder}
    end
    td_check_target_folder = concat ${PROJECT_RS_TD_TABSDATA_FOLDER} "target/" ${td_check_build_folder}
    exec --fail-on-error python ${CHECK_NATIVE_LIBS_SCRIPT} cargo ${PROJECT_RS_TD_TABSDATA_CARGO_TOML} ${td_check_target_folder}
