        td_script = set "${td_script} && export RUSTFLAGS='-C link-arg=-static-libgcc -C link-arg=-static-libstdc++'"
        td_script = set "${td_script} && python3.12 --version"
        td_script = set "${td_script} && python3.12 -m pip --version"
        td_script = set "${td_script} && rustc --version"
        td_script = set "${td_script} && cargo --version"
        td_script = set "${td_script} && python3.12 -m maturin --version"
        td_script = set "${td_script} && patchelf --version"
        td_script = set "${td_script} && python3.12 -m maturin build ${td_rust_quiet} --locked --compatibility manylinux2014 --profile ${td-profile} --manifest-path /tabsdata/expansions/polars/extensions/tz-tableframe/Cargo.toml --features extension-module"
        exec --fail-on-error docker run --platform ${td_docker_platform} --rm --mount=type=bind,src=${PROJECT_TABSDATA_ROOT_FOLDER},target=/tabsdata -w /tabsdata --env TD_PROFILE=${td_profile} ${td_manylinux_image} bash -lc "${td_script}"

        debug "🚀 sudo chown -R ${USER}:${USER} ${PROJECT_RS_TY_EXPANSIONS_POLARS_FOLDER}/target"
        exec --fail-on-error sudo chown -R ${USER}:${USER} ${PROJECT_RS_TY_EXPANSIONS_POLARS_FOLDER}/target

        debug "🚀 cd ${PROJECT_RS_TZ_TABLEFRAME_FOLDER}"
        cd "${PROJECT_RS_TZ_TABLEFRAME_FOLDER}"
    else
        debug "🚀 maturin build %{td-rust-quiet} --locked %{td-target-token} %{td-target} --profile ${td-profile} --features extension-module"
        exec --fail-on-error maturin build %{td-rust-quiet} --locked %{td-target-token} %{td-target} --profile ${td-profile} --features extension-module
    end

    info "⏳ Extracting maturin wheel to python source folder..."
    wheels = glob_array ../../target/wheels/tz_tableframe*.whl
    q_wheels = array_length ${wheels}
    if eq ${q_wheels} 0
        error "⚠️ No tz_tableframe maturin wheels found in ../../target/wheels/"
        exit 1
    else
        if eq ${q_wheels} 1
            for wheel in ${wheels}
                info "📦 Found wheel: ${wheel}"
                if is_directory ../../target/wheels/wheel.tz-tableframe.tmp
                    trace "🧹 Removing existing ../../target/wheels/wheel.tz-tableframe.tmp directory..."
                    rm -r ../../target/wheels/wheel.tz-tableframe.tmp
                end
                exec --fail-on-error python -m zipfile -e ${wheel} ../../target/wheels/wheel.tz-tableframe.tmp

                trace "📂 Listing of wheel.tz-tableframe.tmp:"
                wheel_items = glob_array ../../target/wheels/wheel.tz-tableframe.tmp/**/*
                for wheel_item in ${wheel_items}
                    trace "   - ${wheel_item}"
                end
                for wheel_item in ${wheel_items}
                    if is_directory ${wheel_item}
                        if ends_with ${wheel_item} ".dist-info"
                            wheel_files = glob_array ${wheel_item}/**/*
                            for wheel_file in ${wheel_files}
                                if is_file ${wheel_file}
                                    trace "📝 Contents of wheel.tz-tableframe.tmp .dist-info folder file ${wheel_file}..."
                                    trace ">>>>> >>>>> >>>>> >>>>> >>>>>"
                                    trace "<<<<< <<<<< <<<<< <<<<< <<<<<"
                                end
                            end
                        end
                    end
                end

                if is_directory "../../target/wheels/wheel.tz-tableframe.tmp/tabsdata"
                    trace "📁 Copying tabsdata module to python/"
                    td_symlink_polars_libs_pytest = get_env TD_SYMLINK_POLARS_LIBS_PYTEST
                    os = os_family
                    if eq ${os} "mac"
                        if eq ${td_symlink_polars_libs_pytest} "true"
                            info "🍄 macOS + TD_SYMLINK_POLARS_LIBS=true → Using symbolic links to reduce space of local packages"
                            debug "🚀 python ${SYMLINK_SO_SCRIPT} ../../target/wheels/wheel.tz-tableframe.tmp/tabsdata python/src/main/python/tabsdata true"
                            exec --fail-on-error python ${SYMLINK_SO_SCRIPT} ../../target/wheels/wheel.tz-tableframe.tmp/tabsdata python/src/main/python/tabsdata true
                        else
                            info "👀 macOS + TD_SYMLINK_POLARS_LIBS=false → Using regular copy"
                            debug "🚀 python ${SYMLINK_SO_SCRIPT} ../../target/wheels/wheel.tz-tableframe.tmp/tabsdata python/src/main/python/tabsdata false"
                            exec --fail-on-error python ${SYMLINK_SO_SCRIPT} ../../target/wheels/wheel.tz-tableframe.tmp/tabsdata python/src/main/python/tabsdata false
                        end
                    else
                        info "🧩 Non macOS → Using regular copy"
                        debug "🚀 python ${SYMLINK_SO_SCRIPT} ../../target/wheels/wheel.tz-tableframe.tmp/tabsdata python/src/main/python/tabsdata false"
                        exec --fail-on-error python ${SYMLINK_SO_SCRIPT} ../../target/wheels/wheel.tz-tableframe.tmp/tabsdata python/src/main/python/tabsdata false
                    end
                else
                    error "⚠️ tabsdata module not found in wheel extraction: ${wheel}"
                    exit 1
                end

                # Check native libraries of the copied expansion
                native_files = glob_array python/src/main/python/tabsdata/expansions/extensions/tableframe/*.so
                native_pyd = glob_array python/src/main/python/tabsdata/expansions/extensions/tableframe/*.pyd
                for pyd in ${native_pyd}
                    array_push ${native_files} ${pyd}
                end
                native_list = set ""
                for nf in ${native_files}
                    if is_empty ${native_list}
                        native_list = set "${nf}"
                    else
                        native_list = concat ${native_list} " " ${nf}
                    end
                end
                if not is_empty ${native_list}
                    exec --fail-on-error python ${CHECK_NATIVE_LIBS_SCRIPT} files ${native_list}
                end

                trace "🐍 Successfully extracted wheel contents!"
            end
        else
            error "⚠️ More than one tz_tableframe maturin wheel found in ../../target/wheels/"
            for wheel in ${wheels}
                error "⚠️ 📦 Found wheel: ${wheel}"
            end
            exit 1
        end
    end
    ''']

