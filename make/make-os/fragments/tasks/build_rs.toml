                info "📦 Found wheel: ${wheel}"
                if is_directory ../../target/wheels/wheel.ty-tableframe.tmp
                    trace "🧹 Removing existing ../../target/wheels/wheel.ty-tableframe.tmp directory..."
                    rm -r ../../target/wheels/wheel.ty-tableframe.tmp
                end
                exec --fail-on-error python -m zipfile -e ${wheel} ../../target/wheels/wheel.ty-tableframe.tmp

                trace "📂 Listing of wheel.ty-tableframe.tmp:"
                wheel_items = glob_array ../../target/wheels/wheel.ty-tableframe.tmp/**/*
                for wheel_item in ${wheel_items}
                    trace "   - ${wheel_item}"
                end
                for wheel_item in ${wheel_items}
                    if is_directory ${wheel_item}
                        if ends_with ${wheel_item} ".dist-info"
                            wheel_files = glob_array ${wheel_item}/**/*
                            for wheel_file in ${wheel_files}
                                if is_file ${wheel_file}
                                    trace "📝 Contents of wheel.ty-tableframe.tmp .dist-info folder file ${wheel_file}..."
                                    trace ">>>>> >>>>> >>>>> >>>>> >>>>>"
                                    trace "<<<<< <<<<< <<<<< <<<<< <<<<<"
                                end
                            end
                        end
                    end
                end

                if is_directory "../../target/wheels/wheel.ty-tableframe.tmp/tabsdata"
                    trace "📁 Copying tabsdata module to python/"
                    td_symlink_polars_libs_pytest = get_env TD_SYMLINK_POLARS_LIBS_PYTEST
                    os = os_family
                    if eq ${os} "mac"
                        if eq ${td_symlink_polars_libs_pytest} "true"
                            info "🍄 macOS + TD_SYMLINK_POLARS_LIBS=true → Using symbolic links to reduce space of local packages"
                            debug "🚀 python ${SYMLINK_SO_SCRIPT} ../../target/wheels/wheel.ty-tableframe.tmp/tabsdata python/ true"
                            exec --fail-on-error python ${SYMLINK_SO_SCRIPT} ../../target/wheels/wheel.ty-tableframe.tmp/tabsdata python/tabsdata true
                        else
                            info "👀 macOS + TD_SYMLINK_POLARS_LIBS=false → Using regular copy"
                            debug "🚀 python ${SYMLINK_SO_SCRIPT} ../../target/wheels/wheel.ty-tableframe.tmp/tabsdata python/ false"
                            exec --fail-on-error python ${SYMLINK_SO_SCRIPT} ../../target/wheels/wheel.ty-tableframe.tmp/tabsdata python/tabsdata false
                        end
                    else
                        info "🧩 Non macOS → Using regular copy"
                        debug "🚀 python ${SYMLINK_SO_SCRIPT} ../../target/wheels/wheel.ty-tableframe.tmp/tabsdata python/ false"
                        exec --fail-on-error python ${SYMLINK_SO_SCRIPT} ../../target/wheels/wheel.ty-tableframe.tmp/tabsdata python/tabsdata false
                    end
                else
                    error "⚠️ tabsdata module not found in wheel extraction: ${wheel}"
                    exit 1
                end

                if is_directory "../../target/wheels/wheel.ty-tableframe.tmp/tabsdata.libs"
                    trace "📁 Copying tabsdata.libs folder to python/"
                    exec --fail-on-error cp -r ../../target/wheels/wheel.ty-tableframe.tmp/tabsdata.libs python/
                else
                    trace "📌 tabsdata.libs folder not found in wheel extraction: ${wheel}"
                end

                trace "🐍 Successfully extracted wheel contents!"
            end
        else
            error "⚠️ More than one ty_tableframe maturin wheel found in ../../target/wheels/"
            for wheel in ${wheels}
                error "⚠️ 📦 Found wheel: ${wheel}"
            end
            exit 1
        end
    end
    ''']

