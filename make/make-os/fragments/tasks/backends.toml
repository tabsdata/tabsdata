[tasks.__os__set_secrets]
plugin = "td-task-tracker"
category = "12 - Backends"
private = true
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds

    skip_secrets_load = get_env TD_SKIP_SECRETS_LOAD
    skip_secrets_load_true = eq ${skip_secrets_load} "true"
    on_ga = get_env TD_ON_GA
    on_ga_true = eq ${on_ga} "true"
    skip_load = set ${skip_secrets_load_true} or ${on_ga_true}
    if ${skip_load}
        info "🔐 Skipping the 1Password load; assuming backend systems secrets are already provided"
        exit 0
    end

    systems_marker = get_env TD_BACKENDS_SYSTEMS
    systems_marker = trim ${systems_marker}
    if is_empty ${systems_marker}
        vault = get_env ONE_PASSWORD_DEV_XP_VAULT
        vault = trim ${vault}
        if is_empty ${vault}
            error ""
            error "🧨 ONE_PASSWORD_DEV_XP_VAULT is not set."
            error ""
            error "🛟 Set it to the 1Password vault holding the backend systems secrets."
            error ""
            assert false
        end

        info "🔐 Loading backend systems secrets from 1Password vault '${vault}'..."
        debug "🚀 tdx-system secrets --set 1p:${vault} --out json"
        secrets_json = exec tdx-system secrets --set 1p:${vault} --out json
        if not eq ${secrets_json.code} "0"
            error "🚫 Could not load backend systems secrets from 1Password vault '${vault}' (exit code ${secrets_json.code})."
            error "\n${secrets_json.stderr}"
            assert_fail
        end

        secrets = json_parse --collection ${secrets_json.stdout}
        secrets_names = map_keys ${secrets}
        secrets_count = set 0
        for secret_name in ${secrets_names}
            secret_value = map_get ${secrets} ${secret_name}
            set_env ${secret_name} ${secret_value}
            secrets_count = calc ${secrets_count} + 1
        end
        release ${secrets}
        info "🔐 Loaded ${secrets_count} secret environment variables"
    else
        info "🔐 Backend systems secrets already set (TD_BACKENDS_SYSTEMS present); skipping the 1Password load"
    end
    ''']

[tasks.__os__create_systems]
plugin = "td-task-tracker"
category = "12 - Backends"
private = true
dependencies = ["__os__set_mode_backends"]
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds

    arguments = split ${CARGO_MAKE_TASK_ARGS} ;
    for argument in ${arguments}
        if eq ${argument} "--help"
            echo ""
            echo "Usage: cargo make systems_create [--systems-manifest <FILE>]"
            echo ""
            echo "Create the backend systems from a manifest file."
            echo ""
            echo "Options:"
            echo "  --systems-manifest <FILE>  Path to the systems manifest YAML."
            echo "                             Default: ${BACKENDS_SYSTEMS_MANIFEST}"
            echo "                             When no argument is given, the"
            echo "                             TD_OVERRIDE_SYSTEMS_MANIFEST environment"
            echo "                             variable, if set, selects a file by name"
            echo "                             from ${BACKENDS_MANIFEST_FOLDER}."
            echo ""
            exit 0
        end
    end

    cm_run_task __os__set_venv_env
    cm_run_task __os__set_crypto
    cm_run_task __os__set_secrets

    manifest = set ""
    take_next = set false
    for argument in ${arguments}
        if ${take_next}
            manifest = set ${argument}
            take_next = set false
        elseif eq ${argument} "--systems-manifest"
            take_next = set true
        end
    end
    manifest = trim ${manifest}
    if is_empty ${manifest}
        override = get_env TD_OVERRIDE_SYSTEMS_MANIFEST
        override = trim ${override}
        if is_empty ${override}
            manifest = set ${BACKENDS_SYSTEMS_MANIFEST}
        else
            manifest = set ${BACKENDS_MANIFEST_FOLDER}/${override}
        end
    else
        absolute = starts_with ${manifest} "/"
        if not ${absolute}
            absolute = starts_with ${manifest} "\\"
        end
        if not ${absolute}
            second = substring ${manifest} 1 2
            absolute = eq ${second} ":"
        end
        if not ${absolute}
            manifest = set ${BACKENDS_MANIFEST_FOLDER}/${manifest}
        end
    end

    info "📄 Using systems manifest: ${manifest}"
    info "🛠️ Creating backend systems..."
    debug "🚀 tdx-system create --manifest ${manifest} -f"
    exec --fail-on-error tdx-system create --manifest ${manifest} -f

    cm_run_task __os__reset_venv_env
    ''']

