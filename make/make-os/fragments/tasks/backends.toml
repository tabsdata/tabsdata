[tasks.__os__info_systems]
plugin = "td-task-tracker"
category = "12 - Backends"
private = true
dependencies = ["__os__set_mode_backends"]
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds

    cm_run_task __os__set_venv_env
    cm_run_task __os__set_crypto
    cm_run_task __os__set_secrets

    exec tdx-itest banner --color cyan "📇 Info for backend systems"

    systems_folder = get_env TD_BACKENDS_DIR
    systems_folder = trim ${systems_folder}
    if is_empty ${systems_folder}
        home = get_env HOME
        systems_folder = set ${home}/.tabsdatax/systems2
    else
        systems_folder = set ${systems_folder}/systems2
    end

    documents = array
    systems_folder_exists = is_path_exists ${systems_folder}
    if ${systems_folder_exists}
        systems = glob_array ${systems_folder}/*
        for system in ${systems}
            system_is_file = is_file ${system}
            if ${system_is_file}
                system_name = basename ${system}
                debug "🚀 tdx-system info --sys ${system_name} --format json"
                output = exec tdx-system info --sys ${system_name} --format json
                if eq ${output.code} "0"
                    document = map
                    content = trim ${output.stdout}
                    map_put ${document} title ${system_name}
                    map_put ${document} content ${content}
                    array_push ${documents} ${document}
                else
                    debug "➖ Skipping non-descriptor file: ${system_name}"
                end
            end
        end
    end

    documents_count = array_length ${documents}
    if eq ${documents_count} "0"
        info "🚜 No backend systems found in ${systems_folder}."
    else
        payload = json_encode --collection ${documents}
        set_env TD_RENDER_PAYLOAD ${payload}
        exec --fail-on-error tdx-json --env TD_RENDER_PAYLOAD
        unset_env TD_RENDER_PAYLOAD
    end
    release --recursive ${documents}

    cm_run_task __os__reset_venv_env
    ''']

