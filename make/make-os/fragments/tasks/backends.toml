[tasks.__os__set_crypto]
plugin = "td-task-tracker"
category = "12 - Backends"
private = true
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds
    !include_files ./make/make-os/libraries/tdd.ds

    skip_secrets_load = get_env TD_SKIP_SECRETS_LOAD
    skip_secrets_load_true = eq ${skip_secrets_load} "true"
    if ${skip_secrets_load_true}
        info "🔑 Skipping the 1Password load; assuming _TDD_CRYPTO_KEY is already provided"
        exit 0
    end

    tdd_crypto_key = get_env _TDD_CRYPTO_KEY
    if is_empty ${tdd_crypto_key}
        info "🔑 Loading the tdd crypto key from 1Password..."
        crypto_selection = tdd_crypto_selection
        tdd_fetch ${crypto_selection}
    else
        debug "🔑 Variable _TDD_CRYPTO_KEY is already set; keeping the current value"
    end
    ''']

