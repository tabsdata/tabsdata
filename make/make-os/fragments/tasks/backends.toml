[tasks.__os__set_secrets]
plugin = "td-task-tracker"
category = "12 - Backends"
private = true
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds
    !include_files ./make/make-os/libraries/tdd.ds

    skip_secrets_load = get_env TD_SKIP_SECRETS_LOAD
    skip_secrets_load_true = eq ${skip_secrets_load} "true"
    if ${skip_secrets_load_true}
        info "🔐 Skipping the 1Password load; assuming backend systems secrets are already provided"
        exit 0
    end

    systems_marker = get_env TD_BACKENDS_SYSTEMS
    systems_marker = trim ${systems_marker}
    tdd_systems_marker = get_env _TDD_SYSTEMS
    tdd_systems_marker = trim ${tdd_systems_marker}
    secrets_loaded = set false
    if not is_empty ${systems_marker}
        secrets_loaded = set true
    end
    if not is_empty ${tdd_systems_marker}
        secrets_loaded = set true
    end

    if ${secrets_loaded}
        if is_empty ${systems_marker}
            set_env TD_BACKENDS_SYSTEMS ${tdd_systems_marker}
        end
        if is_empty ${tdd_systems_marker}
            set_env _TDD_SYSTEMS ${systems_marker}
        end
        info "🔐 Backend systems secrets already set (TD_BACKENDS_SYSTEMS or _TDD_SYSTEMS present); skipping the 1Password load"
    else
        info "🔐 Loading backend systems secrets from 1Password..."
        secrets_count = tdd_fetch --secrets
        tdd_systems = get_env _TDD_SYSTEMS
        set_env TD_BACKENDS_SYSTEMS ${tdd_systems}
        info "🔐 Loaded ${secrets_count} secret environment variables"
    end
    ''']

[tasks.__os__create_systems]
plugin = "td-task-tracker"
category = "12 - Backends"
private = true
dependencies = ["__os__set_mode_backends"]
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds
    !include_files ./make/make-os/libraries/tdd.ds
    !include_files ./make/make-os/libraries/backends.ds

    arguments = split ${CARGO_MAKE_TASK_ARGS} ;
    for argument in ${arguments}
        if eq ${argument} "--help"
            echo ""
            echo "Usage: cargo make systems_create [--systems-manifest <FILE>]"
            echo ""
            echo "Create the backend systems from a manifest file."
            echo ""
            echo "Options:"
            echo "  --systems-manifest <FILE>  Path to the systems manifest YAML."
            echo "                             Default: ${BACKENDS_SYSTEMS_MANIFEST}"
            echo "                             (systems_ga_<os>.yaml on GA)."
            echo "                             When no argument is given, the"
            echo "                             TD_OVERRIDE_SYSTEMS_MANIFEST environment"
            echo "                             variable, if set, selects a file by name"
            echo "                             from ${BACKENDS_MANIFEST_FOLDER}, or by path"
            echo "                             when absolute."
            echo ""
            exit 0
        end
    end

    cm_run_task __os__set_venv_env
    cm_run_task __os__set_crypto
    cm_run_task __os__set_secrets

    manifest = resolve_systems_manifest

    info "📄 Using systems manifest: ${manifest}"
    info "🛠️ Creating backend systems..."
    tdd = tdd_exe
    debug "🚀 ${tdd} system create --manifest ${manifest} --force --brief"
    exec --fail-on-error ${tdd} system create --manifest ${manifest} --force --brief

    cm_run_task __os__reset_venv_env
    ''']

[tasks.__os__destroy_systems]
plugin = "td-task-tracker"
category = "12 - Backends"
private = true
dependencies = ["__os__set_mode_backends"]
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds
    !include_files ./make/make-os/libraries/tdd.ds
    !include_files ./make/make-os/libraries/backends.ds

    arguments = split ${CARGO_MAKE_TASK_ARGS} ;
    for argument in ${arguments}
        if eq ${argument} "--help"
            echo ""
            echo "Usage: cargo make systems_destroy [--systems-manifest <FILE>] [--domains-manifest <FILE>]"
            echo ""
            echo "Destroy the backend systems. The backend domains are destroyed first."
            echo ""
            echo "Options:"
            echo "  --systems-manifest <FILE>  Path to the systems manifest YAML."
            echo "                             Default: ${BACKENDS_SYSTEMS_MANIFEST}"
            echo "                             (systems_ga_<os>.yaml on GA)."
            echo "                             When no argument is given, the"
            echo "                             TD_OVERRIDE_SYSTEMS_MANIFEST environment"
            echo "                             variable, if set, selects a file by name"
            echo "                             from ${BACKENDS_MANIFEST_FOLDER}, or by path"
            echo "                             when absolute."
            echo ""
            echo "The domains of both test suites are destroyed first."
            echo ""
            exit 0
        end
    end

    cm_run_task __os__destroy_all_domains

    cm_run_task __os__set_venv_env
    cm_run_task __os__set_crypto
    cm_run_task __os__set_secrets

    manifest = resolve_systems_manifest

    info "📄 Using systems manifest: ${manifest}"
    info "💥 Destroying backend systems..."
    tdd = tdd_exe
    debug "🚀 ${tdd} system destroy --manifest ${manifest}"
    exec --fail-on-error ${tdd} system destroy --manifest ${manifest}

    cm_run_task __os__reset_venv_env
    ''']

[tasks.__os__status_systems]
plugin = "td-task-tracker"
category = "12 - Backends"
private = true
dependencies = ["__os__set_mode_backends"]
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds
