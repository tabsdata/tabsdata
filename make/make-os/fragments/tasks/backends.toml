[tasks.__os__generate_domains]
plugin = "td-task-tracker"
category = "12 - Backends"
private = true
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds
    !include_files ./make/make-os/libraries/tdd.ds
    !include_files ./make/make-os/libraries/backends.ds

    arguments = split ${CARGO_MAKE_TASK_ARGS} ;
    for argument in ${arguments}
        if eq ${argument} "--help"
            echo ""
            echo "Usage: cargo make domains_create (--python | --rust) [--domains-manifest <FILE>]"
            echo ""
            echo "Create the backend domains of a test suite from a manifest file."
            echo ""
            echo "Options:"
            echo "  --python                   Act on the domains the Python suite uses."
            echo "  --rust                     Act on the domains the Rust suite uses."
            echo "  --domains-manifest <FILE>  Path to the domains manifest YAML."
            echo "                             Default: ${BACKENDS_PY_DOMAINS_MANIFEST} (--python)"
            echo "                             Default: ${BACKENDS_RS_DOMAINS_MANIFEST} (--rust)"
            echo "                             (domains_<py|rs>_ga_<os>.yaml on GA)."
            echo "                             When no argument is given, the"
            echo "                             TD_OVERRIDE_PY_DOMAINS_MANIFEST (--python)"
            echo "                             or TD_OVERRIDE_RS_DOMAINS_MANIFEST (--rust)"
            echo "                             environment variable, if set, selects a"
            echo "                             file by name from ${BACKENDS_MANIFEST_FOLDER},"
            echo "                             or by path when absolute. Test runs honour"
            echo "                             them too."
            echo ""
            exit 0
        end
    end

    with_domains = get_env TD_WITH_DOMAINS
    if eq ${with_domains} "false"
        info "🚜 Creating backend domains skipped."
        exit 0
    end

    language = resolve_domains_language
    manifest = resolve_domains_manifest ${language}

    cm_run_task __os__set_venv_env
    cm_run_task __os__set_crypto
    if eq ${language} "py"
        cm_run_task __os__set_secrets
    end

    info "📄 Using domains manifest: ${manifest}"
    info "🛠️ Creating backend domains..."
    tdd = tdd_exe
    debug "🚀 ${tdd} domain create --manifest ${manifest} --force --brief"
    exec --fail-on-error ${tdd} domain create --manifest ${manifest} --force --brief

    cm_run_task __os__reset_venv_env

    if eq ${language} "rs"
        cm_run_task __os__set_domain_envs_rs
        cm_run_task __os__get_domain_envs_rs
    end
    ''']

