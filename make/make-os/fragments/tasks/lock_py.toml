[tasks.__os__lock_py_tabsdata]
plugin = "td-task-tracker"
category = "02 - Tidy"
private = true
cwd = "${PROJECT_TABSDATA_ROOT_FOLDER}"
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds

    cd "${PROJECT_TABSDATA_ROOT_FOLDER}"

    debug "🚀 python ${LOCK_REQUIREMENTS_SCRIPT} ${PROJECT_TABSDATA_ROOT_FOLDER}"
    exec --fail-on-error python ${LOCK_REQUIREMENTS_SCRIPT} ${PROJECT_TABSDATA_ROOT_FOLDER}

    debug "🚀 uv pip compile --no-header --no-annotate --format requirements.txt --quiet --output-file ./variant/resources/lock/requirements.txt ./requirements/requirements-third-party-all.txt"
    exec --fail-on-error uv pip compile --no-header --no-annotate --format requirements.txt --quiet --output-file ./variant/resources/lock/requirements.txt ./requirements/requirements-third-party-all.txt

    debug "📝 Adding copyright header to requirements.txt"
    current_year = exec python -c "import datetime; print(datetime.datetime.now().year)"
    current_year = trim ${current_year.stdout}
    content = readfile ./variant/resources/lock/requirements.txt
    writefile ./variant/resources/lock/requirements.txt "#\n# Copyright ${current_year} Tabs Data Inc.\n#\n\n${content}"
    ''']

[tasks.__os__lock_py_connectors]
plugin = "td-task-tracker"
category = "01 - Tidy"
private = true
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds

    connectors = glob_array ${OS_CONNECTORS_PY_ROOT_FOLDER}/tabsdata-*

    for connector in ${connectors}
        is_connector = is_dir ${connector}
        if ${is_connector}
            warn "⏳ Nothing to do: ${connector}."
        end
    end
    ''']
