# Copyright 2025 Tabsdata Inc.
#

#  The --tb option controls how Python tracebacks are displayed when tests fail:
#  ┌─────────────┬─────────────────────────────────────────────────┐
#  │   Option    │                   Description                   │
#  ├─────────────┼─────────────────────────────────────────────────┤
#  │ --tb=long   │ Full traceback with source code                 │
#  ├─────────────┼─────────────────────────────────────────────────┤
#  │ --tb=short  │ Shorter traceback                               │
#  ├─────────────┼─────────────────────────────────────────────────┤
#  │ --tb=line   │ One line per failure                            │
#  ├─────────────┼─────────────────────────────────────────────────┤
#  │ --tb=native │ Python standard library format                  │
#  ├─────────────┼─────────────────────────────────────────────────┤
#  │ --tb=no     │ No traceback at all                             │
#  ├─────────────┼─────────────────────────────────────────────────┤
#  │ --tb=auto   │ Long for first/last, short for others (default) │
#  └─────────────┴─────────────────────────────────────────────────┘

[tasks.__os__test_py_ta_features]
plugin = "td-task-tracker"
category = "04 - Test"
private = true
dependencies = ["__os__set_mode_test_py"]
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds

    verbose = get_env TD_VERBOSE

    cd "${PROJECT_PY_TA_FEATURES_FOLDER}"

    td_temp = temp_dir
    set_env COVERAGE_FILE ${td_temp}/.tabsdata/.coverage.${PYTEST_XDIST_WORKER}

    report_folder = set "./target/reports/pytest/ta_features"
    rm -r ${report_folder}
    mkdir ${report_folder}
    report_file = set ${report_folder}/pytest.html

    td_tb = set "--tb=line"
    td_fail = set ""
    arguments = split ${CARGO_MAKE_TASK_ARGS} ;
    for argument in ${arguments}
        is_tb = starts_with ${argument} "--tb="
        if ${is_tb}
            td_tb = set ${argument}
            td_fail = set "--instafail"
            info "🛟 Using fail option: ${td_tb}"
            info "📝 Using traceback option: ${td_fail}"
        end
    end

    if eq ${verbose} "false"
        debug "🚀 pytest ${td_tb} ${td_fail} --import-mode=importlib -n 16 --dist=loadgroup ${TESTS_PY_TA_FEATURES_FOLDER} --template=html1/index.html --report=${report_file} -ra --durations=8 --cov-config=.coveragerc --cov --cov-report=html:.coveragex/html --cov-report=json:.coveragex/json/coverage.json --cov-report=lcov:.coveragex/lcov/coverage.lcov -m \"${MARKERS}\""
        exit_code = exec --get-exit-code pytest ${td_tb} ${td_fail} --import-mode=importlib -n 16 --dist=loadgroup ${TESTS_PY_TA_FEATURES_FOLDER} --template=html1/index.html --report=${report_file} -ra --durations=8 --cov-config=.coveragerc --cov --cov-report=html:.coveragex/html --cov-report=json:.coveragex/json/coverage.json --cov-report=lcov:.coveragex/lcov/coverage.lcov -m "${MARKERS}"
    else
        debug "🚀 pytest ${td_tb} ${td_fail} --import-mode=importlib -${verbose} --full-trace --log-level=DEBUG -n 16 --dist=loadgroup ${TESTS_PY_TA_FEATURES_FOLDER} --template=html1/index.html --report=${report_file} -ra --durations=8 --cov-config=.coveragerc --cov --cov-report=html:.coveragex/html --cov-report=json:.coveragex/json/coverage.json --cov-report=lcov:.coveragex/lcov/coverage.lcov -m \"${MARKERS}\""
        exit_code = exec --get-exit-code pytest ${td_tb} ${td_fail} --import-mode=importlib -${verbose} --full-trace --log-level=DEBUG -n 16 --dist=loadgroup ${TESTS_PY_TA_FEATURES_FOLDER} --template=html1/index.html --report=${report_file} -ra --durations=8 --cov-config=.coveragerc --cov --cov-report=html:.coveragex/html --cov-report=json:.coveragex/json/coverage.json --cov-report=lcov:.coveragex/lcov/coverage.lcov -m "${MARKERS}"
    end

    is_zero = eq ${exit_code} "0"
    is_five = eq ${exit_code} "5"
    if ${is_zero} or ${is_five}
        info "⌛️ Tests finished with zero-or-five exit code: '${exit_code}'"
    else
        info "⌛️ Tests finished with non-zero-or-five exit code: '${exit_code}'"
        TD_FAIL_FAST_PY = get_env TD_FAIL_FAST_PY
        if not ${TD_FAIL_FAST_PY}
            info "⌛️ Setting TD_TESTS_CODE_PY to ${exit_code}..."
            set_env TD_TESTS_CODE_PY ${exit_code}
        else
            info "⌛️ Failing fast..."
            code = exit ${exit_code}
        end
    end

    exec --fail-on-error python ${PROJECT_TABSDATA_ROOT_FOLDER}/devutils/automation/tasks/makers/td-scripts/report_coverage.py ./.coveragex/json/coverage.json .

    info "📊 Report generated at: 👉 ${PROJECT_TABSDATA_ROOT_FOLDER}/target/reports/pytest/tabsdata/pytest.html\n"
    ''']

