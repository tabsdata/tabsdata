[tasks.__os__set_generation]
plugin = "td-task-tracker"
category = "02 - Tidy"
private = true
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds

    tabsdata_generation = get_env TD_TABSDATA_GENERATION
    tabsdata_generation = trim ${tabsdata_generation}
    if is_empty ${tabsdata_generation}
        tabsdata_generation = set "2"
    end
    generation_one = eq ${tabsdata_generation} "1"
    generation_two = eq ${tabsdata_generation} "2"
    generation_valid = set ${generation_one} or ${generation_two}
    if not ${generation_valid}
        error ""
        error "🧨 Invalid TD_TABSDATA_GENERATION: '${tabsdata_generation}'. Valid values are '1' and '2'."
        error ""
        error "🛟 Generation 1 manages tdserver and tdkserver instances and runs all the Python tests."
        error "🛟 Generation 2 manages only tdkserver instances and runs only the tabsdatak Python tests."
        error ""
        assert false
    end
    set_env TD_TABSDATA_GENERATION ${tabsdata_generation}
    if ${generation_one}
        info "🧬 _____ Using tabsdata Generation 1: tdserver & tdkserver instances, all Python tests"
    elseif ${generation_two}
        info "🧬 _____ Using tabsdata Generation 2: tdkserver instances only, tabsdatak Python tests only"
    else
        error "🧨 Unhandled tabsdata Generation: '${tabsdata_generation}'."
        assert false
    end
    ''']

