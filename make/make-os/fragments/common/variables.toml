[tasks.__os__set_mode_test_rs]
plugin = "td-task-tracker"
category = "02 - Tidy"
private = true
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds

    test_rs_parallel = get_env TD_TEST_RS_PARALLEL
    if eq ${test_rs_parallel} "false"
        info "🚂 _____ The Rust tests will run in serial mode"
        set_env TD_TEST_RS_PARALLEL false
    else
        info "🚆 _____ The Rust tests will run in parallel mode"
        set_env TD_TEST_RS_PARALLEL true
    end

    aiagent_source_folder = set "${PROJECT_TABSDATA_ROOT_FOLDER}/../tabsdata-ag/src/main/python/tabsdatak/ag/resources/registry/_generated"
    aiagent_source_baseline = set "${aiagent_source_folder}/baseline.jsonl"
    aiagent_source_embeddings = set "${aiagent_source_folder}/baseline_embeddings.jsonl"
    aiagent_baseline_exists = is_file ${aiagent_source_baseline}
    aiagent_embeddings_exists = is_file ${aiagent_source_embeddings}
    if ${aiagent_baseline_exists} and ${aiagent_embeddings_exists}
        aiagent_target_folder = set "${PROJECT_TABSDATA_ROOT_FOLDER}/target/aiagent"
        mkdir ${aiagent_target_folder}
        aiagent_target_baseline = set "${aiagent_target_folder}/baseline.jsonl"
        aiagent_target_embeddings = set "${aiagent_target_folder}/baseline_embeddings.jsonl"
        aiagent_target_baseline_exists = is_file ${aiagent_target_baseline}
        if not ${aiagent_target_baseline_exists}
            cp ${aiagent_source_baseline} ${aiagent_target_baseline}
        end
        aiagent_target_embeddings_exists = is_file ${aiagent_target_embeddings}
        if not ${aiagent_target_embeddings_exists}
            cp ${aiagent_source_embeddings} ${aiagent_target_embeddings}
        end
        set_env TD_AIAGENT_BASELINE_FILE ${aiagent_target_baseline}
        set_env TD_AIAGENT_BASELINE_EMBEDDINGS_FILE ${aiagent_target_embeddings}
        info "🤖 Staged the AI agent baseline artifacts into ${aiagent_target_folder}"
    else
        info "🤖 Skipping AI agent baseline staging; artifacts not found under ${aiagent_source_folder}"
    end

    cm_run_task __os__set_apiserver_postgres_envs
    cm_run_task __os__get_apiserver_postgres_envs
    ''']

[tasks.__os__set_apiserver_postgres_envs]
plugin = "td-task-tracker"
category = "02 - Tidy"
private = true
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds

    domain = set "apiserver_postgres"
    prefix = set "APISERVER_POSTGRES"

    tdx_domain_exists = which tdx-domain
    if is_empty ${tdx_domain_exists}
        error "🚫 Required tool tdx-domain not found; cannot load the '${domain}' descriptor."
        assert_fail
    end

    debug "🚀 tdx-domain info --domain ${domain} --format export --prefix ${prefix}"
    output = exec tdx-domain info --domain ${domain} --format export --prefix ${prefix}
    if not eq ${output.code} "0"
        error "🚫 Could not read the '${domain}' descriptor (exit code ${output.code})."
        error "\n${output.stderr}"
        assert_fail
    end

    count = set 0
    names = array
    lines = split ${output.stdout} "\n"
    for line in ${lines}
        entry = trim ${line}
        is_export = starts_with ${entry} "export "
        if ${is_export}
            assignment = substring ${entry} 7
            separator = indexof ${assignment} "="
            if not is_empty ${separator}
                name = substring ${assignment} 0 ${separator}
                value_start = calc ${separator} + 1
                quoted = substring ${assignment} ${value_start}
                quoted_length = length ${quoted}
                value_end = calc ${quoted_length} - 1
                value = substring ${quoted} 1 ${value_end}
                set_env ${name} ${value}
                array_push ${names} ${name}
                count = calc ${count} + 1
            end
        end
    end
    if eq ${count} 0
        error "🚫 The '${domain}' descriptor yielded no ${prefix}__* variables."
        assert_fail
    end
    info "🐘 Loaded ${count} '${domain}' variable(s) as ${prefix}__*"
    ''']

[tasks.__os__get_apiserver_postgres_envs]
plugin = "td-task-tracker"
category = "02 - Tidy"
private = true
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds

    prefix = set "APISERVER_POSTGRES"

    count = set 0
    names = env_to_map
    keys = map_keys ${names}
    for name in ${keys}
        is_domain_env = starts_with ${name} "${prefix}__"
        if ${is_domain_env}
            value = get_env ${name}
            info "🐘 - ${name}=${value}"
            count = calc ${count} + 1
        end
    end
    release ${keys}
    release ${names}
    if eq ${count} 0
        error "🚫 No ${prefix}__* variable survived into this task."
        assert_fail
    end
    info "🐘 Found ${count} ${prefix}__* variable(s) set by a previous task"
    ''']

[tasks.__os__set_mode_test_py]
plugin = "td-task-tracker"
category = "02 - Tidy"
private = true
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds

    if is_empty ${verbose}
        set_env TD_VERBOSE "false"
    end
    debug "🔅 Using td verbose: '${TD_VERBOSE}'"

    at_fast = get_env TD_AT_FAST
    at_fast = eq ${at_fast} "true"
    at_warp = get_env TD_AT_WARP
    at_warp = eq ${at_warp} "true"

    seen_start = set false
    seen_stop = set false
    seen_status = set false
    seen_help = set false

    arguments = split ${CARGO_MAKE_TASK_ARGS} ;
    for argument in ${arguments}
        if eq ${argument} "--no-license"
            set_env TD_WITH_LICENSE "false"
        end
        if eq ${argument} "--no-compile"
            set_env TD_WITH_COMPILE "false"
        end
        if eq ${argument} "--no-deploy"
            set_env TD_WITH_DEPLOY "false"
        end
        if eq ${argument} "--no-server"
            set_env TD_WITH_SERVER_START "false"
            set_env TD_WITH_SERVER_STOP "false"
        end
        if eq ${argument} "--no-server-start"
            set_env TD_WITH_SERVER_START "false"
        end
        if eq ${argument} "--no-server-stop"
            set_env TD_WITH_SERVER_STOP "false"
        end
        if eq ${argument} "--no-domains"
            set_env TD_WITH_DOMAINS "false"
        end
        if eq ${argument} "--start"
            seen_start = set true
            set_env TD_WITH_SERVER_START "true"
            set_env TD_WITH_SERVER_STOP "false"
            set_env TD_WITH_TESTS_RUN "false"
        end
        if eq ${argument} "--stop"
            seen_stop = set true
            set_env TD_WITH_SERVER_START "false"
            set_env TD_WITH_SERVER_STOP "true"
            set_env TD_WITH_TESTS_RUN "false"
        end
        if eq ${argument} "--status"
            seen_status = set true
            set_env TD_WITH_SERVER_START "false"
            set_env TD_WITH_SERVER_STOP "false"
            set_env TD_WITH_SERVER_STATUS "true"
            set_env TD_WITH_TESTS_RUN "false"
        end
        if eq ${argument} "--no-banners"
            set_env TD_MAKE_WITH_BANNERS "false"
        end
        if eq ${argument} "--no-responsive"
            set_env TD_MAKE_WITH_RESPONSIVE "false"
        end
        if eq ${argument} "--fast"
            at_fast = set true
        end
        if eq ${argument} "--warp"
            at_warp = set true
        end
        if eq ${argument} "--help"
            seen_help = set true
        end
        if eq ${argument} "-h"
            seen_help = set true
        end
    end

    if ${seen_help}
        set_env TD_WITH_HELP "true"
        set_env TD_TEST_PY_PARALLEL "true"
        set_env TD_WITH_LICENSE "false"
        set_env TD_WITH_COMPILE "false"
        set_env TD_WITH_DEPLOY "false"
        set_env TD_WITH_PERMIT "false"
        set_env TD_WITH_SERVER_START "false"
        set_env TD_WITH_SERVER_STOP "false"
        set_env TD_WITH_SERVER_STATUS "false"
        set_env TD_WITH_DOMAINS "false"
    else
        set_env TD_WITH_HELP "false"
    end

    lifecycle_count = set 0
    if ${seen_start}
        lifecycle_count = calc ${lifecycle_count} + 1
    end
    if ${seen_stop}
        lifecycle_count = calc ${lifecycle_count} + 1
    end
    if ${seen_status}
        lifecycle_count = calc ${lifecycle_count} + 1
    end
    lifecycle_conflict = greater_than ${lifecycle_count} 1
    if ${lifecycle_conflict}
        error ""
        error "🧨 '--start', '--stop' and '--status' are mutually exclusive."
        error ""
        error "🛟 '--start' does setup and starts the tabsdata servers (no tests, no stop)."
        error "🛟 '--stop' only runs teardown and stops the tabsdata servers (no start, no tests)."
        error "🛟 '--status' does setup and reports the tabsdata servers status (no start, no stop, no tests)."
        error ""
        assert false
    end

    if ${at_warp}
        at_fast = set true
    end

    if ${at_fast}
        set_env TD_AT_FAST "true"
        set_env TD_WITH_PERMIT "false"
        set_env TD_WITH_LICENSE "false"
        set_env TD_WITH_COMPILE "false"
        set_env TD_WITH_DEPLOY "false"
        set_env TD_MAKE_WITH_BANNERS "false"
        set_env TD_MAKE_WITH_RESPONSIVE "false"
        debug "✈️ Fast mode: skipping permit, license, compile, deploy, banners and responsive."
    end
    if ${at_warp}
        set_env TD_AT_WARP "true"
        set_env TD_WITH_SERVER_START "false"
        set_env TD_WITH_SERVER_STOP "false"
        debug "🛸 Warp mode: also skipping server."
    end

    with_license = get_env TD_WITH_LICENSE
    with_license_empty = is_empty ${with_license}
    with_license_true = eq ${with_license} "true"
    with_license = set ${with_license_empty} or ${with_license_true}
    if ${with_license}
        set_env TD_WITH_LICENSE "true"
    else
        set_env TD_WITH_LICENSE "false"
    end
    TD_WITH_LICENSE = get_env TD_WITH_LICENSE
    debug "🔅 Using td license: '${TD_WITH_LICENSE}'"

    with_compile = get_env TD_WITH_COMPILE
    with_compile_empty = is_empty ${with_compile}
    with_compile_true = eq ${with_compile} "true"
    on_ga = get_env TD_ON_GA
    on_ga_true = eq ${on_ga} "true"
    with_compile = set ${with_compile_empty} or ${with_compile_true}
    if ${on_ga_true}
        set_env TD_WITH_COMPILE "true"
    else
        if ${with_compile}
            set_env TD_WITH_COMPILE "true"
        else
            set_env TD_WITH_COMPILE "false"
        end
    end
    TD_WITH_COMPILE = get_env TD_WITH_COMPILE
    debug "🔅 Using td compile: '${TD_WITH_COMPILE}'"

    with_deploy = get_env TD_WITH_DEPLOY
    with_deploy_empty = is_empty ${with_deploy}
    with_deploy_true = eq ${with_deploy} "true"
    with_deploy = set ${with_deploy_empty} or ${with_deploy_true}
    if ${on_ga_true}
        set_env TD_WITH_DEPLOY "true"
    else
        if ${with_deploy}
            set_env TD_WITH_DEPLOY "true"
        else
            set_env TD_WITH_DEPLOY "false"
        end
    end
    TD_WITH_DEPLOY = get_env TD_WITH_DEPLOY
    debug "🔅 Using td deploy: '${TD_WITH_DEPLOY}'"

    with_server_start = get_env TD_WITH_SERVER_START
    with_server_start_empty = is_empty ${with_server_start}
    with_server_start_true = eq ${with_server_start} "true"
    with_server_start = set ${with_server_start_empty} or ${with_server_start_true}
    if ${with_server_start}
        set_env TD_WITH_SERVER_START "true"
    else
        set_env TD_WITH_SERVER_START "false"
    end
    TD_WITH_SERVER_START = get_env TD_WITH_SERVER_START
    debug "🔅 Using td with server start: '${TD_WITH_SERVER_START}'"

    with_server_stop = get_env TD_WITH_SERVER_STOP
    with_server_stop_empty = is_empty ${with_server_stop}
    with_server_stop_true = eq ${with_server_stop} "true"
    with_server_stop = set ${with_server_stop_empty} or ${with_server_stop_true}
    if ${with_server_stop}
        set_env TD_WITH_SERVER_STOP "true"
    else
        set_env TD_WITH_SERVER_STOP "false"
    end
    TD_WITH_SERVER_STOP = get_env TD_WITH_SERVER_STOP
    debug "🔅 Using td with server stop: '${TD_WITH_SERVER_STOP}'"

    with_server_status = get_env TD_WITH_SERVER_STATUS
    with_server_status_true = eq ${with_server_status} "true"
    if ${with_server_status_true}
        set_env TD_WITH_SERVER_STATUS "true"
    else
        set_env TD_WITH_SERVER_STATUS "false"
    end
    TD_WITH_SERVER_STATUS = get_env TD_WITH_SERVER_STATUS
    debug "🔅 Using td with server status: '${TD_WITH_SERVER_STATUS}'"

    umbrella_server_start = get_env TD_UMBRELLA_SERVER_START
    if not is_empty ${umbrella_server_start}
        set_env TD_WITH_SERVER_START ${umbrella_server_start}
        debug "🔅 Umbrella override for server start: '${umbrella_server_start}'"
    end
    umbrella_server_stop = get_env TD_UMBRELLA_SERVER_STOP
    if not is_empty ${umbrella_server_stop}
        set_env TD_WITH_SERVER_STOP ${umbrella_server_stop}
        debug "🔅 Umbrella override for server stop: '${umbrella_server_stop}'"
    end
    with_domains = get_env TD_WITH_DOMAINS
    with_domains_empty = is_empty ${with_domains}
    with_domains_true = eq ${with_domains} "true"
    with_domains = set ${with_domains_empty} or ${with_domains_true}
    if ${with_domains}
        set_env TD_WITH_DOMAINS "true"
    else
        set_env TD_WITH_DOMAINS "false"
    end
    TD_WITH_DOMAINS = get_env TD_WITH_DOMAINS
    debug "🔅 Using td with domains: '${TD_WITH_DOMAINS}'"

    umbrella_server_status = get_env TD_UMBRELLA_SERVER_STATUS
    if not is_empty ${umbrella_server_status}
        set_env TD_WITH_SERVER_STATUS ${umbrella_server_status}
        debug "🔅 Umbrella override for server status: '${umbrella_server_status}'"
    end

    with_tests_run = get_env TD_WITH_TESTS_RUN
    with_tests_run_empty = is_empty ${with_tests_run}
    with_tests_run_true = eq ${with_tests_run} "true"
    with_tests_run = set ${with_tests_run_empty} or ${with_tests_run_true}
    if ${with_tests_run}
        set_env TD_WITH_TESTS_RUN "true"
    else
        set_env TD_WITH_TESTS_RUN "false"
    end
    TD_WITH_TESTS_RUN = get_env TD_WITH_TESTS_RUN
    debug "🔅 Using td with tests run: '${TD_WITH_TESTS_RUN}'"

    make_with_banners = get_env TD_MAKE_WITH_BANNERS
    make_with_banners_empty = is_empty ${make_with_banners}
    make_with_banners_true = eq ${make_with_banners} "true"
    make_with_banners = set ${make_with_banners_empty} or ${make_with_banners_true}
    if ${make_with_banners}
        set_env TD_MAKE_WITH_BANNERS "true"
    else
        set_env TD_MAKE_WITH_BANNERS "false"
    end
    TD_MAKE_WITH_BANNERS = get_env TD_MAKE_WITH_BANNERS
    debug "🔅 Using td make with banners: '${TD_MAKE_WITH_BANNERS}'"

    make_with_responsive = get_env TD_MAKE_WITH_RESPONSIVE
    make_with_responsive_empty = is_empty ${make_with_responsive}
    make_with_responsive_true = eq ${make_with_responsive} "true"
    make_with_responsive = set ${make_with_responsive_empty} or ${make_with_responsive_true}
    if ${make_with_responsive}
        set_env TD_MAKE_WITH_RESPONSIVE "true"
    else
        set_env TD_MAKE_WITH_RESPONSIVE "false"
    end
    TD_MAKE_WITH_RESPONSIVE = get_env TD_MAKE_WITH_RESPONSIVE
    debug "🔅 Using td make with responsive: '${TD_MAKE_WITH_RESPONSIVE}'"

    test_py_parallel = get_env TD_TEST_PY_PARALLEL
    if eq ${test_py_parallel} "false"
        info "🚂 _____ The Python tests will run in serial mode"
        set_env TD_TEST_PY_PARALLEL false
    else
        info "🚆 _____ The Python tests will run in parallel mode"
        set_env TD_TEST_PY_PARALLEL true
    end

    cm_run_task __os__set_generation
    cm_run_task __os__set_kube_uv_mode
    ''']

