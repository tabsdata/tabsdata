[tasks.__os__set_mode_test_rs]
plugin = "td-task-tracker"
category = "02 - Tidy"
private = true
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds

    test_rs_parallel = get_env TD_TEST_RS_PARALLEL
    if eq ${test_rs_parallel} "false"
        info "🚂 _____ The Rust tests will run in serial mode"
        set_env TD_TEST_RS_PARALLEL false
    else
        info "🚆 _____ The Rust tests will run in parallel mode"
        set_env TD_TEST_RS_PARALLEL true
    end
    ''']

[tasks.__os__set_mode_test_py]
plugin = "td-task-tracker"
category = "02 - Tidy"
private = true
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds

    if is_empty ${verbose}
        set_env TD_VERBOSE "false"
    end
    debug "🔅 Using td verbose: '${TD_VERBOSE}'"

    arguments = split ${CARGO_MAKE_TASK_ARGS} ;
    for argument in ${arguments}
        if eq ${argument} "--no-license"
            set_env TD_LICENSE "false"
        end
        if eq ${argument} "--no-compile"
            set_env TD_COMPILE "false"
        end
        if eq ${argument} "--no-deploy"
            set_env TD_DEPLOY "false"
        end
        if eq ${argument} "--no-server"
            set_env TD_SERVER "false"
        end
    end

    license = get_env TD_LICENSE
    license_empty = is_empty ${license}
    license_true = eq ${license} "true"
    license = set ${license_empty} or ${license_true}
    if ${license}
        set_env TD_LICENSE "true"
    else
        set_env TD_LICENSE "false"
    end
    TD_LICENSE = get_env TD_LICENSE
    debug "🔅 Using td license: '${TD_LICENSE}'"

    compile = get_env TD_COMPILE
    compile_empty = is_empty ${compile}
    compile_true = eq ${compile} "true"
    on_ga = get_env TD_ON_GA
    on_ga_true = eq ${on_ga} "true"
    compile = set ${compile_empty} or ${compile_true}
    if ${on_ga_true}
        set_env TD_COMPILE "true"
    else
        if ${compile}
            set_env TD_COMPILE "true"
        else
            set_env TD_COMPILE "false"
        end
    end
    TD_COMPILE = get_env TD_COMPILE
    debug "🔅 Using td compile: '${TD_COMPILE}'"

    deploy = get_env TD_DEPLOY
    deploy_empty = is_empty ${deploy}
    deploy_true = eq ${deploy} "true"
    deploy = set ${deploy_empty} or ${deploy_true}
    if ${on_ga_true}
        set_env TD_DEPLOY "true"
    else
        if ${deploy}
            set_env TD_DEPLOY "true"
        else
            set_env TD_DEPLOY "false"
        end
    end
    TD_DEPLOY = get_env TD_DEPLOY
    debug "🔅 Using td deploy: '${TD_DEPLOY}'"

    server = get_env TD_SERVER
    server_empty = is_empty ${server}
    server_true = eq ${server} "true"
    server = set ${server_empty} or ${server_true}
    if ${server}
        set_env TD_SERVER "true"
    else
        set_env TD_SERVER "false"
    end
    TD_SERVER = get_env TD_SERVER
    debug "🔅 Using td server: '${TD_SERVER}'"

    test_py_parallel = get_env TD_TEST_PY_PARALLEL
    if eq ${test_py_parallel} "false"
        info "🚂 _____ The Python tests will run in serial mode"
        set_env TD_TEST_PY_PARALLEL false
    else
        info "🚆 _____ The Python tests will run in parallel mode"
        set_env TD_TEST_PY_PARALLEL true
    end
    ''']

