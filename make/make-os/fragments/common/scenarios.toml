[tasks.__os__setup_test_rs]
plugin = "td-task-tracker"
category = "04 - Test"
private = true
dependencies = ["__os__set_mode_test_rs"]
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds

    set_env TD_TROUBLESHOOT_RS true
    set_env TD_FAIL_FAST_RS false
    arguments = split ${CARGO_MAKE_TASK_ARGS} ;
    for argument in ${arguments}
        if eq ${argument} "--fail-fast-rs"
            info "⌛️ Fail-Fast enabled. Groups of Rust tests will execute until some group has failures."
            set_env TD_FAIL_FAST_RS true
        end
    end

    # shared_pg_folder = set "${PROJECT_TABSDATA_ROOT_FOLDER}/target/td-test-pg"
    # shared_pg_exists = is_path_exists ${shared_pg_folder}
    # if ${shared_pg_exists}
    #     info "🧹 Removing the stale shared test PostgreSQL folder: ${shared_pg_folder}"
    #     rm -r ${shared_pg_folder}
    # end

    test_rs_parallel = get_env TD_TEST_RS_PARALLEL
    if eq ${test_rs_parallel} "true"
        info "⌛️ Fail-Fast enabled for parallel tests. All groups of Rust tests will execute even if some group has failures."
        set_env TD_FAIL_FAST_RS true
    end
    set_env TD_TESTS_CODE_RS 0

    cm_run_task __os__setup_test_rs_backends
    ''']

