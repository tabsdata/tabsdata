[tasks.__os__setup_test_py]
plugin = "td-task-tracker"
category = "04 - Test"
private = true
dependencies = ["__os__set_mode_test_py", "license"]
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds

    with_help = get_env TD_WITH_HELP
    if eq ${with_help} "true"
        debug "🛟 Help requested; skipping setup."
        exit 0
    end

    set_env TD_INHERIT_TABSDATA_PACKAGES "true"
    set_env TD_OVERRIDE_BUILD_TIMESTAMP "true"
    set_env TD_BUILD_TIMESTAMP "0"

    debug "🔷 _____ Copying assets..."
    cm_run_task __os__generate_assets

    with_compile = get_env TD_WITH_COMPILE
    umbrella_build = get_env TD_UMBRELLA_BUILD
    if not is_empty ${umbrella_build}
        with_compile = set ${umbrella_build}
        debug "🔅 Umbrella override for build: '${umbrella_build}'"
    end
    if eq ${with_compile} "true"
        debug "🔷 _____ Building..."
        cm_run_task build
    else
        debug "🔷 _____ Not building."
    end

    debug "🔷 _____ Generating python binaries..."
    cm_run_task __os__set_bootest_utest
    cm_run_task __os__setup_context_test_py

    td_symlink_polars_libs = get_env TD_SYMLINK_POLARS_LIBS
    if eq ${td_symlink_polars_libs} "true"
        set_env TD_SYMLINK_POLARS_LIBS_PYTEST true
        info "🔗 Setting TD_SYMLINK_POLARS_LIBS_PYTEST to true as TD_SYMLINK_POLARS_LIBS is also set to true"
    end

    with_server_start = get_env TD_WITH_SERVER_START
    if eq ${with_server_start} "true"
        debug "🔷 _____ Starting tabsdata servers (pytest)..."

        set_env TD_INHERIT_TABSDATA_PACKAGES "true"
        set_env TD_OVERRIDE_BUILD_TIMESTAMP "true"
        set_env TD_BUILD_TIMESTAMP "0"

        cm_run_task __os__stop_instances
        cm_run_task __os__drop_instances
        cm_run_task __os__start_instances
        cm_run_task __os__status_instances

        debug "🔷 _____ Creating backend domains..."
        cm_run_task __os__setup_test_py_backends
    else
        info "🚜 Starting tabsdata servers skipped."
    end

    with_server_status = get_env TD_WITH_SERVER_STATUS
    if eq ${with_server_status} "true"
        debug "🔷 _____ Reporting tabsdata servers status (pytest)..."
        cm_run_task __os__ps_instances
    end
    ''']

