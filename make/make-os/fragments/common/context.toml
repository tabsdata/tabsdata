[tasks.__os__quack]
plugin = "td-task-tracker"
category = "100 - Setup"
private = true
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds

    info "🦆 Quack!"
    afplay = which afplay
    if ${afplay}
        exec afplay ../tabsdata-os/make/make-os/resources/sounds/quack.mp3
    fi
    ''']

[tasks.__os__setup_context_test_py]
