    with_deploy = get_env TD_WITH_DEPLOY
    if eq ${with_deploy} "true"
        on_ga = get_env TD_ON_GA
        on_ga_true = eq ${on_ga} "true"
        if ${on_ga_true}
            info "🔷 💎 ::::: Using 'crystallize' as packages deployment model..."
            cm_run_task dehydrate
            cm_run_task uncrystallize
            cm_run_task crystallize
        else
            info "🔷 💧 ::::: Using 'hydrate' as packages deployment model..."
            cm_run_task uncrystallize
            cm_run_task dehydrate
            cm_run_task hydrate
        end
        cm_run_task __os__check_hydrate_py
    else
        debug "🔷 _____ Skipping packages deployment (TD_WITH_DEPLOY=false)."
    end

    debug "🔷 _____ Setting up tabsdata pytest python path..."

    if is_debug
        debug "🔍 Current Python sys.path before bootest:"
        exec python -c "import sys; print('\\n'.join(sys.path))"
    end

    debug "🚀 python ${PROJECT_PY_TD_TABSDATA_FOLDER}/src/utest/python/test_tabsdata/bootest.py"
    output = exec --fail-on-error python ${PROJECT_PY_TD_TABSDATA_FOLDER}/src/utest/python/test_tabsdata/bootest.py
    debug "📦 The received pythonpath is ${output.stdout}"

    pythonpath = set ${output.stdout}
    debug "✅ Python system path will set to: ${pythonpath}"

    old_pythonpath = get_env PYTHONPATH
    debug "✅ Python system path before adjusting: ${old_pythonpath}"
    os_name = get_env OS
    is_windows = contains ${os_name} "Windows"
    if ${is_windows}
        separator = set ";"
    else
        separator = set ":"
    end

    new_pythonpath = set ${pythonpath}
    debug "✅ Python system path after adjusting: ${new_pythonpath}"
    set_env PYTHONPATH ${new_pythonpath}

    set_pythonpath = get_env PYTHONPATH
    debug "🔅 Python system path persisted: ${set_pythonpath}"

    debug "🔅 Python system path set to: ${pythonpath}"

