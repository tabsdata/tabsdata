[tasks.__os__info_tabsdatak_instances]
plugin = "td-task-tracker"
category = "04 - Test"
private = true
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds
    !include_files ./make/make-os/libraries/gen.ds

    cm_run_task __os__set_venv_env

    exec tdx-itest banner --color cyan "📇 Info for kubernetes instances (generation 2)"

    home = get_env HOME
    instances_folder = set ${home}/.tabsdata/instances

    documents = array
    instances_folder_exists = is_path_exists ${instances_folder}
    if ${instances_folder_exists}
        instances = glob_array ${instances_folder}/*
        for instance_folder in ${instances}
            instance_is_folder = is_dir ${instance_folder}
            if ${instance_is_folder}
                instance_name = basename ${instance_folder}
                in_arena = instance_in_arena ${instance_name}
                if ${in_arena}
                    settings_file = set ${instance_folder}/.settings.json
                    settings_file_exists = is_file ${settings_file}
                    if ${settings_file_exists}
                        content = readfile ${settings_file}
                        content = trim ${content}
                        document = map
                        map_put ${document} title ${instance_name}
                        map_put ${document} content ${content}
                        array_push ${documents} ${document}
                    else
                        debug "➖ Skipping non-kubernetes instance: ${instance_name}"
                    end
                end
            end
        end
    end

    documents_count = array_length ${documents}
    if eq ${documents_count} "0"
        info "🚜 No kubernetes instances found in ${instances_folder}."
    else
        payload = json_encode --collection ${documents}
        set_env TD_RENDER_PAYLOAD ${payload}
        exec --fail-on-error tdx-json --env TD_RENDER_PAYLOAD
        unset_env TD_RENDER_PAYLOAD
    end
    release --recursive ${documents}

    cm_run_task __os__reset_venv_env
    ''']

[tasks.__os__list_tabsdatak_instances]
plugin = "td-task-tracker"
category = "04 - Test"
private = true
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds
    !include_files ./make/make-os/libraries/gen.ds

    cm_run_task __os__set_venv_env

    exec tdx-itest banner --color magenta "📋 List of kubernetes instances (generation 2)"

    home = get_env HOME
    instances_folder = set ${home}/.tabsdata/instances

    rows = array
    instances_folder_exists = is_path_exists ${instances_folder}
    if ${instances_folder_exists}
        instances = glob_array ${instances_folder}/*
        for instance_folder in ${instances}
            instance_is_folder = is_dir ${instance_folder}
            if ${instance_is_folder}
                instance_name = basename ${instance_folder}
                in_arena = instance_in_arena ${instance_name}
                if ${in_arena}
                    settings_file = set ${instance_folder}/.settings.json
                    settings_file_exists = is_file ${settings_file}
                    if ${settings_file_exists}
                        content = readfile ${settings_file}
                        settings = json_parse --collection ${content}
                        provider = map_get ${settings} provider
                        state = map_get ${settings} state
                        locality = map_get ${settings} locality
                        apiserver_port = set ""
                        ports = map_get ${settings} ports
                        for port_entry in ${ports}
                            port_role = map_get ${port_entry} role
                            if eq ${port_role} "apiserver_public_port"
                                apiserver_port = map_get ${port_entry} port
                            end
                        end
                        release --recursive ${settings}

                        row = array
                        array_push ${row} ${instance_name}
                        array_push ${row} ${provider}
                        array_push ${row} ${state}
                        array_push ${row} ${locality}
                        array_push ${row} ${apiserver_port}
                        array_push ${row} ${instance_folder}
                        array_push ${rows} ${row}
                    else
                        debug "➖ Skipping non-kubernetes instance: ${instance_name}"
                    end
                end
            end
        end
    end

    rows_count = array_length ${rows}
    if eq ${rows_count} "0"
        info "🚜 No kubernetes instances found in ${instances_folder}."
    else
        columns = array
        column = map
        map_put ${column} name "Name"
        array_push ${columns} ${column}
        column = map
        map_put ${column} name "Provider"
        array_push ${columns} ${column}
        column = map
        map_put ${column} name "State"
        map_put ${column} color_scheme "status"
        array_push ${columns} ${column}
        column = map
        map_put ${column} name "Locality"
        array_push ${columns} ${column}
        column = map
        map_put ${column} name "API Server Port"
        array_push ${columns} ${column}
        column = map
        map_put ${column} name "Folder"
        array_push ${columns} ${column}

        table = map
        map_put ${table} columns ${columns}
        map_put ${table} rows ${rows}

        payload = json_encode --collection ${table}
        set_env TD_RENDER_PAYLOAD ${payload}
        exec --fail-on-error tdx-table --env TD_RENDER_PAYLOAD
        unset_env TD_RENDER_PAYLOAD
        release --recursive ${table}
    end

    cm_run_task __os__reset_venv_env
    ''']

[tasks.__os__stop_tabsdatak_instances]
plugin = "td-task-tracker"
category = "04 - Test"
private = true
dependencies = ["__os__tdkserver_binary"]
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds
    !include_files ./make/make-os/libraries/gen.ds

    debug "🔷 _____ Stopping tabsdata kubernetes testing servers..."

    on_ga = get_env TD_ON_GA
    on_ga_true = eq ${on_ga} "true"

    verbose = set false
    arguments = split ${CARGO_MAKE_TASK_ARGS} ;
    for argument in ${arguments}
        if eq ${argument} "--verbose"
            verbose = set true
        end
    end
    if ${on_ga_true}
        verbose = set true
    end

    cm_run_task __os__set_venv_env

    exists = is_path_exists ${ITEST_TDKSERVER_BINARY}
    if ${exists}
        instances = exec tdx-itest registry list ${ITEST_REGISTRY_FILE}
        instances = split ${instances.stdout} "\n"

        for instance in ${instances}
            instance = trim ${instance}
            in_arena = instance_in_arena ${instance}
            if ${in_arena}
                generation = get_env TD_TABSDATA_GENERATION
                exec tdx-itest banner --color dark_orange "🔅 Stopping kubernetes instance: ${instance} (generation ${generation})"
                if ${on_ga_true}
                    debug "🚀 ${ITEST_TDKSERVER_BINARY} --accept-terms y --verbose stop --instance ${instance} --yes"
                    exec ${ITEST_TDKSERVER_BINARY} --accept-terms y --verbose stop --instance ${instance} --yes
                elseif not ${verbose}
                    debug "🚀 ${ITEST_TDKSERVER_BINARY} --accept-terms y stop --instance ${instance} --yes"
                    spinner = spawn python ${SPINNER_SCRIPT} "Stopping instance ${instance}..."
                    output = exec ${ITEST_TDKSERVER_BINARY} --accept-terms y stop --instance ${instance} --yes
                    exec kill ${spinner}
                    echo ""
                    if not eq ${output.code} 0
                        warn "⚠️ Stopping instance ${instance} reported exit code ${output.code}."
                        warn "\n${output.stdout}"
                        warn "\n${output.stderr}"
                    end
                else
                    debug "🚀 ${ITEST_TDKSERVER_BINARY} --accept-terms y stop --instance ${instance} --yes"
                    exec ${ITEST_TDKSERVER_BINARY} --accept-terms y stop --instance ${instance} --yes
                end
            end
        end
    else
        warn "🚚 Binary for tdkserver not available. Skipping tdkserver stop."
    end

    cm_run_task __os__ps_tabsdatak_instances

    cm_run_task __os__reset_venv_env
    ''']

[tasks.__os__drop_tabsdatak_instances]
plugin = "td-task-tracker"
category = "04 - Test"
private = true
dependencies = ["__os__tdkserver_binary"]
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds
    !include_files ./make/make-os/libraries/gen.ds

    debug "🔷 _____ Trashing tabsdata kubernetes testing servers..."

    on_ga = get_env TD_ON_GA
    on_ga_true = eq ${on_ga} "true"

    verbose = set false
    arguments = split ${CARGO_MAKE_TASK_ARGS} ;
    for argument in ${arguments}
        if eq ${argument} "--verbose"
            verbose = set true
        end
    end
    if ${on_ga_true}
        verbose = set true
    end

    cm_run_task __os__set_venv_env

    exists = is_path_exists ${ITEST_TDKSERVER_BINARY}
    if ${exists}
        instances = exec tdx-itest registry list ${ITEST_REGISTRY_FILE}
        instances = split ${instances.stdout} "\n"

        for instance in ${instances}
            instance = trim ${instance}
            in_arena = instance_in_arena ${instance}
            if ${in_arena}
                generation = get_env TD_TABSDATA_GENERATION
                exec tdx-itest banner --color red "🔅 Trashing kubernetes instance: ${instance} (generation ${generation})"
                if ${on_ga_true}
                    debug "🚀 ${ITEST_TDKSERVER_BINARY} --accept-terms y --verbose trash --instance ${instance} --yes"
                    exec ${ITEST_TDKSERVER_BINARY} --accept-terms y --verbose trash --instance ${instance} --yes
                elseif not ${verbose}
                    debug "🚀 ${ITEST_TDKSERVER_BINARY} --accept-terms y trash --instance ${instance} --yes"
                    spinner = spawn python ${SPINNER_SCRIPT} "Trashing instance ${instance}..."
                    output = exec ${ITEST_TDKSERVER_BINARY} --accept-terms y trash --instance ${instance} --yes
                    exec kill ${spinner}
                    echo ""
                    if not eq ${output.code} 0
                        warn "⚠️ Trashing instance ${instance} reported exit code ${output.code}."
                        warn "\n${output.stdout}"
                        warn "\n${output.stderr}"
                    end
                else
                    debug "🚀 ${ITEST_TDKSERVER_BINARY} --accept-terms y trash --instance ${instance} --yes"
                    exec ${ITEST_TDKSERVER_BINARY} --accept-terms y trash --instance ${instance} --yes
                end
                exec tdx-itest registry remove ${ITEST_REGISTRY_FILE} ${instance}
            end
        end
    else
        warn "🚚 Binary for tdkserver not available. Skipping tdkserver trash."
    end

    cm_run_task __os__ps_tabsdatak_instances

    cm_run_task __os__reset_venv_env
    ''']
