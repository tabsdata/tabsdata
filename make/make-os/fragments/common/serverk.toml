[tasks.__os__start_tabsdatak_instances]
plugin = "td-task-tracker"
category = "04 - Test"
private = true
dependencies = ["__os__tdkserver_binary"]
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds
    !include_files ./make/make-os/libraries/gen.ds

    debug "🔷 _____ Starting tabsdata kubernetes testing servers..."

    on_ga = get_env TD_ON_GA
    on_ga_true = eq ${on_ga} "true"

    verbose = set false
    arguments = split ${CARGO_MAKE_TASK_ARGS} ;
    for argument in ${arguments}
        if eq ${argument} "--verbose"
            verbose = set true
        end
    end
    if ${on_ga_true}
        verbose = set true
    end

    cm_run_task __os__set_venv_env

    exists = is_path_exists ${ITEST_TDKSERVER_BINARY}
    if ${exists}
        instance_types = exec --fail-on-error tdx-itest types ${ITEST_INSTANCES_CONFIG}
        instance_types = split ${instance_types.stdout} "\n"

        for instance_type in ${instance_types}
            instance_type = trim ${instance_type}
            in_arena = instance_in_arena ${instance_type}
            if ${in_arena}
                resolved_arguments = exec tdx-itest arguments ${ITEST_INSTANCES_CONFIG} ${instance_type}
                if not eq ${resolved_arguments.code} "0"
                    error "🚫 Could not resolve arguments for instance type '${instance_type}' (exit code ${resolved_arguments.code})."
                    error "\n${resolved_arguments.stderr}"
                    assert_fail
                end

                instance = exec tdx-itest name ${instance_type}
                if not eq ${instance.code} "0"
                    error "🚫 Could not generate a name for instance type '${instance_type}'."
                    assert_fail
                end
                instance = trim ${instance.stdout}

                base_port = exec tdx-itest port ${ITEST_PORTS_LOCK}
                if not eq ${base_port.code} "0"
                    error "🚫 Could not pick a base port for instance '${instance}'."
                    error "${base_port.stderr}"
                    assert_fail
                end
                base_port = trim ${base_port.stdout}

                generation = get_env TD_TABSDATA_GENERATION
                exec tdx-itest banner --color blue "🔅 Starting kubernetes instance: ${instance} (type ${instance_type}, base port ${base_port}, generation ${generation})"

                instance_arguments = array
                array_push ${instance_arguments} ${ITEST_TDKSERVER_BINARY}
                array_push ${instance_arguments} --accept-terms
                array_push ${instance_arguments} y
                if ${on_ga_true}
                    array_push ${instance_arguments} --verbose
                end
                array_push ${instance_arguments} quickstart
                array_push ${instance_arguments} --instance
                array_push ${instance_arguments} ${instance}
                array_push ${instance_arguments} --provider
                array_push ${instance_arguments} kminus
                array_push ${instance_arguments} --port
                array_push ${instance_arguments} ${base_port}
                array_push ${instance_arguments} --yes

                resolved_arguments_lines = split ${resolved_arguments.stdout} "\n"
                for resolved_argument in ${resolved_arguments_lines}
                    resolved_argument = trim ${resolved_argument}
                    if not is_empty ${resolved_argument}
                        array_push ${instance_arguments} ${resolved_argument}
                    end
                end

                command = array_join ${instance_arguments} " "
                debug "🚀 ${command}"

                if not ${verbose}
                    spinner = spawn python ${SPINNER_SCRIPT} "Starting instance ${instance}..."
                    output = exec %{command}
                    exec kill ${spinner}
                    echo ""
                    quickstart_code = set ${output.code}
                    if not eq ${quickstart_code} 0
                        error "🚫 Failed to start instance ${instance} (exit code ${quickstart_code})."
                        error "\n${output.stdout}"
                        error "\n${output.stderr}"
                        assert_fail
                    end
                else
                    quickstart_code = exec --get-exit-code %{command}
                    if not eq ${quickstart_code} 0
                        error "🚫 Failed to start instance ${instance} (exit code ${quickstart_code})."
                        assert_fail
                    end
                end

                exec --fail-on-error tdx-itest registry append ${ITEST_REGISTRY_FILE} ${instance}
            end
        end
    else
        warn "🚚 Binary for tdkserver not available. Skipping tdkserver start."
    end

    cm_run_task __os__ps_tabsdatak_instances

    cm_run_task __os__reset_venv_env
    ''']

[tasks.__os__status_tabsdatak_instances]
plugin = "td-task-tracker"
category = "04 - Test"
private = true
dependencies = ["__os__tdkserver_binary"]
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds
    !include_files ./make/make-os/libraries/gen.ds

    debug "🔷 _____ Checking tabsdata kubernetes testing servers..."

    on_ga = get_env TD_ON_GA
    on_ga_true = eq ${on_ga} "true"

    cm_run_task __os__set_venv_env

    exists = is_path_exists ${ITEST_TDKSERVER_BINARY}
    if ${exists}
        instances = exec --fail-on-error tdx-itest registry list ${ITEST_REGISTRY_FILE}
        instances = split ${instances.stdout} "\n"

        for instance in ${instances}
            instance = trim ${instance}
            in_arena = instance_in_arena ${instance}
            if ${in_arena}
                info "🎯 Checking instance: ${instance}"

                status_timeout = calc 5 * 60
                status_sleep = set 10000
                status_attempts = calc ${status_timeout} * 1000
                status_attempts = calc ${status_attempts} / ${status_sleep}

                status_attempt = set 0
                status_checking = set true

                while ${status_checking}
                    if ${on_ga_true}
                        output = exec ${ITEST_TDKSERVER_BINARY} --accept-terms y --verbose status --instance ${instance}
                    else
                        output = exec ${ITEST_TDKSERVER_BINARY} --accept-terms y status --instance ${instance}
                    end
                    serving = eq ${output.code} "0"
                    if ${serving}
                        info "🚦 Verified instance ${instance} is running"
                        info "⏳ Waiting for all declared ports of instance ${instance} to be listening..."
                        ready = exec tdx-itest ready ${instance}
                        if not eq ${ready.code} "0"
                            error "😡 Instance ${instance} did not open all its ports."
                            error "\n${ready.stderr}"
                            assert_fail
                        end
                        info "🚦 Verified instance ${instance} ports are listening"
                        status_checking = set false
                    else
                        status_attempt = calc ${status_attempt} + 1
                        status_exhausted = eq ${status_attempt} ${status_attempts}
                        if ${status_exhausted}
                            error "😡 Cancelling execution as instance ${instance} did not start after ${status_timeout} seconds"
                            error "🛞👀 <out.i>"
                            error "${output.stdout}"
                            error "🛞👀 <out.f>"
                            error "🛞👀 <err.i>"
                            error "${output.stderr}"
                            error "🛞👀 <err.f>"
                            assert_fail
                        end
                        sleep ${status_sleep}
                    end
                end
            end
        end
    else
        warn "🚚 Binary for tdkserver not available. Skipping tdkserver status."
    end

    cm_run_task __os__ps_tabsdatak_instances

    cm_run_task __os__reset_venv_env
    ''']

