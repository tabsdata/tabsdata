[tasks.__os__tdkserver_binary]
plugin = "td-task-tracker"
category = "04 - Test"
private = true
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds

    if is_empty ${profile}
        build-folder = set "debug"
    else
        is_dev = eq ${profile} "dev"
        if ${is_dev}
            build-folder = set "debug"
        else
            build-folder = set ${profile}
        end
    end
    if not is_empty ${td-target}
        build-folder = set ${td-target}/${build-folder}
    end

    os_family = os_family
    if eq ${os_family} "windows"
        tdkserver = set "tdkserver.exe"
    else
        tdkserver = set "tdkserver"
    end

    tdkserver_binary = set ${PROJECT_TABSDATA_ROOT_FOLDER}/target/${build-folder}/${tdkserver}
    set_env ITEST_TDKSERVER_BINARY ${tdkserver_binary}
    debug "🔅 Using tdkserver binary: ${tdkserver_binary}"
    ''']

