[tasks.__os__ps_instances]
plugin = "td-task-tracker"
category = "04 - Test"
private = true
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds

    generation = get_env TD_TABSDATA_GENERATION
    if eq ${generation} "1"
        cm_run_task __os__ps_tabsdata_instances
        cm_run_task __os__ps_tabsdatak_instances
    elseif eq ${generation} "2"
        cm_run_task __os__ps_tabsdatak_instances
    else
        error "🧨 Unhandled tabsdata Generation: '${generation}'."
        assert false
    end
    ''']

