[tasks.__os__start_pytest_tabsdata_servers]
plugin = "td-task-tracker"
category = "04 - Test"
private = true
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds
    !include_files ./make/make-os/libraries/gen.ds

    assert_tabsdata_generation tdserver

    debug "🔷 _____ Starting tabsdata testing servers..."

    on_ga = get_env TD_ON_GA
    on_ga_true = eq ${on_ga} "true"
    verbose = set false
    arguments = split ${CARGO_MAKE_TASK_ARGS} ;
    for argument in ${arguments}
        if eq ${argument} "--verbose"
            verbose = set true
        end
    end
    if ${on_ga_true}
        verbose = set true
    end
    debug "🔅 Using verbose mode: ${verbose}"

    debug "🔴️ Before set..."
    cm_run_task __os__show_venv_env

    cm_run_task __os__set_venv_env

    debug "🟢 After set..."
    cm_run_task __os__show_venv_env

    if is_empty ${profile}
        build-folder = set "debug"
    else
        is_dev = eq ${profile} "dev"
        if ${is_dev}
            build-folder = set "debug"
        else
            build-folder = set ${profile}
        end
    end
    if not is_empty ${td-target}
        build-folder = set ${td-target}/${build-folder}
    end
    debug "🔅 Using build folder ${build-folder}"
    os_family = os_family
    if eq ${os_family} "windows"
        tdserver = set "tdserver.exe"
    else
        tdserver = set "tdserver"
    end

    exists = is_path_exists ${PROJECT_TABSDATA_ROOT_FOLDER}/target/${build-folder}/${tdserver}
    if ${exists}
        debug "🔅 Using tdserver binary: '${os_family}' - '${tdserver}'"

        instances = exec --fail-on-error python ${TESTING_INSTANCES_SCRIPT} ${TESTING_SUPERVISORS_CONFIG}
        instances = split ${instances.stdout} "\n"

        for instance in ${instances}
            instance = trim ${instance}
            in_arena = instance_in_arena ${instance}
            if ${in_arena}
                database_port = exec --fail-on-error python ${TESTING_DATABASE_SCRIPT} ${TESTING_SUPERVISORS_CONFIG} ${instance}
                database_port = trim ${database_port.stdout}
                debug "🔅 Database port for ${instance}: ${database_port}"

                apiserver_port = exec --fail-on-error python ${TESTING_APISERVER_SCRIPT} ${TESTING_SUPERVISORS_CONFIG} ${instance}
                apiserver_port = trim ${apiserver_port.stdout}
                debug "🔅 Apiserver port for ${instance}: ${apiserver_port}"

                generation = get_env TD_TABSDATA_GENERATION
                exec tdx-itest banner --color blue "🔅 Starting supervisor instance: ${instance} (apiserver port ${apiserver_port}, database port ${database_port}, generation ${generation})"

                temp_folder = temp_dir
                profile_folder = set ${temp_folder}/td-testing-profile/${instance}

                profile_apiserver_config_folder = set ${profile_folder}/workspace/config/proc/regular/apiserver/config
                profile_apiserver_config_file = set ${profile_apiserver_config_folder}/config.yaml
                mkdir ${profile_apiserver_config_folder}
                apiserver_config_content = readfile ${TESTING_PROFILE_CONFIG_FILE}
                apiserver_config_content = replace ${apiserver_config_content} ":2462/" ":${database_port}/"
                writefile ${profile_apiserver_config_file} ${apiserver_config_content}
                debug "🔅 Rendered apiserver config overlay for ${instance}: ${profile_apiserver_config_file}"

                profile_supervisor_config_folder = set ${profile_folder}/workspace/config
                profile_supervisor_config_file = set ${profile_supervisor_config_folder}/config.yaml
                mkdir ${profile_supervisor_config_folder}
                supervisor_config_content = readfile ${TESTING_PROFILE_SUPERVISOR_CONFIG_FILE}
                supervisor_config_content = replace ${supervisor_config_content} ":2457" ":${apiserver_port}"
                writefile ${profile_supervisor_config_file} ${supervisor_config_content}
                debug "🔅 Rendered supervisor config overlay for ${instance}: ${profile_supervisor_config_file}"

                create_arguments = array
                array_push ${create_arguments} ${PROJECT_TABSDATA_ROOT_FOLDER}/target/${build-folder}/${tdserver}
                array_push ${create_arguments} --accept-terms
                array_push ${create_arguments} y
                array_push ${create_arguments} create
                array_push ${create_arguments} --instance
                array_push ${create_arguments} ${instance}
                array_push ${create_arguments} --profile
                array_push ${create_arguments} ${profile_folder}
                create_command = array_join ${create_arguments} " "
                debug "🚀 ${create_command}"
                exec --fail-on-error %{create_command}

                instance_arguments = array
                array_push ${instance_arguments} ${PROJECT_TABSDATA_ROOT_FOLDER}/target/${build-folder}/${tdserver}
                array_push ${instance_arguments} --accept-terms
                array_push ${instance_arguments} y
                array_push ${instance_arguments} start
                array_push ${instance_arguments} --instance
                array_push ${instance_arguments} ${instance}
                array_push ${instance_arguments} --existing
                array_push ${instance_arguments} --

                debug "🚀 python ${TESTING_INSTANCE_SCRIPT} ${TESTING_SUPERVISORS_CONFIG} ${instance}"
                instance_config = exec --fail-on-error python ${TESTING_INSTANCE_SCRIPT} ${TESTING_SUPERVISORS_CONFIG} ${instance}
                instance_config = trim ${instance_config.stdout}
                debug "🔅 Output of yaml parser for ${instance}:\n ${instance_config}"

                instance_parameters = split ${instance_config.stdout} "\n"
                for yaml_line in ${instance_parameters}
                    yaml_line = trim ${yaml_line}
                    if not is_empty ${yaml_line}
                        array_push ${instance_arguments} ${yaml_line}
                    end
                end

                command = array_join ${instance_arguments} " "
                debug "🚀 ${command}"

                on_ga = get_env TD_ON_GA
                on_ga_true = eq ${on_ga} "true"
                os = os_family
                if eq ${os} "windows"
                    exec --fail-on-error %{command}
                else
                    if ${on_ga_true}
                        exec --fail-on-error %{command}
                    else
                        spinner = spawn python ${SPINNER_SCRIPT} "Waiting for the instance ${instance} to start..."
                        output = exec --fail-on-error %{command}
                        exec kill ${spinner}
                        sleep 2000
                        code = set ${output.code}
                        if not eq ${code} 0
                            error "🚫 Failed to start instance ${instance}."
                            error "🛞👀 Result >>>>>"
                            error "🛞👀 <out.i>"
                            error "${output.stdout}"
                            error "🛞👀 <out.f>"
                            error "🛞👀 <err.i>"
                            error "${output.stderr}"
                            error "🛞👀 <err.f>"
                            error "🛞👀 <code.i>"
                            error "${output.code}"
                            error "🛞👀 <code.f>"
                            error "🛞👀 <<<<<"
                            assert_fail
                        end
                    end
                end
            end
        end
    else
        warn "🚚 Binaries for tdserver not available. Skipping tabsdata start."
    end

    cm_run_task __os__ps_pytest_tabsdata_servers

    debug "🟢️ Before reset..."
    cm_run_task __os__show_venv_env

    cm_run_task __os__reset_venv_env

    debug "🔴 After reset..."
    cm_run_task __os__show_venv_env
    ''']

[tasks.__os__status_pytest_tabsdata_servers]
plugin = "td-task-tracker"
category = "04 - Test"
private = true
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds
    !include_files ./make/make-os/libraries/gen.ds

    assert_tabsdata_generation tdserver

    debug "🔷 _____ Checking tabsdata testing servers..."

    debug "🔴️ Before set..."
    cm_run_task __os__show_venv_env

    cm_run_task __os__set_venv_env

    debug "🟢 After set..."
    cm_run_task __os__show_venv_env

    if is_empty ${profile}
        build-folder = set "debug"
    else
        is_dev = eq ${profile} "dev"
        if ${is_dev}
            build-folder = set "debug"
        else
            build-folder = set ${profile}
        end
    end
    if not is_empty ${td-target}
        build-folder = set ${td-target}/${build-folder}
    end
    debug "🔅 Using build folder ${build-folder}"
    os_family = os_family
    if eq ${os_family} "windows"
        tdserver = set "tdserver.exe"
    else
        tdserver = set "tdserver"
    end

    exists = is_path_exists ${PROJECT_TABSDATA_ROOT_FOLDER}/target/${build-folder}/${tdserver}
    if ${exists}
        debug "🔅 Using tdserver binary: '${os_family}' - '${tdserver}'"

        instances = exec --fail-on-error python ${TESTING_INSTANCES_SCRIPT} ${TESTING_SUPERVISORS_CONFIG}
        instances = split ${instances.stdout} "\n"

        for instance in ${instances}
            instance = trim ${instance}
            in_arena = instance_in_arena ${instance}
            if ${in_arena}
                info "🎯 Checking instance: ${instance}"

                supervisor_workers_config_folder_exists = is_path_exists ${SUPERVISOR_WORKERS_CONFIG_FOLDER}
                workers = array
                if ${supervisor_workers_config_folder_exists}
                    supervisor_workers = exec --fail-on-error python -c "import os, sys; path = sys.argv[1]; print('\\n'.join(sorted(name for name in os.listdir(path) if os.path.isdir(os.path.join(path, name)))))" ${SUPERVISOR_WORKERS_CONFIG_FOLDER}
                    supervisor_workers = trim ${supervisor_workers.stdout}
                    supervisor_workers = split ${supervisor_workers} "\n"
                    for supervisor_worker in ${supervisor_workers}
                        supervisor_worker = trim ${supervisor_worker}
                        if not is_empty ${supervisor_worker}
                            debug "📎 Selecting worker: ${supervisor_worker}"
                            array_push ${workers} ${supervisor_worker}
                        end
                    end
                else
                    warn "⚠️ Supervisor regular workers config folder not found: ${SUPERVISOR_WORKERS_CONFIG_FOLDER}"
                end
                workers_list = array_join ${workers} ", "
                if is_empty ${workers_list}
                    debug "❓ No regular supervisor workers configured under ${SUPERVISOR_WORKERS_CONFIG_FOLDER}"
                else
                    debug "🌀 Supervisor workers to check: ${workers_list}"
                end

                debug "🚀 ${PROJECT_TABSDATA_ROOT_FOLDER}/target/${build-folder}/${tdserver} --accept-terms y status --instance ${instance}"

                status_timeout = calc 5 * 60
                status_sleep = set 10000
                status_attempts = calc ${status_timeout} * 1000
                status_attempts = calc ${status_attempts} / ${status_sleep}

                status_attempt = set 0
                status_checking = set true

                while ${status_checking}
                    output_timestamp = exec --fail-on-error python -c "from datetime import datetime; print(datetime.now().isoformat())"
                    current_timestamp = trim ${output_timestamp.stdout}
                    info "☕️ (${current_timestamp}) Checking workers..."

                    output = exec --fail-on-error ${PROJECT_TABSDATA_ROOT_FOLDER}/target/${build-folder}/${tdserver} --accept-terms y status --instance ${instance}

                    workers_started = set true
                    stopped_workers = array
                    for worker in ${workers}
                        worker = trim ${worker}
                        if not is_empty ${worker}
                            info "🔅 Checking worker: ${worker}"
                            worker_started = contains ${output.stdout} ${worker}
                            if not ${worker_started}
                                info "   🔴 Worker ${worker} is not running"
                                workers_started = set false
                                array_push ${stopped_workers} ${worker}
                            else
                                info "   🟢 Worker ${worker} is running"
                            end
                        end
                    end

                    if ${workers_started}
                        if is_empty ${workers_list}
                            info "🚦 Verified supervisor is running"
                        else
                            info "🚦 Verified supervisor & (${workers_list}) are running"
                        end
                        status_checking = set false
                    else
                        stopped_workers_list = array_join ${stopped_workers} ", "
                        debug ". ${status_attempt}"
                        if not is_empty ${stopped_workers_list}
                            debug "👀 Waiting for workers: ${stopped_workers_list}"
                        end
                        status_attempt = calc ${status_attempt} + 1
                        status_exhausted = eq ${status_attempt} ${status_attempts}
                        if ${status_exhausted}
                            error "😡 Cancelling execution as supervisor did not start after ${status_timeout} seconds"
                            error "🛞👀 Supervisor status >>>>>"
                            error "🛞👀 <out.i>"
                            error "${output.stdout}"
                            error "🛞👀 <out.f>"
                            error "🛞👀 <err.i>"
                            error "${output.stderr}"
                            error "🛞👀 <err.f>"
                            error "🛞👀 <code.i>"
                            error "${output.code}"
                            error "🛞👀 <code.f>"
                            error "🛞👀 <<<<<"
                            assert_fail
                        end
                        sleep ${status_sleep}
                    end
                end
            end
        end
    else
        warn "🚚 Binaries for tdserver not available. Skipping tabsdata status."
    end

    cm_run_task __os__ps_pytest_tabsdata_servers

    debug "🟢️ Before reset..."
    cm_run_task __os__show_venv_env

    cm_run_task __os__reset_venv_env

    debug "🔴 After reset..."
    cm_run_task __os__show_venv_env
    ''']

