[tasks.__os__drop_pytest_tabsdata_servers]
plugin = "td-task-tracker"
category = "04 - Test"
private = true
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds
    !include_files ./make/make-os/libraries/gen.ds

    assert_tabsdata_generation tdserver

    debug "🔷 _____ Deleteing tabsdata testing servers..."

    on_ga = get_env TD_ON_GA
    on_ga_true = eq ${on_ga} "true"
    verbose = set false
    arguments = split ${CARGO_MAKE_TASK_ARGS} ;
    for argument in ${arguments}
        if eq ${argument} "--verbose"
            verbose = set true
        end
    end
    if ${on_ga_true}
        verbose = set true
    end
    debug "🔅 Using verbose mode: ${verbose}"

    home_folder = set ${HOME}

    instances = exec --fail-on-error python ${TESTING_INSTANCES_SCRIPT} ${TESTING_SUPERVISORS_CONFIG}
    instances = split ${instances.stdout} "\n"

    for instance in ${instances}
        instance = trim ${instance}
        in_arena = instance_in_arena ${instance}
        if ${in_arena}
            generation = get_env TD_TABSDATA_GENERATION
            exec tdx-itest banner --color red "🔅 Dropping supervisor instance: ${instance} (generation ${generation})"

            instance_folder = set ${home_folder}/.tabsdata/instances/${instance}
            debug "✅ The tabsdata instance ${instance} folder is: ${instance_folder}"
            exists_instance_folder = is_path_exists ${instance_folder}
            if eq ${exists_instance_folder} true
                debug "✅ The tabsdata instance ${instance} folder exists. Deleting it: ${target_dir}..."
                rm -r ${instance_folder}
                debug "✅ The tabsdata instance ${instance} has been deleted: ${target_dir}!"
            else
                debug "✅ The tabsdata instance ${instance} folder does not exist. Skipping deleting it: ${target_dir}."
            end
        end
    end
    ''']
