# accounts_opps.mapping.yml

Insert Account:
  sf_object: Account
  table: Account
  fields:
    - Name
    - Industry
    - Type
    - AnnualRevenue
    - NumberOfEmployees
    - BillingStreet
    - BillingCity
    - BillingState
    - BillingPostalCode
    - BillingCountry
    - Phone
    - Website
    - Description

Insert Opportunity:
  sf_object: Opportunity
  table: Opportunity
  lookups:
    AccountId:
      table: Account
  fields:
    - Name
    - StageName
    - CloseDate
    - Amount
    - Probability
    - LeadSource
    - Type
    - ForecastCategoryName
    - NextStep
    - Description
