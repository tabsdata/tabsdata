#

#  The --tb option controls how Python tracebacks are displayed when tests fail:
#  ┌─────────────┬─────────────────────────────────────────────────┐
#  │   Option    │                   Description                   │
#  ├─────────────┼─────────────────────────────────────────────────┤
#  │ --tb=long   │ Full traceback with source code                 │
#  ├─────────────┼─────────────────────────────────────────────────┤
#  │ --tb=short  │ Shorter traceback                               │
#  ├─────────────┼─────────────────────────────────────────────────┤
#  │ --tb=line   │ One line per failure                            │
#  ├─────────────┼─────────────────────────────────────────────────┤
#  │ --tb=native │ Python standard library format                  │
#  ├─────────────┼─────────────────────────────────────────────────┤
#  │ --tb=no     │ No traceback at all                             │
#  ├─────────────┼─────────────────────────────────────────────────┤
#  │ --tb=auto   │ Long for first/last, short for others (default) │
#  └─────────────┴─────────────────────────────────────────────────┘

