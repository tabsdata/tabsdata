name: "[K-CROSS] Portable Linux builds without cross"

on:
  workflow_dispatch:
    inputs:
      run_on_linux_x86_64:
        description: "Build linux x86_64"
        type: boolean
        default: true
      run_on_linux_arm_64:
        description: "Build linux arm64"
        type: boolean
        default: true
      run_on_macos:
        description: "Build+test macOS (arm64 and x86_64)"
        type: boolean
        default: true
      run_on_windows:
        description: "Build+test Windows (x86_64 and arm64)"
        type: boolean
        default: true
      glibc_floor:
        description: "Maximum permitted GLIBC symbol version"
        type: string
        default: "2.28"
      profile:
        description: "Cargo profile for the binaries"
        type: string
        default: "assembly"
      distro_scope:
        description: "Which distros to verify on"
        type: choice
        default: floor-and-edges
        options:
          # One image per glibc step: fast, still proves the floor and the top.
          - floor-and-edges
          # Every image in the matrix: minors across all major families.
          - full

permissions:
  contents: read

jobs:
  placeholder:
    name: "Placeholder — no build performed"
    runs-on: ubuntu-24.04
    steps:
      - name: "Explain"
        run: |
          {
            echo "### Placeholder workflow"
            echo ""
            echo "This registers \`.github/workflows/cross.yml\` on the default"
            echo "branch so \`workflow_dispatch\` and its input form are"
            echo "available. It performs no build."
            echo ""
            echo "| input | value received |"
            echo "|---|---|"
            echo "| run_on_linux_x86_64 | \`${{ inputs.run_on_linux_x86_64 }}\` |"
            echo "| run_on_linux_arm_64 | \`${{ inputs.run_on_linux_arm_64 }}\` |"
            echo "| run_on_macos | \`${{ inputs.run_on_macos }}\` |"
            echo "| run_on_windows | \`${{ inputs.run_on_windows }}\` |"
            echo "| glibc_floor | \`${{ inputs.glibc_floor }}\` |"
            echo "| profile | \`${{ inputs.profile }}\` |"
            echo "| distro_scope | \`${{ inputs.distro_scope }}\` |"
            echo ""
            echo "Run the real workflow by selecting a branch that carries it."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Placeholder only — select a branch with the real workflow to build."
