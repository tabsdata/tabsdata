profile: production

profiles:
  development:
    output: stdout
    level: debug
    directives:
      - tower::buffer::worker=info
  production:
    output: file
    level: debug
    directives:
      - tower::buffer::worker=info
    sinks:
      - file: sql.log
        directives:
          - sqlx::query=trace
