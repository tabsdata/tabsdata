# storage_url: null # by default given by supervisor
addresses:
  - 0.0.0.0:2457
internal_addresses:
  - 0.0.0.0:2458
password:
  algorithm: argon2id
  version: 19
  memory_cost_mib: 20
  time_cost: 2
  parallelism_cost: 1
jwt:
  #secret: null # by default a UUID is generated
  secret: tabsdata-pytest-fixed-jwt-signing-key
  access_token_expiration: 3600
request_timeout: 60
orchestrator: supervisor
# The server td_dbmanager boots on this URL's port; ${embedded} = the
# generated credentials persisted next to the data dir.
database_server:
  url: postgres://127.0.0.1:2462/postgres
  username: ${embedded}
  password: ${embedded}
  min_connections: 1
  max_connections: 2
  acquire_timeout: 30
  max_lifetime: 1800
  idle_timeout: 30
  test_before_acquire: true
  log_level: off
database:
  apiserver:
    url: postgres://127.0.0.1:2462/postgres
    schema: td_apiserver
    username: td_apiserver
    password: ${embedded}
    min_connections: 1
    max_connections: 10
    acquire_timeout: 30
    max_lifetime: 3600
    idle_timeout: 60
    test_before_acquire: true
    log_level: off
storage:
  mounts:
    - id: ROOT
      path: /
      uri: file://${env:TD_URI_REPOSITORY}/storage/data/
    # IMPORTANT: /bundles must be a local mount.
    - id: BUNDLES
      path: /bundles
      uri: file://${env:TD_URI_REPOSITORY}/storage/bundles/

#    # Mount configuration sample:
#    - id: PREFIX
#      path: /foo
#      uri: file://${env:TD_URI_REPOSITORY}/storage/data/
#      options:
#        - option_1: value1
#          option_2: value2