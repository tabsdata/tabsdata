# storage_url: null # by default given by supervisor
addresses:
  - 0.0.0.0:2457
internal_addresses:
  - 0.0.0.0:2458
password:
  algorithm: argon2id
  version: 19
  memory_cost_mib: 20
  time_cost: 2
  parallelism_cost: 1
jwt:
  #secret: null # by default a UUID is generated
  secret: tabsdata-pytest-fixed-jwt-signing-key
  access_token_expiration: 3600
request_timeout: 60
check_frequency: 60
stuck_requested_timeout: 1800
max_functions_per_tick: 50
tick_timeout: 10
orchestrator: supervisor
# The server td_dbmanager boots on this entry's port; ${embedded} = the
# generated credentials persisted next to the data dir.
database_server:
  postgres:
    host: 127.0.0.1
    port: 2462
    database: postgres
    username: ${embedded}
    password: ${embedded}
  pool:
    admin:
      min_connections: 1
      max_connections: 1
      acquire_timeout: 30
      max_lifetime: 1800
      idle_timeout: 30
      test_before_acquire: true
database:
  apiserver:
    postgres:
      host: 127.0.0.1
      port: 2462
      database: postgres
      password: ${embedded}
    pool:
      regular:
        min_connections: 5
        max_connections: 50
        acquire_timeout: 30
        max_lifetime: 3600
        idle_timeout: 60
        test_before_acquire: true
      exclusive:
        min_connections: 1
        max_connections: 10
        acquire_timeout: 30
        max_lifetime: 3600
        idle_timeout: 60
        test_before_acquire: true
storage:
  mounts:
    - id: ROOT
      path: /
      uri: file://${env:TD_URI_REPOSITORY}/storage/data/
    # IMPORTANT: /bundles must be a local mount.
    - id: BUNDLES
      path: /bundles
      uri: file://${env:TD_URI_REPOSITORY}/storage/bundles/

#    # Mount configuration sample:
#    - id: PREFIX
#      path: /foo
#      uri: file://${env:TD_URI_REPOSITORY}/storage/data/
#      options:
#        - option_1: value1
#          option_2: value2