# storage_url: null # by default given by supervisor
addresses:
  - 0.0.0.0:2457
internal_addresses:
  - 0.0.0.0:2458
password:
  algorithm: argon2id
  version: 19
  memory_cost_mib: 20
  time_cost: 2
  parallelism_cost: 1
jwt:
  #secret: null # by default a UUID is generated
  access_token_expiration: 3600
request_timeout: 60
orchestrator: supervisor
database:
  mode: embedded
  system:
    schema: public
    min_connections: 1
    max_connections: 10
    acquire_timeout: 30
    max_lifetime: 3600
    idle_timeout: 60
    test_before_acquire: true
    log_level: off
  apiserver:
    schema: td_apiserver
storage:
  mounts:
    - id: ROOT
      path: /
      uri: file://${env:TD_URI_REPOSITORY}/storage/data/
    # IMPORTANT: /bundles must be a local mount.
    - id: BUNDLES
      path: /bundles
      uri: file://${env:TD_URI_REPOSITORY}/storage/bundles/

#    # Mount configuration sample:
#    - id: PREFIX
#      path: /foo
#      uri: file://${env:TD_URI_REPOSITORY}/storage/data/
#      options:
#        - option_1: value1
#          option_2: value2