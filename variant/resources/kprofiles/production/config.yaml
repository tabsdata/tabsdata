# Global Tabsdata instance configuration. Per-worker settings live in
# their own files under init/, regular/, and ephemeral/.
#
# Placeholders use the ${KEY} syntax and resolve from the custom
# properties map first, then from the process environment.

name: ${TD_INSTANCE_NAME}

controllers:
  init:
    concurrency: 1
    workers:
      - bootloader
      - server-information
      - apiserver-configuration-resolver
      - apiserver-mounts-options-extractor
  regular:
    concurrency: 0
    workers:
      - apiserver
      - janitor
  ephemeral:
    concurrency: 0
    workers:
      - function
      - crontrigger
      - stagetrigger
