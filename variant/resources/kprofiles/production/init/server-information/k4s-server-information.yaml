apiVersion: v1
kind: Pod
metadata:
  name: td-server-information
  namespace: td-${TD_INSTANCE_NAME}
  labels:
    app.kubernetes.io/name: tabsdata
    app.kubernetes.io/component: server-information
    tabsdata.com/instance: ${TD_INSTANCE_NAME}
    tabsdata.com/worker-tier: init
spec:
  restartPolicy: Never
  containers:
    - name: server-information
      image: ${TD_NPT_BIN}/td_srvinf
      command: ["td_srvinf"]
      env:
        - name: TD_PATH_INSTANCE
          value: ${TD_PATH_INSTANCE}
        - name: TD_PATH_WORKSPACE
          value: ${TD_PATH_WORKSPACE}
        - name: TD_PATH_CONFIG
          value: ${TD_PATH_CONFIG}
        - name: POD_NAME
          value: td-server-information
        - name: POD_NAMESPACE
          value: td-${TD_INSTANCE_NAME}
