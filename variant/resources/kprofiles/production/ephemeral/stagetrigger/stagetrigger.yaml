  - locks-folder
  - logs-folder
  - bin-folder
  - request-folder
  - response-folder
  - input-folder
  - output-folder
  - current-instance
markers:
  - td-collection
  - td-function
  - td-worker
  - td-attempt
get-states:
  - state-type: map
    state-key: apiserver-mounts-options
