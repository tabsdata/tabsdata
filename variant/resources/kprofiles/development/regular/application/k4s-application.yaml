apiVersion: v1
kind: Pod
metadata:
  name: td-application
  namespace: td-${TD_INSTANCE_NAME}
  labels:
    app.kubernetes.io/name: tabsdata
    app.kubernetes.io/component: application
    tabsdata.com/instance: ${TD_INSTANCE_NAME}
    tabsdata.com/worker-tier: regular
spec:
  restartPolicy: Always
  containers:
    - name: application
      image: ${TD_NPT_BIN}/tdk_ac
      command: ["tdk_ac"]
