apiVersion: apps/v1
kind: Deployment
metadata:
  name: td-application
  namespace: td-${TD_INSTANCE_NAME}
  labels:
    app.kubernetes.io/name: tabsdata
    app.kubernetes.io/component: application
    tabsdata.com/instance: ${TD_INSTANCE_NAME}
    tabsdata.com/worker-tier: regular
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/component: application
      tabsdata.com/instance: ${TD_INSTANCE_NAME}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tabsdata
        app.kubernetes.io/component: application
        tabsdata.com/instance: ${TD_INSTANCE_NAME}
        tabsdata.com/worker-tier: regular
    spec:
      restartPolicy: Always
      containers:
        - name: application
          image: busybox:1.37
          command: ["sh", "-c"]
          args:
            - |
              NAME="Dummy Application Worker"
              PERIOD=30
              echo "[$NAME] starting"
              tick=0
              while true; do
                  sleep "$PERIOD"
                  tick=$((tick + 1))
                  echo "[$NAME] tick $tick"
              done
