apiVersion: batch/v1
kind: Job
metadata:
  name: td-initializer
  namespace: td-${TD_INSTANCE_NAME}
  labels:
    app.kubernetes.io/name: tabsdata
    app.kubernetes.io/component: initializer
    tabsdata.com/instance: ${TD_INSTANCE_NAME}
    tabsdata.com/worker-tier: init
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tabsdata
        app.kubernetes.io/component: initializer
        tabsdata.com/instance: ${TD_INSTANCE_NAME}
        tabsdata.com/worker-tier: init
    spec:
      restartPolicy: Never
      containers:
        - name: initializer
          image: busybox:1.37
          command: ["sh", "-c"]
          args:
            - |
              NAME="Dummy Initializer Worker"
              TICKS=5
              echo "[$NAME] starting"
              tick=1
              while [ "$tick" -le "$TICKS" ]; do
                  sleep 1
                  echo "[$NAME] tick $tick/$TICKS"
                  tick=$((tick + 1))
              done
              echo "[$NAME] exiting"
