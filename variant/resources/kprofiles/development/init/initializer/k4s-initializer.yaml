apiVersion: v1
kind: Pod
metadata:
  name: td-initializer
  namespace: td-${TD_INSTANCE_NAME}
  labels:
    app.kubernetes.io/name: tabsdata
    app.kubernetes.io/component: initializer
    tabsdata.com/instance: ${TD_INSTANCE_NAME}
    tabsdata.com/worker-tier: init
spec:
  restartPolicy: Never
  containers:
    - name: initializer
      image: ${TD_NPT_BIN}/tdk_ic
      command: ["tdk_ic"]
