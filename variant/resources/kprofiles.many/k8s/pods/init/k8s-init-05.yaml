apiVersion: batch/v1
kind: Job
metadata:
  name: init-05
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: busybox:1.37
          command: ["sh", "-c"]
          args:
            - |
              i=1
              while [ "$i" -le 10 ]; do
                  echo "[init-05] tick $i/10"
                  sleep 1
                  i=$((i + 1))
              done
              echo "[init-05] done"
