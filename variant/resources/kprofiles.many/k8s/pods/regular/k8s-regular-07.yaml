apiVersion: v1
kind: Pod
metadata:
  name: regular-07
spec:
  restartPolicy: Always
  containers:
    - name: worker
      image: busybox:1.37
      command: ["sh", "-c"]
      args:
        - |
          i=0
          while true; do
              i=$((i + 1))
              echo "[regular-07] tick $i"
              sleep 5
          done
