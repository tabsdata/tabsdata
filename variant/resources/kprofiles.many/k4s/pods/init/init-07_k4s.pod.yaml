apiVersion: batch/v1
kind: Job
metadata:
  name: init-07
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: /dev/null
          command: ["/bin/sh", "-c"]
          args:
            - |
              i=1
              while [ "$i" -le 10 ]; do
                  echo "[init-07] tick $i/10"
                  sleep 1
                  i=$((i + 1))
              done
              echo "[init-07] done"
