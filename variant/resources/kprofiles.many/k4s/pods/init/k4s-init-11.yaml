# Demo: ConfigMap-volume mount in kminus.
#
# Mounts the pre-existing `tabsdata` ConfigMap (staged by the cluster-start
# flow) as a directory. Each key in the ConfigMap becomes a file under
# the mount path; the container reads each file and asserts the value.
#
# kminus specifics:
#   - image is /dev/null (host-process; no real container image is pulled).
#   - kminus only supports whole-configmap mounts (no items / subPath /
#     defaultMode / optional). Each key becomes a file under mountPath.
#   - kminus convention: mount configmaps at /configmaps/<configmap-name>.
#   - kminus auto-injects KM_CONTAINER_ROOT into every container with the
#     container's working directory. K8s absolute mountPaths are rewritten
#     to <container_root>/<mountPath> during preparation, so commands must
#     reference the mount via $KM_CONTAINER_ROOT/<mountPath>.

apiVersion: batch/v1
kind: Job
metadata:
  name: init-11
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: /dev/null
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "[init-11] reading mounted ConfigMap 'tabsdata' under $KM_CONTAINER_ROOT/configmaps/tabsdata"
              for f in $KM_CONTAINER_ROOT/configmaps/tabsdata/*; do
                [ -f "$f" ] || continue
                printf '[init-11]   %s = %s\n' "$(basename "$f")" "$(cat "$f")"
              done
              echo "[init-11] done"
          volumeMounts:
            - name: tabsdata
              mountPath: /configmaps/tabsdata
              readOnly: true
      volumes:
        - name: tabsdata
          configMap:
            name: tabsdata
