apiVersion: v1
kind: Pod
metadata:
  name: regular-10
spec:
  restartPolicy: Always
  containers:
    - name: worker
      image: /dev/null
      command: ["/bin/sh", "-c"]
      args:
        - |
          i=0
          while true; do
              i=$((i + 1))
              echo "[regular-10] tick $i"
              sleep 5
          done
