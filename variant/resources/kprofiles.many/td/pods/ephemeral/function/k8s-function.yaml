apiVersion: batch/v1
kind: Job
metadata:
  name: td-function-${TD_RUN_ID}
  namespace: td-${TD_INSTANCE_NAME}
  labels:
    app.kubernetes.io/name: tabsdata
    app.kubernetes.io/component: function
    tabsdata.com/instance: ${TD_INSTANCE_NAME}
    tabsdata.com/worker-tier: ephemeral
    tabsdata.com/run-id: ${TD_RUN_ID}
    td-collection: ${TD_COLLECTION}
    td-function: ${TD_FUNCTION}
    td-worker: ${TD_WORKER}
    td-attempt: ${TD_ATTEMPT}
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tabsdata
        app.kubernetes.io/component: function
        tabsdata.com/instance: ${TD_INSTANCE_NAME}
        tabsdata.com/worker-tier: ephemeral
        tabsdata.com/run-id: ${TD_RUN_ID}
        td-collection: ${TD_COLLECTION}
        td-function: ${TD_FUNCTION}
        td-worker: ${TD_WORKER}
        td-attempt: ${TD_ATTEMPT}
    spec:
      serviceAccountName: td-worker
      restartPolicy: Never
      initContainers:
        - name: bootstrap
          image: ${TD_BOOTSTRAP_IMAGE}
          command: ["td-bootstrap"]
          args: ["--worker", "function", "--tier", "ephemeral", "--run-id", "${TD_RUN_ID}"]
          volumeMounts:
            - name: config
              mountPath: /etc/tabsdata/config
            - name: workspace
              mountPath: /tabsdata/workspace
      containers:
        - name: function
          image: ${TD_WORKER_IMAGE}
          command: ["td_function"]
          env:
            - name: TD_PATH_INSTANCE
              value: /tabsdata
            - name: TD_PATH_WORKSPACE
              value: /tabsdata/workspace
            - name: TD_PATH_CONFIG
              value: /tabsdata/workspace/config
            - name: TD_RUN_ID
              value: ${TD_RUN_ID}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: workspace
              mountPath: /tabsdata/workspace
            - name: config
              mountPath: /tabsdata/workspace/config
          resources:
            requests:
              cpu: ${FUNCTION_CPU_REQUEST}
              memory: ${FUNCTION_MEMORY_REQUEST}
            limits:
              cpu: ${FUNCTION_CPU_LIMIT}
              memory: ${FUNCTION_MEMORY_LIMIT}
      volumes:
        - name: config
          configMap:
            name: td-function-config
        - name: workspace
          persistentVolumeClaim:
            claimName: td-${TD_INSTANCE_NAME}-workspace
