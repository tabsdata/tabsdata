apiVersion: apps/v1
kind: Deployment
metadata:
  name: td-apiserver
  namespace: td-${TD_INSTANCE_NAME}
  labels:
    app.kubernetes.io/name: tabsdata
    app.kubernetes.io/component: apiserver
    tabsdata.com/instance: ${TD_INSTANCE_NAME}
    tabsdata.com/tier: regular
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/component: apiserver
      tabsdata.com/instance: ${TD_INSTANCE_NAME}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tabsdata
        app.kubernetes.io/component: apiserver
        tabsdata.com/instance: ${TD_INSTANCE_NAME}
        tabsdata.com/tier: regular
    spec:
      serviceAccountName: td-worker
      restartPolicy: Always
      initContainers:
        - name: bootstrap
          image: ${TD_BOOTSTRAP_IMAGE}
          command: ["td-bootstrap"]
          args: ["--worker", "apiserver", "--tier", "regular"]
          volumeMounts:
            - name: config
              mountPath: /etc/tabsdata/config
            - name: secrets
              mountPath: /etc/tabsdata/secrets
            - name: workspace
              mountPath: /tabsdata/workspace
            - name: repository
              mountPath: /tabsdata/repository
      containers:
        - name: apiserver
          image: ${TD_WORKER_IMAGE}
          command: ["td_apiserver"]
          env:
            - name: TD_PATH_INSTANCE
              value: /tabsdata
            - name: TD_PATH_WORKSPACE
              value: /tabsdata/workspace
            - name: TD_PATH_REPOSITORY
              value: /tabsdata/repository
            - name: TD_PATH_CONFIG
              value: /tabsdata/workspace/config
            - name: TD_URI_REPOSITORY
              value: /tabsdata/repository
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: workspace
              mountPath: /tabsdata/workspace
            - name: repository
              mountPath: /tabsdata/repository
            - name: config
              mountPath: /tabsdata/workspace/config
            - name: secrets
              mountPath: /etc/tabsdata/secrets
          resources:
            requests:
              cpu: ${APISERVER_CPU_REQUEST}
              memory: ${APISERVER_MEMORY_REQUEST}
            limits:
              cpu: ${APISERVER_CPU_LIMIT}
              memory: ${APISERVER_MEMORY_LIMIT}
          livenessProbe:
            httpGet:
              path: /health
              port: ${APISERVER_PORT}
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: ${APISERVER_PORT}
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: td-apiserver-config
        - name: secrets
          secret:
            secretName: td-${TD_INSTANCE_NAME}-secrets
        - name: workspace
          persistentVolumeClaim:
            claimName: td-${TD_INSTANCE_NAME}-workspace
        - name: repository
          persistentVolumeClaim:
            claimName: td-${TD_INSTANCE_NAME}-repository
