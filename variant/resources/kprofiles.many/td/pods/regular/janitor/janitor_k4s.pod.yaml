apiVersion: v1
kind: Pod
metadata:
  name: td-janitor
  namespace: td-${TD_INSTANCE_NAME}
  labels:
    app.kubernetes.io/name: tabsdata
    app.kubernetes.io/component: janitor
    tabsdata.com/instance: ${TD_INSTANCE_NAME}
    tabsdata.com/tier: regular
spec:
  restartPolicy: Always
  containers:
    - name: janitor
      image: ${TD_NPT_BIN}/td_janitor
      command: ["td_janitor"]
      env:
        - name: TD_PATH_INSTANCE
          value: ${TD_PATH_INSTANCE}
        - name: TD_PATH_WORKSPACE
          value: ${TD_PATH_WORKSPACE}
        - name: TD_PATH_CONFIG
          value: ${TD_PATH_CONFIG}
        - name: POD_NAME
          value: td-janitor
        - name: POD_NAMESPACE
          value: td-${TD_INSTANCE_NAME}
