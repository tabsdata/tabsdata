apiVersion: apps/v1
kind: Deployment
metadata:
  name: td-janitor
  namespace: td-${TD_INSTANCE_NAME}
  labels:
    app.kubernetes.io/name: tabsdata
    app.kubernetes.io/component: janitor
    tabsdata.com/instance: ${TD_INSTANCE_NAME}
    tabsdata.com/tier: regular
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/component: janitor
      tabsdata.com/instance: ${TD_INSTANCE_NAME}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tabsdata
        app.kubernetes.io/component: janitor
        tabsdata.com/instance: ${TD_INSTANCE_NAME}
        tabsdata.com/tier: regular
    spec:
      serviceAccountName: td-worker
      restartPolicy: Always
      initContainers:
        - name: bootstrap
          image: ${TD_BOOTSTRAP_IMAGE}
          command: ["td-bootstrap"]
          args: ["--worker", "janitor", "--tier", "regular"]
          volumeMounts:
            - name: config
              mountPath: /etc/tabsdata/config
            - name: workspace
              mountPath: /tabsdata/workspace
      containers:
        - name: janitor
          image: ${TD_WORKER_IMAGE}
          command: ["td_janitor"]
          env:
            - name: TD_PATH_INSTANCE
              value: /tabsdata
            - name: TD_PATH_WORKSPACE
              value: /tabsdata/workspace
            - name: TD_PATH_CONFIG
              value: /tabsdata/workspace/config
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: workspace
              mountPath: /tabsdata/workspace
            - name: config
              mountPath: /tabsdata/workspace/config
          resources:
            requests:
              cpu: ${JANITOR_CPU_REQUEST}
              memory: ${JANITOR_MEMORY_REQUEST}
            limits:
              cpu: ${JANITOR_CPU_LIMIT}
              memory: ${JANITOR_MEMORY_LIMIT}
      volumes:
        - name: config
          configMap:
            name: td-janitor-config
        - name: workspace
          persistentVolumeClaim:
            claimName: td-${TD_INSTANCE_NAME}-workspace
