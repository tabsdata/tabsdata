apiVersion: v1
kind: Pod
metadata:
  name: td-apiserver
  namespace: tabsdata
  annotations:
    tabsdata.com/description: "Tabsdata apiserver worker"
    kubernetes.io/change-cause: ""
  labels:
    app.kubernetes.io/name: tabsdata
    app.kubernetes.io/instance: tabsdata
    app.kubernetes.io/version: "2.0.0"
    app.kubernetes.io/component: apiserver
    app.kubernetes.io/part-of: tabsdata
    app.kubernetes.io/managed-by: tdkserver
    tabsdata.com/worker-tier: regular
spec:
  restartPolicy: Always
  serviceAccountName: default
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 60
  dnsPolicy: ClusterFirst
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
    # runAsUser: 1000     # enable after confirming image's USER and filesystem ownership
    # runAsGroup: 1000    # enable together with runAsUser
    # fsGroup: 1000       # only relevant once Pod has volumes
  containers:
    - name: apiserver
      image: tabsdata/kube/tabsdata:2.0.0
      imagePullPolicy: IfNotPresent
      command: ["td_apiserver"]
      ports:
        - name: http
          containerPort: 2457
          protocol: TCP
      resources:
        requests:
          cpu: "100m"
          memory: "4Gi"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        # readOnlyRootFilesystem: true   # enable after mapping writable paths to emptyDir mounts
      # livenessProbe:
      #   httpGet:
      #     path: /healthz
      #     port: http
      #   initialDelaySeconds: 60
      #   periodSeconds: 10
      #   timeoutSeconds: 3
      #   failureThreshold: 3
      # readinessProbe:
      #   httpGet:
      #     path: /ready
      #     port: http
      #   initialDelaySeconds: 5
      #   periodSeconds: 5
      #   timeoutSeconds: 3
      #   failureThreshold: 3
      # startupProbe:
      #   httpGet:
      #     path: /healthz
      #     port: http
      #   initialDelaySeconds: 0
      #   periodSeconds: 5
      #   timeoutSeconds: 3
      #   failureThreshold: 30
      env:
        - name: POD_ROOT
          value: ""
