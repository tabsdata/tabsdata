instance:
  - path: [ "controllers", "ephemeral", "workers", "name:function" ]
    action: insert_sibling
    position: after
    data:
      name: stagetrigger
      kind: processor
      location: system
      program: td_stagetrigger
      concurrency: 0
      retries: 2
      arguments:
        - work
        - locks-folder
        - logs-folder
        - bin-folder
        - request-folder
        - response-folder
        - input-folder
        - output-folder
        - current-instance
      markers:
        - td-collection
        - td-function
        - td-worker
        - td-attempt
      get-states:
        - state-type: map
          state-key: apiserver-mounts-options
  - path: [ "controllers", "ephemeral", "workers", "name:function" ]
    action: insert_sibling
    position: after
    data:
      name: crontrigger
      kind: processor
      location: system
      program: td_crontrigger
      concurrency: 0
      retries: 2
      arguments:
        - work
        - locks-folder
        - logs-folder
        - bin-folder
        - request-folder
        - response-folder
        - input-folder
        - output-folder
        - current-instance
      markers:
        - td-collection
        - td-function
        - td-worker
        - td-attempt
  - path: [ "controllers", "ephemeral", "concurrency" ]
    action: edit_node
    position: same
    data: 0
  - path: [ "controllers", "init", "workers", "name:bootloader", "program" ]
    action: edit_node
    position: same
    data: td_bootloader
  - path: [ "controllers", "init", "workers", "name:server-information", "program" ]
    action: edit_node
    position: same
    data: td_srvinf
  - path: [ "controllers", "init", "workers", "name:apiserver-configuration-resolver", "program" ]
    action: edit_node
    position: same
    data: td_cfgrsv
  - path: [ "controllers", "init", "workers", "name:apiserver-mounts-options-extractor", "program" ]
    action: edit_node
    position: same
    data: td_mntext
  - path: [ "controllers", "regular", "workers", "name:apiserver", "program" ]
    action: edit_node
    position: same
    data: td_apiserver
  - path: [ "controllers", "regular", "workers", "name:janitor", "program" ]
    action: edit_node
    position: same
    data: td_janitor
  - path: [ "controllers", "ephemeral", "workers", "name:function", "program" ]
    action: edit_node
    position: same
    data: td_function

apiserver:
  - path: [ "database" ]
    action: insert_child
    position: end
    data: { log_level: off }