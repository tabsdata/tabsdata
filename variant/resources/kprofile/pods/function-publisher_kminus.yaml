apiVersion: batch/v1
kind: Job
metadata:
  name: td-function-publisher
  namespace: default
  annotations:
    tabsdata.com/description: "Tabsdata publisher function worker"
    kubernetes.io/change-cause: ""
  labels:
    app.kubernetes.io/name: tabsdata
    app.kubernetes.io/instance: tabsdata
    app.kubernetes.io/version: "2.0.0"
    app.kubernetes.io/component: function-publisher
    app.kubernetes.io/part-of: tabsdata
    app.kubernetes.io/managed-by: tdkserver
    tabsdata.com/tier: ephemeral
    tabsdata.com/decorator: publisher
    tabsdata.com/worker: function
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tabsdata
        app.kubernetes.io/instance: tabsdata
        app.kubernetes.io/version: "2.0.0"
        app.kubernetes.io/component: function-publisher
        app.kubernetes.io/part-of: tabsdata
        app.kubernetes.io/managed-by: tdkserver
        tabsdata.com/tier: ephemeral
        tabsdata.com/decorator: publisher
        tabsdata.com/worker: function
    spec:
      restartPolicy: Never
      nodeName: tdknode
      serviceAccountName: default
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: 0000-inspect-function
          image: function
          imagePullPolicy: IfNotPresent
          command: ["$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}/td_inspect_function"]
          args:
            - --shared-dir
            - $(CONTAINER_ROOT)/tabsdata/shared
            - --work-dir
            - $(CONTAINER_ROOT)/tabsdata/work
            - --log-config
            - $(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.py.yaml
            - --liveness
            - $(CONTAINER_ROOT)/tabsdata/liveness/liveness
            - --responder-url
            - env:SECRET__TD_RESPONDER_URL
            - --responder-method
            - env:SECRET__TD_RESPONDER_METHOD
            - --responder-authorization
            - env:SECRET__TD_RESPONDER_AUTHORIZATION
            - --journal-file
            - $(CONTAINER_ROOT)/tabsdata/shared/journal/journal.yaml
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONTAINER_ROOT
              value: "$(KM_CONTAINER_ROOT)"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_TABSDATA_INSTANCE
              value: "${{system:tdk_instance_name}}"
            - name: TD_LOG_CONFIG
              value: "$(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.rs.yaml"
          volumeMounts:
            - name: config-inspect-function
              mountPath: /tabsdata/config
              readOnly: true
            - name: pyenv
              mountPath: /tabsdata/pyenv
              readOnly: true
            - name: shared
              mountPath: /tabsdata/shared
        - name: 1000-api-ready
          image: function
          imagePullPolicy: IfNotPresent
          command: ["$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}/td_apiready"]
          args:
            - --config-file
            - $(CONTAINER_ROOT)/tabsdata/config/apiserver.service.yaml
            - --log-config
            - $(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.py.yaml
            - --timeout
            - "600"
            - --interval
            - "2"
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
