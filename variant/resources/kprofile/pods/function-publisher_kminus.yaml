apiVersion: batch/v1
kind: Job
metadata:
  name: td-function-publisher
  namespace: ${{system:tdk_namespace_name}}
  annotations:
    tabsdata.com/description: "Tabsdata publisher function worker"
    kubernetes.io/change-cause: ""
  labels:
    app.kubernetes.io/name: tabsdata
    app.kubernetes.io/instance: tabsdata
    app.kubernetes.io/version: "${{system:tdk_tabsdata_version}}"
    app.kubernetes.io/component: function-publisher
    app.kubernetes.io/part-of: tabsdata
    app.kubernetes.io/managed-by: tdkserver
    tabsdata.com/tier: ephemeral
    tabsdata.com/decorator: publisher
    tabsdata.com/worker: function
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tabsdata
        app.kubernetes.io/instance: tabsdata
        app.kubernetes.io/version: "${{system:tdk_tabsdata_version}}"
        app.kubernetes.io/component: function-publisher
        app.kubernetes.io/part-of: tabsdata
        app.kubernetes.io/managed-by: tdkserver
        tabsdata.com/tier: ephemeral
        tabsdata.com/decorator: publisher
        tabsdata.com/worker: function
    spec:
      restartPolicy: Never
      nodeName: tdknode
      serviceAccountName: default
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      dnsPolicy: ClusterFirst
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: 0000-inspect-function
          image: function
          imagePullPolicy: IfNotPresent
          command: ["$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}/td-inspect-function${{system:tdk_exe_suffix}}"]
          args:
            - --shared-folder
            - $(CONTAINER_ROOT)/tabsdata/shared
            - --work-folder
            - $(CONTAINER_ROOT)/tabsdata/work
            - --logging-configuration
            - $(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.py.yaml
            - --liveness
            - $(CONTAINER_ROOT)/tabsdata/liveness/liveness
            - --responder-url
            - env:SECRET__TD_RESPONDER_URL
            - --responder-method
            - env:SECRET__TD_RESPONDER_METHOD
            - --responder-authorization
            - env:SECRET__TD_RESPONDER_AUTHORIZATION
            - --journal-file
            - $(CONTAINER_ROOT)/tabsdata/shared/journal/journal.yaml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONTAINER_ROOT
              value: "$(KM_CONTAINER_ROOT)"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_TABSDATA_INSTANCE
              value: "${{system:tdk_instance_name}}"
            - name: TD_LOG_CONFIG
              value: "$(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.rs.yaml"
            - name: TD_BEFORE_PATH
              value: "$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}"
            - name: TD_AFTER_PATH
              value: ""
          volumeMounts:
            - name: config-inspect-function
              mountPath: /tabsdata/config
              readOnly: true
            - name: dataflow
              mountPath: /tabsdata/dataflow
            - name: pyenv
              mountPath: /tabsdata/pyenv
              readOnly: true
            - name: shared
              mountPath: /tabsdata/shared
        - name: 0010-apiready
          image: function
          imagePullPolicy: IfNotPresent
          command: ["$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}/td_apiready${{system:tdk_exe_suffix}}"]
          args:
            - --config-file
            - $(CONTAINER_ROOT)/tabsdata/config/apiserver.service.yaml
            - --log-config
            - $(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.py.yaml
            - --timeout
            - "600"
            - --interval
            - "2"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONTAINER_ROOT
              value: "$(KM_CONTAINER_ROOT)"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_TABSDATA_INSTANCE
              value: "${{system:tdk_instance_name}}"
            - name: TD_BEFORE_PATH
              value: "$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}"
            - name: TD_AFTER_PATH
              value: ""
          volumeMounts:
            - name: config-apiready
              mountPath: /tabsdata/config
              readOnly: true
            - name: dataflow
              mountPath: /tabsdata/dataflow
            - name: pyenv
              mountPath: /tabsdata/pyenv
              readOnly: true
        - name: 0020-begin-execution
          image: function
          imagePullPolicy: IfNotPresent
          command: ["$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}/td-begin-execution${{system:tdk_exe_suffix}}"]
          args:
            - --shared-folder
            - $(CONTAINER_ROOT)/tabsdata/shared
            - --work-folder
            - $(CONTAINER_ROOT)/tabsdata/work
            - --logging-configuration
            - $(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.py.yaml
            - --liveness
            - $(CONTAINER_ROOT)/tabsdata/liveness/liveness
            - --responder-url
            - env:SECRET__TD_RESPONDER_URL
            - --responder-method
            - env:SECRET__TD_RESPONDER_METHOD
            - --responder-authorization
            - env:SECRET__TD_RESPONDER_AUTHORIZATION
            - --journal-file
            - $(CONTAINER_ROOT)/tabsdata/shared/journal/journal.yaml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONTAINER_ROOT
              value: "$(KM_CONTAINER_ROOT)"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_TABSDATA_INSTANCE
              value: "${{system:tdk_instance_name}}"
            - name: TD_LOG_CONFIG
              value: "$(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.rs.yaml"
            - name: TD_BEFORE_PATH
              value: "$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}"
            - name: TD_AFTER_PATH
              value: ""
          volumeMounts:
            - name: config-begin-execution
              mountPath: /tabsdata/config
              readOnly: true
            - name: dataflow
              mountPath: /tabsdata/dataflow
            - name: pyenv
              mountPath: /tabsdata/pyenv
              readOnly: true
            - name: shared
              mountPath: /tabsdata/shared
        - name: 0030-fetch-request
          image: function
          imagePullPolicy: IfNotPresent
          command: ["$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}/td-fetch-request${{system:tdk_exe_suffix}}"]
          args:
            - --shared-folder
            - $(CONTAINER_ROOT)/tabsdata/shared
            - --work-folder
            - $(CONTAINER_ROOT)/tabsdata/work
            - --logging-configuration
            - $(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.py.yaml
            - --liveness
            - $(CONTAINER_ROOT)/tabsdata/liveness/liveness
            - --responder-url
            - env:SECRET__TD_RESPONDER_URL
            - --responder-method
            - env:SECRET__TD_RESPONDER_METHOD
            - --responder-authorization
            - env:SECRET__TD_RESPONDER_AUTHORIZATION
            - --journal-file
            - $(CONTAINER_ROOT)/tabsdata/shared/journal/journal.yaml
            - --resolver-url
            - env:SECRET__TD_RESOLVER_URL
            - --resolver-method
            - env:SECRET__TD_RESOLVER_METHOD
            - --resolver-authorization
            - env:SECRET__TD_RESOLVER_AUTHORIZATION
            - --request-file
            - $(CONTAINER_ROOT)/tabsdata/shared/request/request.yaml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONTAINER_ROOT
              value: "$(KM_CONTAINER_ROOT)"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_TABSDATA_INSTANCE
              value: "${{system:tdk_instance_name}}"
            - name: TD_LOG_CONFIG
              value: "$(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.rs.yaml"
            - name: TD_BEFORE_PATH
              value: "$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}"
            - name: TD_AFTER_PATH
              value: ""
          volumeMounts:
            - name: config-fetch-request
              mountPath: /tabsdata/config
              readOnly: true
            - name: dataflow
              mountPath: /tabsdata/dataflow
            - name: pyenv
              mountPath: /tabsdata/pyenv
              readOnly: true
            - name: shared
              mountPath: /tabsdata/shared
        - name: 0040-fetch-bundle
          image: function
          imagePullPolicy: IfNotPresent
          command: ["$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}/td-fetch-bundle${{system:tdk_exe_suffix}}"]
          args:
            - --shared-folder
            - $(CONTAINER_ROOT)/tabsdata/shared
            - --work-folder
            - $(CONTAINER_ROOT)/tabsdata/work
            - --logging-configuration
            - $(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.py.yaml
            - --liveness
            - $(CONTAINER_ROOT)/tabsdata/liveness/liveness
            - --responder-url
            - env:SECRET__TD_RESPONDER_URL
            - --responder-method
            - env:SECRET__TD_RESPONDER_METHOD
            - --responder-authorization
            - env:SECRET__TD_RESPONDER_AUTHORIZATION
            - --journal-file
            - $(CONTAINER_ROOT)/tabsdata/shared/journal/journal.yaml
            - --request
            - $(CONTAINER_ROOT)/tabsdata/shared/request/request.yaml
            - --bundle-folder
            - $(CONTAINER_ROOT)/tabsdata/shared/bundle/folder
            - --bundle-archive
            - $(CONTAINER_ROOT)/tabsdata/shared/bundle/archive/bundle.tar.zst
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONTAINER_ROOT
              value: "$(KM_CONTAINER_ROOT)"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_TABSDATA_INSTANCE
              value: "${{system:tdk_instance_name}}"
            - name: TD_LOG_CONFIG
              value: "$(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.rs.yaml"
            - name: TD_BEFORE_PATH
              value: "$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}"
            - name: TD_AFTER_PATH
              value: ""
          envFrom:
            - secretRef:
                name: td-app-apiserver-secret-config-apiserver.storage.yaml
              prefix: SECRETS__
          volumeMounts:
            - name: config-fetch-bundle
              mountPath: /tabsdata/config
              readOnly: true
            - name: dataflow
              mountPath: /tabsdata/dataflow
            - name: pyenv
              mountPath: /tabsdata/pyenv
              readOnly: true
            - name: shared
              mountPath: /tabsdata/shared
        - name: 0050-plan-input
          image: function
          imagePullPolicy: IfNotPresent
          command: ["$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}/td-plan-input${{system:tdk_exe_suffix}}"]
          args:
            - --shared-folder
            - $(CONTAINER_ROOT)/tabsdata/shared
            - --work-folder
            - $(CONTAINER_ROOT)/tabsdata/work
            - --logging-configuration
            - $(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.py.yaml
            - --liveness
            - $(CONTAINER_ROOT)/tabsdata/liveness/liveness
            - --responder-url
            - env:SECRET__TD_RESPONDER_URL
            - --responder-method
            - env:SECRET__TD_RESPONDER_METHOD
            - --responder-authorization
            - env:SECRET__TD_RESPONDER_AUTHORIZATION
            - --journal-file
            - $(CONTAINER_ROOT)/tabsdata/shared/journal/journal.yaml
            - --request
            - $(CONTAINER_ROOT)/tabsdata/shared/request/request.yaml
            - --inputs-manifest
            - $(CONTAINER_ROOT)/tabsdata/shared/fn/in/inputs-manifest.yaml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONTAINER_ROOT
              value: "$(KM_CONTAINER_ROOT)"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_TABSDATA_INSTANCE
              value: "${{system:tdk_instance_name}}"
            - name: TD_LOG_CONFIG
              value: "$(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.rs.yaml"
            - name: TD_BEFORE_PATH
              value: "$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}"
            - name: TD_AFTER_PATH
              value: ""
          volumeMounts:
            - name: config-plan-input
              mountPath: /tabsdata/config
              readOnly: true
            - name: dataflow
              mountPath: /tabsdata/dataflow
            - name: pyenv
              mountPath: /tabsdata/pyenv
              readOnly: true
            - name: shared
              mountPath: /tabsdata/shared
        - name: 0060-source-plugin
          image: function
          imagePullPolicy: IfNotPresent
          command: ["$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}/td-p-src-regular${{system:tdk_exe_suffix}}"]
          args:
            - --shared-folder
            - $(CONTAINER_ROOT)/tabsdata/shared
            - --work-folder
            - $(CONTAINER_ROOT)/tabsdata/work
            - --connection-file
            - $(CONTAINER_ROOT)/tabsdata/connection/connection.yaml
            - --logging-configuration
            - $(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.py.yaml
            - --liveness
            - $(CONTAINER_ROOT)/tabsdata/liveness/liveness
            - --responder-url
            - env:SECRET__TD_RESPONDER_URL
            - --responder-method
            - env:SECRET__TD_RESPONDER_METHOD
            - --responder-authorization
            - env:SECRET__TD_RESPONDER_AUTHORIZATION
            - --journal-file
            - $(CONTAINER_ROOT)/tabsdata/shared/journal/journal.yaml
            - --request
            - $(CONTAINER_ROOT)/tabsdata/shared/request/request.yaml
            - --bundle-folder
            - $(CONTAINER_ROOT)/tabsdata/shared/bundle/folder
            - --context-folder
            - $(CONTAINER_ROOT)/tabsdata/shared/in
            - --inputs-manifest
            - $(CONTAINER_ROOT)/tabsdata/shared/fn/in/inputs-manifest.yaml
            - --state-folder
            - $(CONTAINER_ROOT)/tabsdata/shared/state
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONTAINER_ROOT
              value: "$(KM_CONTAINER_ROOT)"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_TABSDATA_INSTANCE
              value: "${{system:tdk_instance_name}}"
            - name: TD_LOG_CONFIG
              value: "$(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.rs.yaml"
            - name: TD_BEFORE_PATH
              value: "$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}"
            - name: TD_AFTER_PATH
              value: ""
          envFrom:
            - secretRef:
                name: ${{system:tdk_connection_secret_name}}
            - secretRef:
                name: td-app-apiserver-secret-config-apiserver.storage.yaml
              prefix: SECRETS__
          volumeMounts:
            - name: config-source-plugin
              mountPath: /tabsdata/config
              readOnly: true
            - name: connection
              mountPath: /tabsdata/connection
              readOnly: true
            - name: dataflow
              mountPath: /tabsdata/dataflow
            - name: pyenv
              mountPath: /tabsdata/pyenv
              readOnly: true
            - name: shared
              mountPath: /tabsdata/shared
        - name: 0070-function
          image: function
          imagePullPolicy: IfNotPresent
          command: ["$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}/td-f-regular${{system:tdk_exe_suffix}}"]
          args:
            - --shared-folder
            - $(CONTAINER_ROOT)/tabsdata/shared
            - --work-folder
            - $(CONTAINER_ROOT)/tabsdata/work
            - --logging-configuration
            - $(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.py.yaml
            - --liveness
            - $(CONTAINER_ROOT)/tabsdata/liveness/liveness
            - --responder-url
            - env:SECRET__TD_RESPONDER_URL
            - --responder-method
            - env:SECRET__TD_RESPONDER_METHOD
            - --responder-authorization
            - env:SECRET__TD_RESPONDER_AUTHORIZATION
            - --journal-file
            - $(CONTAINER_ROOT)/tabsdata/shared/journal/journal.yaml
            - --request
            - $(CONTAINER_ROOT)/tabsdata/shared/request/request.yaml
            - --bundle-folder
            - $(CONTAINER_ROOT)/tabsdata/shared/bundle/folder
            - --inputs-manifest
            - $(CONTAINER_ROOT)/tabsdata/shared/fn/in/inputs-manifest.yaml
            - --context-folder
            - $(CONTAINER_ROOT)/tabsdata/shared/context
            - --outputs-manifest
            - $(CONTAINER_ROOT)/tabsdata/shared/fn/out/outputs-manifest.yaml
            - --state-folder
            - $(CONTAINER_ROOT)/tabsdata/shared/state
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONTAINER_ROOT
              value: "$(KM_CONTAINER_ROOT)"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_TABSDATA_INSTANCE
              value: "${{system:tdk_instance_name}}"
            - name: TD_LOG_CONFIG
              value: "$(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.rs.yaml"
            - name: TD_BEFORE_PATH
              value: "$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}"
            - name: TD_AFTER_PATH
              value: ""
          envFrom:
            - secretRef:
                name: ${{system:tdk_project_secret_name}}
              prefix: SECRET_PRJ__
            - secretRef:
                name: td-app-apiserver-secret-config-apiserver.storage.yaml
