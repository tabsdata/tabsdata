            - name: TD_BEFORE_PATH
              value: "$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}"
            - name: TD_AFTER_PATH
              value: ""
          volumeMounts:
            - name: config-fetch-request
              mountPath: /tabsdata/config
              readOnly: true
            - name: pyenv
              mountPath: /tabsdata/pyenv
              readOnly: true
            - name: shared
              mountPath: /tabsdata/shared
        - name: 0040-localize-fn-bundle
          image: function
          imagePullPolicy: IfNotPresent
          command: ["$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}/td_localize_fn_bundle${{system:tdk_exe_suffix}}"]
          args:
