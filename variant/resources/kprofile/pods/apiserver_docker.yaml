apiVersion: v1
kind: Pod
metadata:
  name: td-apiserver
  namespace: ${{system:tdk_namespace_name}}
  annotations:
    tabsdata.com/description: "Tabsdata apiserver worker"
    kubernetes.io/change-cause: ""
  labels:
    app.kubernetes.io/name: tabsdata
    app.kubernetes.io/instance: tabsdata
    app.kubernetes.io/version: "2.0.0"
    app.kubernetes.io/component: apiserver
    app.kubernetes.io/part-of: tabsdata
    app.kubernetes.io/managed-by: tdkserver
    tabsdata.com/tier: regular
spec:
  restartPolicy: Always
  serviceAccountName: default
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 60
  dnsPolicy: ClusterFirst
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
    # Pending decision: not yet enabled.
    # Run the container under a fixed user and group by setting runAsUser and
    # runAsGroup, only after confirming the image's own user and filesystem
    # ownership; set runAsGroup together with runAsUser. fsGroup is only
    # relevant once the pod has volumes.
    # runAsUser: 1000
    # runAsGroup: 1000
    # fsGroup: 1000
  initContainers:
    - name: dbready
      image: tabsdata/kube/tabsdata:2.0.0
      imagePullPolicy: IfNotPresent
      command: ["$(CONTAINER_ROOT)/tabsdata/pyenv/bin/td_dbready"]
      args:
        - --config-file
        - /tabsdata/config/apiserver.database.yaml
        - --log-config-py
        - /tabsdata/config/tabsdata.log.py.yaml
        - --log-config-rs
        - /tabsdata/config/apiserver.log.yaml
        - --timeout
        - "600"
        - --interval
        - "2"
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      env:
        - name: CONTAINER_ROOT
          value: ""
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_TABSDATA_INSTANCE
          value: "${{system:tdk_instance_name}}"
      volumeMounts:
        - name: config
          mountPath: /tabsdata/config
          readOnly: true
    - name: connresextractor
      image: tabsdata/kube/tabsdata:2.0.0
      imagePullPolicy: IfNotPresent
      command: ["$(CONTAINER_ROOT)/tabsdata/pyenv/bin/td_conn_resources_extractor"]
      args:
        - --output-dir
        - /tabsdata/resources/ui/connectors
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      env:
        - name: CONTAINER_ROOT
          value: ""
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_TABSDATA_INSTANCE
          value: "${{system:tdk_instance_name}}"
      volumeMounts:
        - name: resources
          mountPath: /tabsdata/resources
  containers:
    - name: apiserver
      image: tabsdata/kube/tabsdata:2.0.0
      imagePullPolicy: IfNotPresent
      command: ["$(CONTAINER_ROOT)/tabsdata/pyenv/bin/td_apiserver"]
      args:
        - --config-file
        - /tabsdata/config/apiserver.service.yaml
        - --config-file
        - /tabsdata/config/apiserver.database.yaml
        - --config-file
        - /tabsdata/config/apiserver.storage.yaml
        - --log-config
        - /tabsdata/config/apiserver.log.yaml
        - --resources-folder
        - /tabsdata/resources
      ports:
        - name: public-http
          containerPort: 2457
          protocol: TCP
        - name: private-http
          containerPort: 2458
          protocol: TCP
      resources:
        requests:
          cpu: "100m"
          memory: "4Gi"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        # Pending decision: not yet enabled.
        # Mount the root filesystem read-only, only after mapping every writable
        # path to an emptyDir mount.
        # readOnlyRootFilesystem: true
      volumeMounts:
        - name: config
          mountPath: /tabsdata/config
          readOnly: true
        - name: settings
          mountPath: /tabsdata/settings
          readOnly: true
        - name: resources
          mountPath: /tabsdata/resources
          readOnly: true
      # Pending decision: not yet enabled.
      # Define liveness, readiness, and startup probes to let the orchestrator
      # restart the container when it stops responding, hold traffic until it
      # is ready, and allow extra time during a slow startup.
      # livenessProbe:
      #   httpGet:
      #     path: /healthz
      #     port: http
      #   initialDelaySeconds: 60
      #   periodSeconds: 10
      #   timeoutSeconds: 3
      #   failureThreshold: 3
      # readinessProbe:
      #   httpGet:
      #     path: /ready
      #     port: http
      #   initialDelaySeconds: 5
      #   periodSeconds: 5
      #   timeoutSeconds: 3
      #   failureThreshold: 3
      # startupProbe:
      #   httpGet:
      #     path: /healthz
      #     port: http
      #   initialDelaySeconds: 0
      #   periodSeconds: 5
      #   timeoutSeconds: 3
      #   failureThreshold: 30
      env:
        - name: CONTAINER_ROOT
          value: ""
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_SERVICE_ACCOUNT
          valueFrom:
            fieldRef:
              fieldPath: spec.serviceAccountName
        - name: POD_TABSDATA_INSTANCE
          value: "${{system:tdk_instance_name}}"
  volumes:
    - name: config
      projected:
        sources:
          - configMap:
              name: td-app-apiserver-config-apiserver.service.yaml
          - configMap:
              name: td-app-apiserver-config-apiserver.database.yaml
          - configMap:
              name: td-app-apiserver-config-apiserver.storage.yaml
          - configMap:
              name: td-app-apiserver-config-apiserver.log.yaml
          - configMap:
              name: td-app-tabsdata-config-tabsdata.log.py.yaml
          - configMap:
              name: td-app-tabsdata-config-tabsdata.yaml
    - name: settings
      configMap:
        name: td-sys-tabsdata-settings-settings.json
    - name: resources
      emptyDir: {}
