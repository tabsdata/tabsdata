apiVersion: batch/v1
kind: Job
metadata:
  name: ins-dbmanager
  namespace: ${{system:tdk_namespace_name}}
  annotations:
    tabsdata.com/description: "Tabsdata dbmanager"
    kubernetes.io/change-cause: ""
  labels:
    app.kubernetes.io/name: tabsdata
    app.kubernetes.io/instance: tabsdata
    app.kubernetes.io/version: "2.0.0"
    app.kubernetes.io/component: dbmanager
    app.kubernetes.io/part-of: tabsdata
    app.kubernetes.io/managed-by: tdkserver
    tabsdata.com/tier: setup
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tabsdata
        app.kubernetes.io/instance: tabsdata
        app.kubernetes.io/component: dbmanager
        app.kubernetes.io/part-of: tabsdata
        app.kubernetes.io/managed-by: tdkserver
    spec:
      restartPolicy: Never
      nodeName: tdknode
      serviceAccountName: default
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      dnsPolicy: ClusterFirst
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: 1000-dbcreate
        image: /dev/null
        imagePullPolicy: IfNotPresent
        command: ["$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}/td_dbmanager${{system:tdk_exe_suffix}}"]
        args:
        - db
        - create
        - --config-file
        - $(CONTAINER_ROOT)/tabsdata/config/apiserver.database.yaml
        - --config-file
        - $(CONTAINER_ROOT)/tabsdata/config/dbmanager.database.yaml
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
            ephemeral-storage: "4Gi"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        env:
        - name: CONTAINER_ROOT
          value: "$(KM_CONTAINER_ROOT)"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_TABSDATA_INSTANCE
          value: "${{system:tdk_instance_name}}"
        - name: TD_LOG_CONFIG
          value: "$(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.rs.yaml"
        - name: TD_BEFORE_PATH
          value: "$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}"
        - name: TD_AFTER_PATH
          value: ""
        volumeMounts:
        - name: config
          mountPath: /tabsdata/config
          readOnly: true
        - name: pyenv
          mountPath: /tabsdata/pyenv
          readOnly: true
      volumes:
      - name: config
        projected:
          sources:
          - configMap:
              name: td-app-apiserver-config-apiserver.database.yaml
          - configMap:
              name: td-app-dbmanager-config-dbmanager.database.yaml
          - configMap:
              name: td-app-tabsdata-config-tabsdata.log.rs.yaml
      - name: pyenv
        hostPath:
          path: "${{system:tdk_pyenv_td_root}}"
