            - name: work
              mountPath: /tabsdata/work
        - name: 0070-prep-localize-state
          image: ubuntu:24.04
          imagePullPolicy: IfNotPresent
          command: ["${{system:tdk_pyenv_fn_root}}/bin/td_prep_localize_state"]
          args:
