apiVersion: batch/v1
kind: Job
metadata:
  name: td-function-transformer
  namespace: ${{system:tdk_namespace_name}}
  annotations:
    tabsdata.com/description: "Tabsdata transformer function worker"
    kubernetes.io/change-cause: ""
  labels:
    app.kubernetes.io/name: tabsdata
    app.kubernetes.io/instance: tabsdata
    app.kubernetes.io/version: "${{system:tdk_tabsdata_version}}"
    app.kubernetes.io/component: function-transformer
    app.kubernetes.io/part-of: tabsdata
    app.kubernetes.io/managed-by: tdkserver
    tabsdata.com/tier: ephemeral
    tabsdata.com/decorator: transformer
    tabsdata.com/worker: function
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tabsdata
        app.kubernetes.io/instance: tabsdata
        app.kubernetes.io/version: "${{system:tdk_tabsdata_version}}"
        app.kubernetes.io/component: function-transformer
        app.kubernetes.io/part-of: tabsdata
        app.kubernetes.io/managed-by: tdkserver
        tabsdata.com/tier: ephemeral
        tabsdata.com/decorator: transformer
        tabsdata.com/worker: function
    spec:
      restartPolicy: Never
      serviceAccountName: default
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      dnsPolicy: ClusterFirst
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: 0000-cabundle
          image: curlimages/curl:8.11.1
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
          - |
            set -eu
            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
               --output /tabsdata/certs/ca-public.pem https://curl.se/ca/cacert.pem
            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
               --output /tabsdata/certs/ca.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
          - name: certs
            mountPath: /tabsdata/certs
        - name: 0010-venvloader
          image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
          imagePullPolicy: IfNotPresent
          command: ["bash"]
          args:
            - $(CONTAINER_ROOT)/tabsdata/assets/venvloader.sh
            - --output
            - ${{system:tdk_runtimes_root}}
            - --venv
            - fn
            - --storage-config
            - $(CONTAINER_ROOT)/tabsdata/config-storage/apiserver.storage.yaml
          env:
            - name: CONTAINER_ROOT
              value: ""
          envFrom:
            - secretRef:
                name: td-app-apiserver-secret-config-apiserver.storage.yaml
              prefix: SECRETS__
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: assets
              mountPath: /tabsdata/assets
              readOnly: true
            - name: config-storage
              mountPath: /tabsdata/config-storage
              readOnly: true
            - name: runtimes
              mountPath: /tabsdata/runtimes
            - name: storage
              mountPath: /tabsdata/repository/storage
        - name: 0020-inspect-function
          image: ubuntu:24.04
          imagePullPolicy: IfNotPresent
          command: ["${{system:tdk_pyenv_fn_root}}/bin/td_inspect_function"]
          args:
            - --shared-dir
            - $(CONTAINER_ROOT)/tabsdata/shared
            - --work-dir
            - $(CONTAINER_ROOT)/tabsdata/work
            - --log-config
            - $(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.py.yaml
            - --liveness
            - $(CONTAINER_ROOT)/tabsdata/liveness/liveness
            - --responder-url
            - env:SECRET__TD_RESPONDER_URL
            - --responder-method
            - env:SECRET__TD_RESPONDER_METHOD
            - --responder-authorization
            - env:SECRET__TD_RESPONDER_AUTHORIZATION
            - --journal-file
            - $(CONTAINER_ROOT)/tabsdata/shared/journal/journal.yaml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONTAINER_ROOT
              value: ""
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_TABSDATA_INSTANCE
              value: "${{system:tdk_instance_name}}"
            - name: TD_LOG_CONFIG
              value: "$(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.rs.yaml"
            - name: SSL_CERT_FILE
              value: "/tabsdata/certs/ca-public.pem"
            - name: TD_BEFORE_PATH
              value: "${{system:tdk_pyenv_fn_root}}/${{system:tdk_pyenv_scripts_folder}}"
            - name: TD_AFTER_PATH
              value: ""
          volumeMounts:
            - name: certs
              mountPath: /tabsdata/certs
              readOnly: true
            - name: config-inspect-function
              mountPath: /tabsdata/config
              readOnly: true
            - name: liveness
              mountPath: /tabsdata/liveness
            - name: runtimes
              mountPath: /tabsdata/runtimes
              readOnly: true
            - name: shared
              mountPath: /tabsdata/shared
            - name: work
              mountPath: /tabsdata/work
        - name: 0030-apiready
          image: ubuntu:24.04
          imagePullPolicy: IfNotPresent
          command: ["${{system:tdk_pyenv_fn_root}}/bin/td_apiready"]
          args:
            - --config-file
            - $(CONTAINER_ROOT)/tabsdata/config/apiserver.service.yaml
            - --host
            - net-apiserver.${{system:tdk_namespace_name}}.svc.cluster.local
            - --log-config
            - $(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.py.yaml
            - --timeout
            - "600"
            - --interval
            - "2"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONTAINER_ROOT
              value: ""
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_TABSDATA_INSTANCE
              value: "${{system:tdk_instance_name}}"
            - name: SSL_CERT_FILE
              value: "/tabsdata/certs/ca-public.pem"
            - name: TD_BEFORE_PATH
              value: "${{system:tdk_pyenv_fn_root}}/${{system:tdk_pyenv_scripts_folder}}"
            - name: TD_AFTER_PATH
              value: ""
          volumeMounts:
            - name: certs
              mountPath: /tabsdata/certs
              readOnly: true
            - name: config-apiready
              mountPath: /tabsdata/config
              readOnly: true
            - name: runtimes
              mountPath: /tabsdata/runtimes
              readOnly: true
        - name: 0040-begin-execution
          image: ubuntu:24.04
          imagePullPolicy: IfNotPresent
          command: ["${{system:tdk_pyenv_fn_root}}/bin/td_begin_execution"]
          args:
            - --shared-dir
            - $(CONTAINER_ROOT)/tabsdata/shared
            - --work-dir
            - $(CONTAINER_ROOT)/tabsdata/work
            - --log-config
            - $(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.py.yaml
            - --liveness
            - $(CONTAINER_ROOT)/tabsdata/liveness/liveness
            - --responder-url
            - env:SECRET__TD_RESPONDER_URL
            - --responder-method
            - env:SECRET__TD_RESPONDER_METHOD
            - --responder-authorization
            - env:SECRET__TD_RESPONDER_AUTHORIZATION
            - --journal-file
            - $(CONTAINER_ROOT)/tabsdata/shared/journal/journal.yaml
          securityContext:
            allowPrivilegeEscalation: false
