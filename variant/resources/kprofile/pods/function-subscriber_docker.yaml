              prefix: SECRETS__
          volumeMounts:
            - name: config-localize-fn-bundle
              mountPath: /tabsdata/config
              readOnly: true
            - name: runtimes
              mountPath: ${{system:tdk_runtimes_root}}
              readOnly: true
            - name: shared
              mountPath: /tabsdata/shared
        - name: 2030-prep-localize-state
          image: ubuntu:24.04
          imagePullPolicy: IfNotPresent
          command: ["${{system:tdk_pyenv_td_root}}/bin/td_prep_localize_state"]
          args:
            - --shared-dir
            - $(CONTAINER_ROOT)/tabsdata/shared
            - --work-dir
            - $(CONTAINER_ROOT)/tabsdata/work
            - --log-config
            - $(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.py.yaml
            - --liveness
            - $(CONTAINER_ROOT)/tabsdata/liveness/liveness
            - --responder-url
            - env:SECRET__TD_RESPONDER_URL
            - --responder-method
            - env:SECRET__TD_RESPONDER_METHOD
            - --responder-authorization
            - env:SECRET__TD_RESPONDER_AUTHORIZATION
            - --journal-file
            - $(CONTAINER_ROOT)/tabsdata/shared/journal/journal.yaml
            - --request
            - $(CONTAINER_ROOT)/tabsdata/shared/request/request.yaml
            - --in-dir
            - $(CONTAINER_ROOT)/tabsdata/shared/in
            - --state-dir
            - $(CONTAINER_ROOT)/tabsdata/shared/state
            - --out
            - $(CONTAINER_ROOT)/tabsdata/shared/shuttle/request/state-download.yaml
            - --inputs-manifest
            - $(CONTAINER_ROOT)/tabsdata/shared/fn/in/inputs-manifest.yaml
            - --state-manifest
            - $(CONTAINER_ROOT)/tabsdata/shared/fn/in/state-manifest.yaml
            - --storage-config
            - $(CONTAINER_ROOT)/tabsdata/config/apiserver.storage.yaml
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
              ephemeral-storage: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONTAINER_ROOT
              value: ""
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_TABSDATA_INSTANCE
              value: "${{system:tdk_instance_name}}"
            - name: TD_LOG_CONFIG
              value: "$(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.rs.yaml"
          volumeMounts:
            - name: config-prep-localize-state
              mountPath: /tabsdata/config
              readOnly: true
            - name: runtimes
              mountPath: ${{system:tdk_runtimes_root}}
              readOnly: true
            - name: shared
              mountPath: /tabsdata/shared
        - name: 2040-run-transporter-localize
          image: ubuntu:24.04
          imagePullPolicy: IfNotPresent
          command: ["${{system:tdk_pyenv_td_root}}/bin/td_run_transporter"]
          args:
            - --shared-dir
            - $(CONTAINER_ROOT)/tabsdata/shared
            - --work-dir
            - $(CONTAINER_ROOT)/tabsdata/work
            - --log-config
            - $(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.py.yaml
            - --liveness
            - $(CONTAINER_ROOT)/tabsdata/liveness/liveness
            - --responder-url
            - env:SECRET__TD_RESPONDER_URL
            - --responder-method
            - env:SECRET__TD_RESPONDER_METHOD
            - --responder-authorization
            - env:SECRET__TD_RESPONDER_AUTHORIZATION
            - --journal-file
            - $(CONTAINER_ROOT)/tabsdata/shared/journal/journal.yaml
            - --request
            - $(CONTAINER_ROOT)/tabsdata/shared/shuttle/request/state-download.yaml
            - --report
            - $(CONTAINER_ROOT)/tabsdata/shared/shuttle/response/state-download.yaml
