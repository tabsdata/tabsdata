apiVersion: batch/v1
kind: Job
metadata:
  name: td-function-subscriber
  namespace: ${{system:tdk_namespace_name}}
  annotations:
    tabsdata.com/description: "Tabsdata subscriber function worker"
    kubernetes.io/change-cause: ""
  labels:
    app.kubernetes.io/name: tabsdata
    app.kubernetes.io/instance: tabsdata
    app.kubernetes.io/version: "2.0.0"
    app.kubernetes.io/component: function-subscriber
    app.kubernetes.io/part-of: tabsdata
    app.kubernetes.io/managed-by: tdkserver
    tabsdata.com/tier: ephemeral
    tabsdata.com/decorator: subscriber
    tabsdata.com/worker: function
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tabsdata
        app.kubernetes.io/instance: tabsdata
        app.kubernetes.io/version: "2.0.0"
        app.kubernetes.io/component: function-subscriber
        app.kubernetes.io/part-of: tabsdata
        app.kubernetes.io/managed-by: tdkserver
        tabsdata.com/tier: ephemeral
        tabsdata.com/decorator: subscriber
        tabsdata.com/worker: function
    spec:
      restartPolicy: Never
      serviceAccountName: default
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      dnsPolicy: ClusterFirst
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: venvloader
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["bash"]
          args:
            - $(CONTAINER_ROOT)/tabsdata/assets/venvloader.sh
            - --output
            - ${{system:tdk_runtimes_root}}
            - --storage-config
            - $(CONTAINER_ROOT)/tabsdata/config-storage/apiserver.storage.yaml
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "4Gi"
          env:
            - name: CONTAINER_ROOT
              value: ""
          envFrom:
            - secretRef:
                name: td-app-apiserver-secret-config-apiserver.storage.yaml
              prefix: SECRETS__
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: assets
              mountPath: /tabsdata/assets
              readOnly: true
            - name: config-storage
              mountPath: /tabsdata/config-storage
              readOnly: true
            - name: runtimes
              mountPath: ${{system:tdk_runtimes_root}}
        - name: 0000-inspect-function
          image: ubuntu:24.04
          imagePullPolicy: IfNotPresent
          command: ["${{system:tdk_pyenv_td_root}}/bin/td_inspect_function"]
          args:
            - --shared-dir
            - $(CONTAINER_ROOT)/tabsdata/shared
            - --work-dir
            - $(CONTAINER_ROOT)/tabsdata/work
            - --log-config
            - $(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.py.yaml
            - --liveness
            - $(CONTAINER_ROOT)/tabsdata/liveness/liveness
            - --responder-url
            - env:SECRET__TD_RESPONDER_URL
            - --responder-method
            - env:SECRET__TD_RESPONDER_METHOD
            - --responder-authorization
            - env:SECRET__TD_RESPONDER_AUTHORIZATION
            - --journal-file
            - $(CONTAINER_ROOT)/tabsdata/shared/journal/journal.yaml
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
              ephemeral-storage: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONTAINER_ROOT
              value: ""
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_TABSDATA_INSTANCE
              value: "${{system:tdk_instance_name}}"
            - name: TD_LOG_CONFIG
              value: "$(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.rs.yaml"
          volumeMounts:
            - name: config-inspect-function
              mountPath: /tabsdata/config
              readOnly: true
            - name: runtimes
              mountPath: ${{system:tdk_runtimes_root}}
              readOnly: true
            - name: shared
              mountPath: /tabsdata/shared
        - name: 1000-api-ready
          image: ubuntu:24.04
          imagePullPolicy: IfNotPresent
          command: ["${{system:tdk_pyenv_td_root}}/bin/td_apiready"]
          args:
            - --config-file
            - $(CONTAINER_ROOT)/tabsdata/config/apiserver.service.yaml
            - --host
            - td-apiserver.${{system:tdk_namespace_name}}.svc.cluster.local
            - --log-config
            - $(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.py.yaml
            - --timeout
            - "600"
            - --interval
            - "2"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
              ephemeral-storage: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONTAINER_ROOT
              value: ""
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_TABSDATA_INSTANCE
              value: "${{system:tdk_instance_name}}"
          volumeMounts:
            - name: config-api-ready
              mountPath: /tabsdata/config
              readOnly: true
            - name: runtimes
              mountPath: ${{system:tdk_runtimes_root}}
              readOnly: true
        - name: 2000-begin-execution
          image: ubuntu:24.04
          imagePullPolicy: IfNotPresent
          command: ["${{system:tdk_pyenv_td_root}}/bin/td_begin_execution"]
          args:
            - --shared-dir
            - $(CONTAINER_ROOT)/tabsdata/shared
            - --work-dir
            - $(CONTAINER_ROOT)/tabsdata/work
            - --log-config
            - $(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.py.yaml
            - --liveness
            - $(CONTAINER_ROOT)/tabsdata/liveness/liveness
            - --responder-url
            - env:SECRET__TD_RESPONDER_URL
            - --responder-method
            - env:SECRET__TD_RESPONDER_METHOD
            - --responder-authorization
            - env:SECRET__TD_RESPONDER_AUTHORIZATION
            - --journal-file
            - $(CONTAINER_ROOT)/tabsdata/shared/journal/journal.yaml
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
              ephemeral-storage: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONTAINER_ROOT
              value: ""
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_TABSDATA_INSTANCE
              value: "${{system:tdk_instance_name}}"
            - name: TD_LOG_CONFIG
              value: "$(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.rs.yaml"
          volumeMounts:
            - name: config-begin-execution
              mountPath: /tabsdata/config
              readOnly: true
            - name: runtimes
              mountPath: ${{system:tdk_runtimes_root}}
              readOnly: true
            - name: shared
              mountPath: /tabsdata/shared
        - name: 2010-fetch-request
          image: ubuntu:24.04
          imagePullPolicy: IfNotPresent
          command: ["${{system:tdk_pyenv_td_root}}/bin/td_fetch_request"]
          args:
            - --shared-dir
            - $(CONTAINER_ROOT)/tabsdata/shared
            - --work-dir
            - $(CONTAINER_ROOT)/tabsdata/work
            - --log-config
            - $(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.py.yaml
            - --liveness
            - $(CONTAINER_ROOT)/tabsdata/liveness/liveness
            - --responder-url
            - env:SECRET__TD_RESPONDER_URL
            - --responder-method
            - env:SECRET__TD_RESPONDER_METHOD
            - --responder-authorization
            - env:SECRET__TD_RESPONDER_AUTHORIZATION
            - --journal-file
            - $(CONTAINER_ROOT)/tabsdata/shared/journal/journal.yaml
            - --resolver-url
            - env:SECRET__TD_RESOLVER_URL
            - --resolver-method
            - env:SECRET__TD_RESOLVER_METHOD
            - --resolver-authorization
            - env:SECRET__TD_RESOLVER_AUTHORIZATION
            - --request-file
            - $(CONTAINER_ROOT)/tabsdata/shared/request/request.yaml
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
              ephemeral-storage: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONTAINER_ROOT
              value: ""
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_TABSDATA_INSTANCE
              value: "${{system:tdk_instance_name}}"
            - name: TD_LOG_CONFIG
              value: "$(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.rs.yaml"
          volumeMounts:
            - name: config-fetch-request
              mountPath: /tabsdata/config
              readOnly: true
            - name: runtimes
              mountPath: ${{system:tdk_runtimes_root}}
              readOnly: true
            - name: shared
              mountPath: /tabsdata/shared
        - name: 2020-localize-fn-bundle
          image: ubuntu:24.04
          imagePullPolicy: IfNotPresent
          command: ["${{system:tdk_pyenv_td_root}}/bin/td_localize_fn_bundle"]
          args:
            - --shared-dir
            - $(CONTAINER_ROOT)/tabsdata/shared
            - --work-dir
            - $(CONTAINER_ROOT)/tabsdata/work
            - --log-config
            - $(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.py.yaml
            - --liveness
            - $(CONTAINER_ROOT)/tabsdata/liveness/liveness
            - --responder-url
            - env:SECRET__TD_RESPONDER_URL
            - --responder-method
            - env:SECRET__TD_RESPONDER_METHOD
            - --responder-authorization
            - env:SECRET__TD_RESPONDER_AUTHORIZATION
            - --journal-file
            - $(CONTAINER_ROOT)/tabsdata/shared/journal/journal.yaml
            - --request
            - $(CONTAINER_ROOT)/tabsdata/shared/request/request.yaml
            - --bundle-dir
            - $(CONTAINER_ROOT)/tabsdata/shared/bundle/folder
            - --bundle-archive
            - $(CONTAINER_ROOT)/tabsdata/shared/bundle/archive/bundle.tar.zst
            - --transporter-request
            - $(CONTAINER_ROOT)/tabsdata/shuttle/request/bundle-fetch.yaml
            - --transporter-response
            - $(CONTAINER_ROOT)/tabsdata/shuttle/response/bundle-fetch.yaml
            - --storage-config
            - $(CONTAINER_ROOT)/tabsdata/config/apiserver.storage.yaml
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
              ephemeral-storage: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONTAINER_ROOT
              value: ""
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
