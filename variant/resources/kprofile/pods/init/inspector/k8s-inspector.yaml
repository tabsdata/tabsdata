apiVersion: batch/v1
kind: Job
metadata:
  name: inspector
  namespace: tabsdata
  annotations:
    tabsdata.com/description: "Tabsdata inspector init job"
    kubernetes.io/change-cause: ""
  labels:
    app.kubernetes.io/name: tabsdata
    app.kubernetes.io/instance: tabsdata
    app.kubernetes.io/version: "2.0.0"
    app.kubernetes.io/component: inspector
    app.kubernetes.io/part-of: tabsdata
    app.kubernetes.io/managed-by: tdkserver
    tabsdata.com/worker-tier: init
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tabsdata
        app.kubernetes.io/instance: tabsdata
        app.kubernetes.io/version: "2.0.0"
        app.kubernetes.io/component: inspector
        app.kubernetes.io/part-of: tabsdata
        app.kubernetes.io/managed-by: tdkserver
        tabsdata.com/worker-tier: init
    spec:
      restartPolicy: Never
      serviceAccountName: default
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      dnsPolicy: ClusterFirst
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        # runAsUser: 1000     # enable after confirming image's USER and filesystem ownership
        # runAsGroup: 1000    # enable together with runAsUser
        # fsGroup: 1000       # only relevant once Pod has volumes
      containers:
        - name: worker
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -e
              echo "[inspector] reading mounted ConfigMap 'tabsdata' under /etc/configmaps/tabsdata"
              for f in /etc/configmaps/tabsdata/*; do
                [ -f "$f" ] || continue
                printf '[inspector]   %s = %s\n' "$(basename "$f")" "$(cat "$f")"
              done
              echo "[inspector] done"
          resources:
            requests:
              cpu: "100m"
              memory: "4Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # readOnlyRootFilesystem: true   # enable after mapping writable paths to emptyDir mounts
          volumeMounts:
            - name: tabsdata
              mountPath: /etc/configmaps/tabsdata
              readOnly: true
          env:
            - name: CONTAINER_ROOT
              value: ""
      volumes:
        - name: tabsdata
          configMap:
            name: tabsdata
