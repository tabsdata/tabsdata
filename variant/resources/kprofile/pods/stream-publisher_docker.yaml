apiVersion: batch/v1
kind: Job
metadata:
  name: td-stream-publisher
  namespace: ${{system:tdk_namespace_name}}
  annotations:
    tabsdata.com/description: "Tabsdata stream publisher worker"
    kubernetes.io/change-cause: ""
  labels:
    app.kubernetes.io/name: tabsdata
    app.kubernetes.io/instance: tabsdata
    app.kubernetes.io/version: "${{system:tdk_tabsdata_version}}"
    app.kubernetes.io/component: stream-publisher
    app.kubernetes.io/part-of: tabsdata
    app.kubernetes.io/managed-by: tdkserver
    tabsdata.com/tier: ephemeral
    tabsdata.com/decorator: stream_publisher
    tabsdata.com/worker: function
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tabsdata
        app.kubernetes.io/instance: tabsdata
        app.kubernetes.io/version: "${{system:tdk_tabsdata_version}}"
        app.kubernetes.io/component: stream-publisher
        app.kubernetes.io/part-of: tabsdata
        app.kubernetes.io/managed-by: tdkserver
        tabsdata.com/tier: ephemeral
        tabsdata.com/decorator: stream_publisher
        tabsdata.com/worker: function
    spec:
      restartPolicy: Never
      serviceAccountName: default
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      dnsPolicy: ClusterFirst
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: 0000-cabundle
          image: curlimages/curl:8.11.1
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
          - |
            set -eu
            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
               --output /tabsdata/certs/ca-public.pem https://curl.se/ca/cacert.pem
            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
               --output /tabsdata/certs/ca.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
          - name: certs
            mountPath: /tabsdata/certs
        - name: 0010-venvloader
          image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
          imagePullPolicy: IfNotPresent
          command: ["bash"]
          args:
            - $(CONTAINER_ROOT)/tabsdata/assets/venvloader.sh
            - --output
            - ${{system:tdk_runtimes_root}}
            - --venv
            - fn
            - --storage-config
            - $(CONTAINER_ROOT)/tabsdata/config-storage/apiserver.storage.yaml
          env:
            - name: CONTAINER_ROOT
              value: ""
          envFrom:
            - secretRef:
                name: td-app-apiserver-secret-config-apiserver.storage.yaml
              prefix: SECRETS__
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: storage
              mountPath: /tabsdata/repository/storage
            - name: assets
              mountPath: /tabsdata/assets
              readOnly: true
            - name: config-storage
              mountPath: /tabsdata/config-storage
              readOnly: true
            - name: runtimes
              mountPath: /tabsdata/runtimes
        - name: 0020-begin-execution
          image: ubuntu:24.04
          imagePullPolicy: IfNotPresent
          command: ["${{system:tdk_pyenv_fn_root}}/bin/td_begin_execution"]
          args:
            - --shared-dir
            - $(CONTAINER_ROOT)/tabsdata/shared
            - --work-dir
            - $(CONTAINER_ROOT)/tabsdata/work
            - --log-config
            - $(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.py.yaml
            - --liveness
            - $(CONTAINER_ROOT)/tabsdata/liveness/liveness
            - --responder-url
            - env:SECRET__TD_RESPONDER_URL
            - --responder-method
            - env:SECRET__TD_RESPONDER_METHOD
            - --responder-authorization
            - env:SECRET__TD_RESPONDER_AUTHORIZATION
            - --journal-file
            - $(CONTAINER_ROOT)/tabsdata/shared/journal/journal.yaml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONTAINER_ROOT
              value: ""
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_TABSDATA_INSTANCE
              value: "${{system:tdk_instance_name}}"
            - name: TD_LOG_CONFIG
              value: "$(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.rs.yaml"
            - name: SSL_CERT_FILE
              value: "/tabsdata/certs/ca-public.pem"
            - name: TD_BEFORE_PATH
              value: "${{system:tdk_pyenv_fn_root}}/${{system:tdk_pyenv_scripts_folder}}"
            - name: TD_AFTER_PATH
              value: ""
          volumeMounts:
            - name: config-begin-execution
              mountPath: /tabsdata/config
              readOnly: true
            - name: runtimes
              mountPath: /tabsdata/runtimes
              readOnly: true
            - name: shared
              mountPath: /tabsdata/shared
            - name: certs
              mountPath: /tabsdata/certs
              readOnly: true
            - name: liveness
              mountPath: /tabsdata/liveness
            - name: work
              mountPath: /tabsdata/work
        - name: 0030-fetch-request
          image: ubuntu:24.04
          imagePullPolicy: IfNotPresent
          command: ["${{system:tdk_pyenv_fn_root}}/bin/td_fetch_request"]
          args:
            - --shared-dir
            - $(CONTAINER_ROOT)/tabsdata/shared
            - --work-dir
            - $(CONTAINER_ROOT)/tabsdata/work
            - --log-config
            - $(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.py.yaml
            - --liveness
            - $(CONTAINER_ROOT)/tabsdata/liveness/liveness
            - --responder-url
            - env:SECRET__TD_RESPONDER_URL
            - --responder-method
            - env:SECRET__TD_RESPONDER_METHOD
            - --responder-authorization
            - env:SECRET__TD_RESPONDER_AUTHORIZATION
            - --journal-file
            - $(CONTAINER_ROOT)/tabsdata/shared/journal/journal.yaml
            - --resolver-url
            - env:SECRET__TD_RESOLVER_URL
            - --resolver-method
            - env:SECRET__TD_RESOLVER_METHOD
            - --resolver-authorization
            - env:SECRET__TD_RESOLVER_AUTHORIZATION
            - --request-file
            - $(CONTAINER_ROOT)/tabsdata/shared/request/request.yaml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONTAINER_ROOT
              value: ""
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_TABSDATA_INSTANCE
              value: "${{system:tdk_instance_name}}"
            - name: TD_LOG_CONFIG
              value: "$(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.rs.yaml"
            - name: SSL_CERT_FILE
              value: "/tabsdata/certs/ca-public.pem"
            - name: TD_BEFORE_PATH
              value: "${{system:tdk_pyenv_fn_root}}/${{system:tdk_pyenv_scripts_folder}}"
            - name: TD_AFTER_PATH
              value: ""
          volumeMounts:
            - name: config-fetch-request
              mountPath: /tabsdata/config
              readOnly: true
            - name: runtimes
              mountPath: /tabsdata/runtimes
              readOnly: true
            - name: shared
              mountPath: /tabsdata/shared
            - name: certs
              mountPath: /tabsdata/certs
              readOnly: true
            - name: liveness
              mountPath: /tabsdata/liveness
            - name: work
              mountPath: /tabsdata/work
        - name: 0040-localize-fn-bundle
          image: ubuntu:24.04
          imagePullPolicy: IfNotPresent
          command: ["${{system:tdk_pyenv_fn_root}}/bin/td_localize_fn_bundle"]
          args:
            - --shared-dir
            - $(CONTAINER_ROOT)/tabsdata/shared
            - --work-dir
            - $(CONTAINER_ROOT)/tabsdata/work
            - --log-config
            - $(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.py.yaml
            - --liveness
            - $(CONTAINER_ROOT)/tabsdata/liveness/liveness
            - --responder-url
            - env:SECRET__TD_RESPONDER_URL
            - --responder-method
            - env:SECRET__TD_RESPONDER_METHOD
            - --responder-authorization
            - env:SECRET__TD_RESPONDER_AUTHORIZATION
            - --journal-file
            - $(CONTAINER_ROOT)/tabsdata/shared/journal/journal.yaml
            - --request
            - $(CONTAINER_ROOT)/tabsdata/shared/request/request.yaml
            - --bundle-dir
            - $(CONTAINER_ROOT)/tabsdata/shared/bundle/folder
            - --bundle-archive
            - $(CONTAINER_ROOT)/tabsdata/shared/bundle/archive/bundle.tar.zst
            - --transporter-request
            - $(CONTAINER_ROOT)/tabsdata/shuttle/request/bundle-fetch.yaml
            - --transporter-response
            - $(CONTAINER_ROOT)/tabsdata/shuttle/response/bundle-fetch.yaml
            - --storage-config
            - $(CONTAINER_ROOT)/tabsdata/config/apiserver.storage.yaml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONTAINER_ROOT
              value: ""
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_TABSDATA_INSTANCE
              value: "${{system:tdk_instance_name}}"
            - name: TD_LOG_CONFIG
              value: "$(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.rs.yaml"
            - name: SSL_CERT_FILE
              value: "/tabsdata/certs/ca-public.pem"
            - name: TD_BEFORE_PATH
              value: "${{system:tdk_pyenv_fn_root}}/${{system:tdk_pyenv_scripts_folder}}"
            - name: TD_AFTER_PATH
              value: ""
          envFrom:
            - secretRef:
                name: td-app-apiserver-secret-config-apiserver.storage.yaml
              prefix: SECRETS__
          volumeMounts:
            - name: config-localize-fn-bundle
              mountPath: /tabsdata/config
              readOnly: true
            - name: runtimes
              mountPath: /tabsdata/runtimes
              readOnly: true
            - name: shared
              mountPath: /tabsdata/shared
            - name: certs
              mountPath: /tabsdata/certs
              readOnly: true
            - name: liveness
              mountPath: /tabsdata/liveness
            - name: work
              mountPath: /tabsdata/work
            - name: storage
              mountPath: /tabsdata/repository/storage
        - name: 0050-manifest-trigger
          image: ubuntu:24.04
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          command: ["${{system:tdk_pyenv_fn_root}}/bin/td_run_manifest_trigger"]
          args:
            - --shared-dir
            - $(CONTAINER_ROOT)/tabsdata/shared
            - --work-dir
            - $(CONTAINER_ROOT)/tabsdata/work
            - --log-config
            - $(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.py.yaml
            - --liveness
            - $(CONTAINER_ROOT)/tabsdata/liveness/liveness
            - --responder-url
            - env:SECRET__TD_RESPONDER_URL
            - --responder-method
            - env:SECRET__TD_RESPONDER_METHOD
            - --responder-authorization
            - env:SECRET__TD_RESPONDER_AUTHORIZATION
            - --journal-file
            - $(CONTAINER_ROOT)/tabsdata/shared/journal/journal.yaml
            - --request
            - $(CONTAINER_ROOT)/tabsdata/shared/request/request.yaml
            - --trigger-url
            - env:SECRET__TD_TRIGGER_URL
            - --trigger-method
            - env:SECRET__TD_TRIGGER_METHOD
            - --trigger-authorization
            - env:SECRET__TD_TRIGGER_AUTHORIZATION
            - --back-off-secs
            - "30"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONTAINER_ROOT
              value: ""
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_TABSDATA_INSTANCE
              value: "${{system:tdk_instance_name}}"
            - name: TD_LOG_CONFIG
              value: "$(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.rs.yaml"
            - name: SSL_CERT_FILE
              value: "/tabsdata/certs/ca-public.pem"
            - name: TD_BEFORE_PATH
              value: "${{system:tdk_pyenv_fn_root}}/${{system:tdk_pyenv_scripts_folder}}"
            - name: TD_AFTER_PATH
              value: ""
          envFrom:
            - secretRef:
                name: td-app-apiserver-secret-config-apiserver.storage.yaml
              prefix: SECRETS__
          volumeMounts:
            - name: config-manifest-trigger
              mountPath: /tabsdata/config
              readOnly: true
            - name: runtimes
              mountPath: /tabsdata/runtimes
              readOnly: true
            - name: shared
              mountPath: /tabsdata/shared
            - name: certs
              mountPath: /tabsdata/certs
              readOnly: true
            - name: liveness
              mountPath: /tabsdata/liveness
            - name: work
              mountPath: /tabsdata/work
            - name: storage
              mountPath: /tabsdata/repository/storage
      containers:
        - name: 1000-run-streamer
          image: ubuntu:24.04
          imagePullPolicy: IfNotPresent
          command: ["${{system:tdk_pyenv_fn_root}}/bin/td_run_streamer"]
          args:
            - --shared-dir
            - $(CONTAINER_ROOT)/tabsdata/shared
            - --work-dir
            - $(CONTAINER_ROOT)/tabsdata/work
            - --connection-file
            - $(CONTAINER_ROOT)/tabsdata/connection/connection.yaml
            - --log-config
            - $(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.py.yaml
            - --liveness
            - $(CONTAINER_ROOT)/tabsdata/liveness/liveness
            - --responder-url
            - env:SECRET__TD_RESPONDER_URL
            - --responder-method
            - env:SECRET__TD_RESPONDER_METHOD
            - --responder-authorization
            - env:SECRET__TD_RESPONDER_AUTHORIZATION
            - --journal-file
            - $(CONTAINER_ROOT)/tabsdata/shared/journal/journal.yaml
            - --request
            - $(CONTAINER_ROOT)/tabsdata/shared/request/request.yaml
            - --bundle-dir
            - $(CONTAINER_ROOT)/tabsdata/shared/bundle/folder
            - --out-dir
            - $(CONTAINER_ROOT)/tabsdata/shared/out
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONTAINER_ROOT
              value: ""
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_TABSDATA_INSTANCE
              value: "${{system:tdk_instance_name}}"
            - name: TD_LOG_CONFIG
              value: "$(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.rs.yaml"
            - name: SSL_CERT_FILE
              value: "/tabsdata/certs/ca-public.pem"
            - name: TD_BEFORE_PATH
              value: "${{system:tdk_pyenv_fn_root}}/${{system:tdk_pyenv_scripts_folder}}"
            - name: TD_AFTER_PATH
              value: ""
          envFrom:
            - secretRef:
                name: ${{system:tdk_connection_secret_name}}
            - secretRef:
                name: td-app-apiserver-secret-config-apiserver.storage.yaml
              prefix: SECRETS__
          volumeMounts:
            - name: config-run-streamer
              mountPath: /tabsdata/config
              readOnly: true
            - name: connection
              mountPath: /tabsdata/connection
              readOnly: true
            - name: runtimes
              mountPath: /tabsdata/runtimes
              readOnly: true
            - name: shared
              mountPath: /tabsdata/shared
            - name: certs
              mountPath: /tabsdata/certs
              readOnly: true
            - name: liveness
              mountPath: /tabsdata/liveness
            - name: work
              mountPath: /tabsdata/work
            - name: storage
              mountPath: /tabsdata/repository/storage
      volumes:
        - name: storage
          hostPath:
            path: ${{system:tdk_storage_path}}
            type: DirectoryOrCreate
        - name: certs
          emptyDir: {}
        - name: config-begin-execution
          projected:
            sources:
              - configMap:
                  name: td-app-tabsdata-config-tabsdata.log.py.yaml
              - configMap:
                  name: td-app-tabsdata-config-tabsdata.log.rs.yaml
        - name: config-fetch-request
          projected:
            sources:
              - configMap:
                  name: td-app-tabsdata-config-tabsdata.log.py.yaml
              - configMap:
                  name: td-app-tabsdata-config-tabsdata.log.rs.yaml
        - name: config-localize-fn-bundle
          projected:
            sources:
              - configMap:
                  name: td-app-tabsdata-config-tabsdata.log.py.yaml
              - configMap:
                  name: td-app-tabsdata-config-tabsdata.log.rs.yaml
              - configMap:
                  name: td-app-apiserver-config-apiserver.storage.yaml
        - name: config-manifest-trigger
          projected:
            sources:
              - configMap:
                  name: td-app-tabsdata-config-tabsdata.log.py.yaml
              - configMap:
                  name: td-app-tabsdata-config-tabsdata.log.rs.yaml
        - name: config-run-streamer
          projected:
            sources:
              - configMap:
                  name: td-app-tabsdata-config-tabsdata.log.py.yaml
              - configMap:
                  name: td-app-tabsdata-config-tabsdata.log.rs.yaml
        - name: connection
          projected:
            sources:
              - configMap:
                  name: ${{system:tdk_connection_configmap_name}}
                  items:
                    - key: connection.yaml
                      path: connection.yaml
        - name: assets
          projected:
            defaultMode: 493
            sources:
              - configMap:
                  name: td-app-venvloader-asset-venvloader.sh
              - configMap:
                  name: td-app-venvloader-asset-venvloader.py
        - name: config-storage
          projected:
            sources:
              - configMap:
                  name: td-app-apiserver-config-apiserver.storage.yaml
        - name: runtimes
          emptyDir: {}
        - name: shared
          emptyDir: {}
        - name: liveness
          emptyDir: {}
        - name: work
          emptyDir: {}
