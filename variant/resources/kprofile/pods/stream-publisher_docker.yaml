apiVersion: batch/v1
kind: Job
metadata:
  name: td-stream-publisher
  namespace: tabsdata
  annotations:
    tabsdata.com/description: "Tabsdata stream publisher worker"
    kubernetes.io/change-cause: ""
  labels:
    app.kubernetes.io/name: tabsdata
    app.kubernetes.io/instance: tabsdata
    app.kubernetes.io/version: "2.0.0"
    app.kubernetes.io/component: stream-publisher
    app.kubernetes.io/part-of: tabsdata
    app.kubernetes.io/managed-by: tdkserver
    tabsdata.com/tier: ephemeral
    tabsdata.com/decorator: stream_publisher
    tabsdata.com/worker: function
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tabsdata
        app.kubernetes.io/instance: tabsdata
        app.kubernetes.io/version: "2.0.0"
        app.kubernetes.io/component: stream-publisher
        app.kubernetes.io/part-of: tabsdata
        app.kubernetes.io/managed-by: tdkserver
        tabsdata.com/tier: ephemeral
        tabsdata.com/decorator: stream_publisher
        tabsdata.com/worker: function
    spec:
      restartPolicy: Never
      serviceAccountName: default
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      dnsPolicy: ClusterFirst
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: 0010-begin-execution
          image: tabsdata/kube/tabsdata:2.0.0
          imagePullPolicy: IfNotPresent
          command: ["$(CONTAINER_ROOT)/tabsdata/pyenv/bin/td_begin_execution"]
          args:
            - --shared-dir
            - /tabsdata/shared
            - --work-dir
            - /tabsdata/work
            - --log-config
            - /tabsdata/config/tabsdata.log.py.yaml
            - --liveness
            - /tabsdata/liveness/liveness
            - --responder-url
            - env:SECRET__TD_RESPONDER_URL
            - --responder-method
            - env:SECRET__TD_RESPONDER_METHOD
            - --responder-authorization
            - env:SECRET__TD_RESPONDER_AUTHORIZATION
            - --journal-file
            - /tabsdata/shared/journal/journal.yaml
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONTAINER_ROOT
              value: ""
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_TABSDATA_INSTANCE
              value: "${{system:tdk_instance_name}}"
            - name: TD_LOG_CONFIG
              value: "/tabsdata/config/tabsdata.log.rs.yaml"
          volumeMounts:
            - name: config-begin-execution
              mountPath: /tabsdata/config
              readOnly: true
            - name: shared
              mountPath: /tabsdata/shared
        - name: 0020-fetch-request
          image: tabsdata/kube/tabsdata:2.0.0
          imagePullPolicy: IfNotPresent
          command: ["$(CONTAINER_ROOT)/tabsdata/pyenv/bin/td_fetch_request"]
          args:
            - --shared-dir
            - /tabsdata/shared
            - --work-dir
            - /tabsdata/work
            - --log-config
            - /tabsdata/config/tabsdata.log.py.yaml
            - --liveness
            - /tabsdata/liveness/liveness
            - --responder-url
            - env:SECRET__TD_RESPONDER_URL
            - --responder-method
            - env:SECRET__TD_RESPONDER_METHOD
            - --responder-authorization
            - env:SECRET__TD_RESPONDER_AUTHORIZATION
            - --journal-file
            - /tabsdata/shared/journal/journal.yaml
            - --resolver-url
            - env:SECRET__TD_RESOLVER_URL
            - --resolver-method
            - env:SECRET__TD_RESOLVER_METHOD
            - --resolver-authorization
            - env:SECRET__TD_RESOLVER_AUTHORIZATION
            - --request-file
            - /tabsdata/shared/request/request.yaml
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONTAINER_ROOT
              value: ""
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_TABSDATA_INSTANCE
              value: "${{system:tdk_instance_name}}"
            - name: TD_LOG_CONFIG
              value: "/tabsdata/config/tabsdata.log.rs.yaml"
          volumeMounts:
            - name: config-fetch-request
              mountPath: /tabsdata/config
              readOnly: true
            - name: shared
              mountPath: /tabsdata/shared
        - name: 0030-localize-fn-bundle
          image: tabsdata/kube/tabsdata:2.0.0
          imagePullPolicy: IfNotPresent
          command: ["$(CONTAINER_ROOT)/tabsdata/pyenv/bin/td_localize_fn_bundle"]
          args:
            - --shared-dir
            - /tabsdata/shared
            - --work-dir
            - /tabsdata/work
            - --log-config
            - /tabsdata/config/tabsdata.log.py.yaml
            - --liveness
            - /tabsdata/liveness/liveness
            - --responder-url
            - env:SECRET__TD_RESPONDER_URL
            - --responder-method
            - env:SECRET__TD_RESPONDER_METHOD
            - --responder-authorization
            - env:SECRET__TD_RESPONDER_AUTHORIZATION
            - --journal-file
            - /tabsdata/shared/journal/journal.yaml
            - --request
            - /tabsdata/shared/request/request.yaml
            - --bundle-dir
            - /tabsdata/shared/bundle/folder
            - --bundle-archive
            - /tabsdata/shared/bundle/archive/bundle.tar.zst
            - --transporter-request
            - /tabsdata/shuttle/request/bundle-fetch.yaml
            - --transporter-response
            - /tabsdata/shuttle/response/bundle-fetch.yaml
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONTAINER_ROOT
              value: ""
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_TABSDATA_INSTANCE
              value: "${{system:tdk_instance_name}}"
            - name: TD_LOG_CONFIG
              value: "/tabsdata/config/tabsdata.log.rs.yaml"
          volumeMounts:
            - name: config-localize-fn-bundle
              mountPath: /tabsdata/config
              readOnly: true
            - name: shared
              mountPath: /tabsdata/shared
        - name: 0900-manifest-trigger
          image: tabsdata/kube/tabsdata:2.0.0
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          command: ["$(CONTAINER_ROOT)/tabsdata/pyenv/bin/td_run_manifest_trigger"]
          args:
            - --shared-dir
            - /tabsdata/shared
            - --work-dir
            - /tabsdata/work
            - --log-config
            - /tabsdata/config/tabsdata.log.py.yaml
            - --liveness
            - /tabsdata/liveness/liveness
            - --responder-url
            - env:SECRET__TD_RESPONDER_URL
            - --responder-method
            - env:SECRET__TD_RESPONDER_METHOD
            - --responder-authorization
            - env:SECRET__TD_RESPONDER_AUTHORIZATION
            - --journal-file
            - /tabsdata/shared/journal/journal.yaml
            - --request
            - /tabsdata/shared/request/request.yaml
            - --trigger-url
            - env:SECRET__TD_TRIGGER_URL
            - --trigger-method
            - env:SECRET__TD_TRIGGER_METHOD
            - --trigger-authorization
            - env:SECRET__TD_TRIGGER_AUTHORIZATION
            - --back-off-secs
            - "30"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONTAINER_ROOT
              value: ""
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_TABSDATA_INSTANCE
              value: "${{system:tdk_instance_name}}"
            - name: TD_LOG_CONFIG
              value: "/tabsdata/config/tabsdata.log.rs.yaml"
          volumeMounts:
            - name: config-manifest-trigger
              mountPath: /tabsdata/config
              readOnly: true
            - name: shared
              mountPath: /tabsdata/shared
      containers:
        - name: 1000-run-streamer
          image: tabsdata/kube/tabsdata:2.0.0
          imagePullPolicy: IfNotPresent
          command: ["$(CONTAINER_ROOT)/tabsdata/pyenv/bin/td_run_streamer"]
          args:
            - --shared-dir
            - /tabsdata/shared
            - --work-dir
            - /tabsdata/work
            - --connection-file
            - /tabsdata/connection/connection.yaml
            - --log-config
            - /tabsdata/config/tabsdata.log.py.yaml
            - --liveness
            - /tabsdata/liveness/liveness
            - --responder-url
            - env:SECRET__TD_RESPONDER_URL
            - --responder-method
            - env:SECRET__TD_RESPONDER_METHOD
            - --responder-authorization
            - env:SECRET__TD_RESPONDER_AUTHORIZATION
            - --journal-file
            - /tabsdata/shared/journal/journal.yaml
            - --request
            - /tabsdata/shared/request/request.yaml
            - --bundle-dir
            - /tabsdata/shared/bundle/folder
            - --out-dir
            - /tabsdata/shared/out
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONTAINER_ROOT
              value: ""
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_TABSDATA_INSTANCE
              value: "${{system:tdk_instance_name}}"
            - name: TD_LOG_CONFIG
              value: "/tabsdata/config/tabsdata.log.rs.yaml"
          envFrom:
            - secretRef:
                name: ${{system:tdk_connection_secret_name}}
          volumeMounts:
            - name: config-run-streamer
              mountPath: /tabsdata/config
              readOnly: true
            - name: connection
              mountPath: /tabsdata/connection
              readOnly: true
            - name: shared
              mountPath: /tabsdata/shared
      volumes:
        - name: config-begin-execution
          projected:
            sources:
              - configMap:
                  name: td-app-tabsdata-config-tabsdata.log.py.yaml
              - configMap:
                  name: td-app-tabsdata-config-tabsdata.log.rs.yaml
        - name: config-fetch-request
          projected:
            sources:
              - configMap:
                  name: td-app-tabsdata-config-tabsdata.log.py.yaml
              - configMap:
                  name: td-app-tabsdata-config-tabsdata.log.rs.yaml
        - name: config-localize-fn-bundle
          projected:
            sources:
              - configMap:
                  name: td-app-tabsdata-config-tabsdata.log.py.yaml
              - configMap:
                  name: td-app-tabsdata-config-tabsdata.log.rs.yaml
        - name: config-manifest-trigger
          projected:
            sources:
              - configMap:
                  name: td-app-tabsdata-config-tabsdata.log.py.yaml
              - configMap:
                  name: td-app-tabsdata-config-tabsdata.log.rs.yaml
        - name: config-run-streamer
          projected:
            sources:
              - configMap:
                  name: td-app-tabsdata-config-tabsdata.log.py.yaml
              - configMap:
                  name: td-app-tabsdata-config-tabsdata.log.rs.yaml
        - name: connection
          projected:
            sources:
              - configMap:
                  name: ${{system:tdk_connection_configmap_name}}
                  items:
                    - key: connection.yaml
                      path: connection.yaml
        - name: shared
          emptyDir: {}
