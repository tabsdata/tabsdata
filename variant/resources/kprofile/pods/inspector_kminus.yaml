apiVersion: batch/v1
kind: Job
metadata:
  name: td-inspector
  namespace: default
  annotations:
    tabsdata.com/description: "Tabsdata inspector init job"
    kubernetes.io/change-cause: ""
  labels:
    app.kubernetes.io/name: tabsdata
    app.kubernetes.io/instance: tabsdata
    app.kubernetes.io/version: "2.0.0"
    app.kubernetes.io/component: inspector
    app.kubernetes.io/part-of: tabsdata
    app.kubernetes.io/managed-by: tdkserver
    tabsdata.com/tier: init
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tabsdata
        app.kubernetes.io/instance: tabsdata
        app.kubernetes.io/version: "2.0.0"
        app.kubernetes.io/component: inspector
        app.kubernetes.io/part-of: tabsdata
        app.kubernetes.io/managed-by: tdkserver
        tabsdata.com/tier: init
    spec:
      restartPolicy: Never
      serviceAccountName: default
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      dnsPolicy: ClusterFirst
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        # runAsUser: 1000     # enable after confirming image's USER and filesystem ownership
        # runAsGroup: 1000    # enable together with runAsUser
        # fsGroup: 1000       # only relevant once Pod has volumes
      containers:
        - name: inspector
          image: /dev/null
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -e
              for folder in pods configs; do
                dir="${KM_CONTAINER_ROOT}/tabsdata/${folder}"
                echo "Reading mounted '${folder}' folder under ${dir}"
                for f in "${dir}"/*; do
                  [ -f "$f" ] || continue
                  printf '[inspector]   %s/%s = %s\n' "${folder}" "$(basename "$f")" "$(cat "$f")"
                done
              done
              echo "Done!"
          resources:
            requests:
              cpu: "100m"
              memory: "4Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # readOnlyRootFilesystem: true   # enable after mapping writable paths to emptyDir mounts
          volumeMounts:
            - name: configs
              mountPath: /tabsdata/configs
              readOnly: true
            - name: pods
              mountPath: /tabsdata/pods
              readOnly: true
            - name: pyenv
              mountPath: /tabsdata/pyenv
              readOnly: true
          env:
            - name: CONTAINER_ROOT
              value: "$(KM_CONTAINER_ROOT)"
      volumes:
        - name: configs
          projected:
            sources:
              - configMap:
                  name: tabsdata-config-apiserver.yaml
              - configMap:
                  name: tabsdata-config-apiserver.log.yaml
              - configMap:
                  name: tabsdata-config-tabsdata.yaml
        - name: pods
          projected:
            sources:
              - configMap:
                  name: tabsdata-pod-apiserver.yaml
              - configMap:
                  name: tabsdata-pod-crontrigger.yaml
              - configMap:
                  name: tabsdata-pod-function.yaml
              - configMap:
                  name: tabsdata-pod-inspector.yaml
              - configMap:
                  name: tabsdata-pod-stagetrigger.yaml
        - name: pyenv
          hostPath:
            path: "${sys:TDK_PYENV_TD_ROOT}"
