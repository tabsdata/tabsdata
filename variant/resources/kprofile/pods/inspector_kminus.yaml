apiVersion: batch/v1
kind: Job
metadata:
  name: td-inspector
  namespace: default
  annotations:
    tabsdata.com/description: "Tabsdata inspector init job"
    kubernetes.io/change-cause: ""
  labels:
    app.kubernetes.io/name: tabsdata
    app.kubernetes.io/instance: tabsdata
    app.kubernetes.io/version: "2.0.0"
    app.kubernetes.io/component: inspector
    app.kubernetes.io/part-of: tabsdata
    app.kubernetes.io/managed-by: tdkserver
    tabsdata.com/tier: init
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tabsdata
        app.kubernetes.io/instance: tabsdata
        app.kubernetes.io/version: "2.0.0"
        app.kubernetes.io/component: inspector
        app.kubernetes.io/part-of: tabsdata
        app.kubernetes.io/managed-by: tdkserver
        tabsdata.com/tier: init
    spec:
      restartPolicy: Never
      nodeName: tdknode
      serviceAccountName: default
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      dnsPolicy: ClusterFirst
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        # Pending decision: not yet enabled.
        # Run the container under a fixed user and group by setting runAsUser
        # and runAsGroup, only after confirming the image's own user and
        # filesystem ownership; set runAsGroup together with runAsUser. fsGroup
        # is only relevant once the pod has volumes.
        # runAsUser: 1000
        # runAsGroup: 1000
        # fsGroup: 1000
      initContainers:
      - name: td-probe
        image: /dev/null
        imagePullPolicy: IfNotPresent
        command: ["$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}/python${{system:tdk_exe_suffix}}"]
        args:
          - -c
          - "import os,sys\ndef show(lbl,p):\n    try: print('[td-probe]',lbl,repr(p),'->',sorted(os.listdir(p)))\n    except Exception as e: print('[td-probe]',lbl,repr(p),'ERR',type(e).__name__,e)\nr=os.environ.get('CONTAINER_ROOT','')\nprint('[td-probe] CONTAINER_ROOT',repr(r))\nprint('[td-probe] sys.executable',repr(sys.executable))\nprint('[td-probe] sys.prefix',repr(sys.prefix))\nprint('[td-probe] os.name',os.name,'sep',repr(os.sep))\np=os.path.join(r,'tabsdata','pyenv')\nshow('pyenv',p)\nfor s in ('Scripts','bin'): show(s,os.path.join(p,s))\nprint('[td-probe] PATH',os.environ.get('PATH',''))\n"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        env:
          - name: CONTAINER_ROOT
            value: "$(KM_CONTAINER_ROOT)"
        volumeMounts:
          - name: pyenv
            mountPath: /tabsdata/pyenv
            readOnly: true
      containers:
        - name: inspector
          image: /dev/null
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -e
              for folder in pods configs; do
                dir="${KM_CONTAINER_ROOT}/tabsdata/${folder}"
                echo "Reading mounted '${folder}' folder under ${dir}"
                for f in "${dir}"/*; do
                  [ -f "$f" ] || continue
                  printf '[inspector]   %s/%s = %s\n' "${folder}" "$(basename "$f")" "$(cat "$f")"
                done
              done
              echo "Done!"
          resources:
            requests:
              cpu: "100m"
              memory: "4Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # Pending decision: not yet enabled.
        # Mount the root filesystem read-only, only after mapping every writable
        # path to an emptyDir mount.
        # readOnlyRootFilesystem: true
          volumeMounts:
            - name: configs
              mountPath: /tabsdata/configs
              readOnly: true
            - name: pods
              mountPath: /tabsdata/pods
              readOnly: true
            - name: pyenv
              mountPath: /tabsdata/pyenv
              readOnly: true
          env:
            - name: CONTAINER_ROOT
              value: "$(KM_CONTAINER_ROOT)"
      volumes:
        - name: configs
          projected:
            sources:
              - configMap:
                  name: td-app-apiserver-config-apiserver.service.yaml
              - configMap:
                  name: td-app-apiserver-config-apiserver.database.yaml
              - configMap:
                  name: td-app-apiserver-config-apiserver.storage.yaml
              - configMap:
                  name: td-app-apiserver-config-apiserver.log.yaml
              - configMap:
                  name: td-app-tabsdata-config-tabsdata.yaml
        - name: pods
          projected:
            sources:
              - configMap:
                  name: td-sys-apiserver-pod-apiserver.yaml
              - configMap:
                  name: td-sys-cron-publisher-pod-cron-publisher.yaml
              - configMap:
                  name: td-sys-function-publisher-pod-function-publisher.yaml
              - configMap:
                  name: td-sys-function-subscriber-pod-function-subscriber.yaml
              - configMap:
                  name: td-sys-function-transformer-pod-function-transformer.yaml
              - configMap:
                  name: td-sys-inspector-pod-inspector.yaml
              - configMap:
                  name: td-sys-stream-publisher-pod-stream-publisher.yaml
        - name: pyenv
          hostPath:
            path: "${{system:tdk_pyenv_td_root}}"
