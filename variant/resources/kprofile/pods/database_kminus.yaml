apiVersion: v1
kind: Pod
metadata:
  name: td-database
  namespace: default
  annotations:
    tabsdata.com/description: "Tabsdata database service"
    kubernetes.io/change-cause: ""
  labels:
    app.kubernetes.io/name: tabsdata
    app.kubernetes.io/instance: tabsdata
    app.kubernetes.io/version: "2.0.0"
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: tabsdata
    app.kubernetes.io/managed-by: tdkserver
    tabsdata.com/tier: service
spec:
  restartPolicy: Always
  nodeName: tdknode
  serviceAccountName: default
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 60
  dnsPolicy: ClusterFirst
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  initContainers:
  - name: td-probe
    image: /dev/null
    imagePullPolicy: IfNotPresent
    command: ["$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}/python${{system:tdk_exe_suffix}}"]
    args:
      - -c
      - "import os,sys\ndef show(lbl,p):\n    try: print('[td-probe]',lbl,repr(p),'->',sorted(os.listdir(p)))\n    except Exception as e: print('[td-probe]',lbl,repr(p),'ERR',type(e).__name__,e)\nr=os.environ.get('CONTAINER_ROOT','')\nprint('[td-probe] CONTAINER_ROOT',repr(r))\nprint('[td-probe] sys.executable',repr(sys.executable))\nprint('[td-probe] sys.prefix',repr(sys.prefix))\nprint('[td-probe] os.name',os.name,'sep',repr(os.sep))\np=os.path.join(r,'tabsdata','pyenv')\nshow('pyenv',p)\nfor s in ('Scripts','bin'): show(s,os.path.join(p,s))\nprint('[td-probe] PATH',os.environ.get('PATH',''))\n"
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
    env:
      - name: CONTAINER_ROOT
        value: "$(KM_CONTAINER_ROOT)"
    volumeMounts:
      - name: pyenv
        mountPath: /tabsdata/pyenv
        readOnly: true
  containers:
  - name: database
    image: /dev/null
    imagePullPolicy: IfNotPresent
    command: ["$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}/td_dbmanager${{system:tdk_exe_suffix}}"]
    args:
    - server
    - serve
    - --config-file
    - $(CONTAINER_ROOT)/tabsdata/config/dbmanager.database.yaml
    ports:
    - name: postgres
      containerPort: ${{system:tdk_database_port}}
      protocol: TCP
    resources:
      requests:
        cpu: "100m"
        memory: "512Mi"
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
    env:
    - name: CONTAINER_ROOT
      value: "$(KM_CONTAINER_ROOT)"
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: POD_TABSDATA_INSTANCE
      value: "${{system:tdk_instance_name}}"
    - name: TD_DATABASE_DIR
      value: "${{system:tdk_database_path}}"
    - name: TD_LOG_CONFIG
      value: "$(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.rs.yaml"
    volumeMounts:
    - name: config
      mountPath: /tabsdata/config
      readOnly: true
    - name: pyenv
      mountPath: /tabsdata/pyenv
      readOnly: true
    - name: database
      mountPath: /tabsdata/database
  volumes:
  - name: config
    projected:
      sources:
      - configMap:
          name: td-app-dbmanager-config-dbmanager.database.yaml
      - configMap:
          name: td-app-tabsdata-config-tabsdata.log.rs.yaml
  - name: pyenv
    hostPath:
      path: "${{system:tdk_pyenv_td_root}}"
  - name: database
    hostPath:
      path: "${{system:tdk_database_path}}"
