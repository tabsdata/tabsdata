apiVersion: v1
kind: Service
metadata:
  name: net-apiserver
  namespace: ${{system:tdk_namespace_name}}
  annotations:
    tabsdata.com/description: "Tabsdata apiserver endpoint"
    kubernetes.io/change-cause: ""
  labels:
    app.kubernetes.io/name: tabsdata
    app.kubernetes.io/instance: tabsdata
    app.kubernetes.io/version: "${{system:tdk_tabsdata_version}}"
    app.kubernetes.io/component: apiserver
    app.kubernetes.io/part-of: tabsdata
    app.kubernetes.io/managed-by: tdkserver
    tabsdata.com/tier: endpoint
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: tabsdata
    app.kubernetes.io/part-of: tabsdata
    app.kubernetes.io/component: apiserver
  ports:
  - name: public-http
    port: ${{system:tdk_apiserver_public_port}}
    targetPort: public-http
    protocol: TCP
  - name: private-http
    port: ${{system:tdk_apiserver_private_port}}
    targetPort: private-http
    protocol: TCP
