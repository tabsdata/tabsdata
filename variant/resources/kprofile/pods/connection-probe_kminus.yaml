apiVersion: batch/v1
kind: Job
metadata:
  name: td-connection-probe
  namespace: ${{system:tdk_namespace_name}}
  annotations:
    tabsdata.com/description: "Tabsdata connection probe"
    kubernetes.io/change-cause: ""
  labels:
    app.kubernetes.io/name: tabsdata
    app.kubernetes.io/instance: tabsdata
    app.kubernetes.io/version: "${{system:tdk_tabsdata_version}}"
    app.kubernetes.io/component: connection-probe
    app.kubernetes.io/part-of: tabsdata
    app.kubernetes.io/managed-by: tdkserver
    tabsdata.com/tier: ephemeral
    tabsdata.com/worker: connection-probe
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 330
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tabsdata
        app.kubernetes.io/instance: tabsdata
        app.kubernetes.io/version: "${{system:tdk_tabsdata_version}}"
        app.kubernetes.io/component: connection-probe
        app.kubernetes.io/part-of: tabsdata
        app.kubernetes.io/managed-by: tdkserver
        tabsdata.com/tier: ephemeral
        tabsdata.com/worker: connection-probe
    spec:
      restartPolicy: Never
      nodeName: tdknode
      serviceAccountName: default
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      dnsPolicy: ClusterFirst
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: 1000-probe
          image: function
          imagePullPolicy: IfNotPresent
          command: ["$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}/td-probe-connection${{system:tdk_exe_suffix}}"]
          args:
            - --shared-folder
            - $(CONTAINER_ROOT)/tabsdata/shared
            - --work-folder
            - $(CONTAINER_ROOT)/tabsdata/work
            - --logging-configuration
            - $(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.py.yaml
            - --liveness
            - $(CONTAINER_ROOT)/tabsdata/liveness/liveness
            - --responder-url
            - env:SECRET__TD_RESPONDER_URL
            - --responder-method
            - env:SECRET__TD_RESPONDER_METHOD
            - --responder-authorization
            - env:SECRET__TD_RESPONDER_AUTHORIZATION
            - --journal-file
            - $(CONTAINER_ROOT)/tabsdata/shared/journal/journal.yaml
            - --connection-file
            - $(CONTAINER_ROOT)/tabsdata/connection/connection.yaml
            - --request
            - $(CONTAINER_ROOT)/tabsdata/probe/request.json
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONTAINER_ROOT
              value: "$(KM_CONTAINER_ROOT)"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_TABSDATA_INSTANCE
              value: "${{system:tdk_instance_name}}"
            - name: TD_LOG_CONFIG
              value: "$(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.rs.yaml"
            - name: TD_BEFORE_PATH
              value: "$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}"
            - name: TD_AFTER_PATH
              value: ""
          envFrom:
            - secretRef:
                name: ${{system:tdk_connection_secret_name}}
          volumeMounts:
            - name: config-probe
              mountPath: /tabsdata/config
              readOnly: true
            - name: connection
              mountPath: /tabsdata/connection
              readOnly: true
            - name: probe-request
              mountPath: /tabsdata/probe
              readOnly: true
            - name: pyenv
              mountPath: /tabsdata/pyenv
              readOnly: true
            - name: shared
              mountPath: /tabsdata/shared
      volumes:
        - name: config-probe
          projected:
            sources:
              - configMap:
                  name: td-app-tabsdata-config-tabsdata.log.py.yaml
              - configMap:
                  name: td-app-tabsdata-config-tabsdata.log.rs.yaml
        - name: connection
          projected:
            sources:
              - configMap:
                  name: ${{system:tdk_connection_configmap_name}}
                  items:
                    - key: connection.yaml
                      path: connection.yaml
        - name: probe-request
          projected:
            sources:
              - configMap:
                  name: ${{system:tdk_probe_request_configmap_name}}
                  items:
                    - key: request.json
                      path: request.json
        - name: pyenv
          hostPath:
            path: "${{system:tdk_pyenv_fn_root}}"
        - name: shared
          emptyDir: {}
