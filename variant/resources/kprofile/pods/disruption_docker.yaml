apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aut-services
  namespace: ${{system:tdk_namespace_name}}
  annotations:
    tabsdata.com/description: "Protects the long running tabsdata pods from voluntary eviction"
  labels:
    app.kubernetes.io/name: tabsdata
    app.kubernetes.io/instance: tabsdata
    app.kubernetes.io/version: "${{system:tdk_tabsdata_version}}"
    app.kubernetes.io/component: apiserver
    app.kubernetes.io/part-of: tabsdata
    app.kubernetes.io/managed-by: tdkserver
    tabsdata.com/tier: authorization
spec:
  minAvailable: 100%
  selector:
    matchLabels:
      app.kubernetes.io/name: tabsdata
      app.kubernetes.io/part-of: tabsdata
      tabsdata.com/tier: regular
