apiVersion: batch/v1
kind: Job
metadata:
  name: td-pymanager
  namespace: default
  annotations:
    tabsdata.com/description: "Tabsdata pymanager"
    kubernetes.io/change-cause: ""
  labels:
    app.kubernetes.io/name: tabsdata
    app.kubernetes.io/instance: tabsdata
    app.kubernetes.io/version: "2.0.0"
    app.kubernetes.io/component: pymanager
    app.kubernetes.io/part-of: tabsdata
    app.kubernetes.io/managed-by: tdkserver
    tabsdata.com/tier: setup
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tabsdata
        app.kubernetes.io/instance: tabsdata
        app.kubernetes.io/component: pymanager
        app.kubernetes.io/part-of: tabsdata
        app.kubernetes.io/managed-by: tdkserver
    spec:
      restartPolicy: Never
      nodeName: tdknode
      serviceAccountName: default
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      dnsPolicy: ClusterFirst
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: venvbuilder
        image: /dev/null
        imagePullPolicy: IfNotPresent
        command: ["$(CONTAINER_ROOT)/tabsdata/assets/venvbuilder.sh"]
        args:
        - --help
#       - --output
#       - $(CONTAINER_ROOT)/tabsdata/runtimes
#       - --storage-config
#       - $(CONTAINER_ROOT)/tabsdata/config/apiserver.storage.yaml
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        env:
        - name: CONTAINER_ROOT
          value: "$(KM_CONTAINER_ROOT)"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_TABSDATA_INSTANCE
          value: "${{system:tdk_instance_name}}"
        - name: TD_LOG_CONFIG
          value: "$(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.rs.yaml"
        envFrom:
        - secretRef:
            name: td-app-apiserver-secret-config-apiserver.storage.yaml
          prefix: SECRETS__
        volumeMounts:
        - name: assets
          mountPath: /tabsdata/assets
          readOnly: true
        - name: config
          mountPath: /tabsdata/config
          readOnly: true
        - name: runtimes
          mountPath: /tabsdata/runtimes
      volumes:
      - name: assets
        projected:
          defaultMode: 493
          sources:
          - configMap:
              name: td-app-venvbuilder-asset-venvbuilder.sh
      - name: config
        projected:
          sources:
          - configMap:
              name: td-app-apiserver-config-apiserver.storage.yaml
          - configMap:
              name: td-app-tabsdata-config-tabsdata.log.rs.yaml
      - name: runtimes
        emptyDir: {}
