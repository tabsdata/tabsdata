apiVersion: batch/v1
kind: Job
metadata:
  name: td-inspector
  namespace: tabsdata
  annotations:
    tabsdata.com/description: "Tabsdata inspector init job"
    kubernetes.io/change-cause: ""
  labels:
    app.kubernetes.io/name: tabsdata
    app.kubernetes.io/instance: tabsdata
    app.kubernetes.io/version: "2.0.0"
    app.kubernetes.io/component: inspector
    app.kubernetes.io/part-of: tabsdata
    app.kubernetes.io/managed-by: tdkserver
    tabsdata.com/worker-tier: init
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tabsdata
        app.kubernetes.io/instance: tabsdata
        app.kubernetes.io/version: "2.0.0"
        app.kubernetes.io/component: inspector
        app.kubernetes.io/part-of: tabsdata
        app.kubernetes.io/managed-by: tdkserver
        tabsdata.com/worker-tier: init
    spec:
      restartPolicy: Never
      serviceAccountName: default
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      dnsPolicy: ClusterFirst
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        # runAsUser: 1000     # enable after confirming image's USER and filesystem ownership
        # runAsGroup: 1000    # enable together with runAsUser
        # fsGroup: 1000       # only relevant once Pod has volumes
      containers:
        - name: inspector
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -e
              for family in pods configs; do
                dir="/tabsdata/configmaps/${family}"
                echo "Reading mounted configmap family '${family}' under ${dir}"
                for f in "${dir}"/*; do
                  [ -f "$f" ] || continue
                  printf '[inspector]   %s/%s = %s\n' "${family}" "$(basename "$f")" "$(cat "$f")"
                done
              done
              echo "Done!"
          resources:
            requests:
              cpu: "100m"
              memory: "4Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # readOnlyRootFilesystem: true   # enable after mapping writable paths to emptyDir mounts
          volumeMounts:
            - name: configmap-pods
              mountPath: /tabsdata/configmaps/pods
              readOnly: true
            - name: configmap-configs
              mountPath: /tabsdata/configmaps/configs
              readOnly: true
      volumes:
        - name: configmap-pods
          projected:
            sources:
              - configMap:
                  name: tabsdata-pods-apiserver.yaml
              - configMap:
                  name: tabsdata-pods-crontrigger.yaml
              - configMap:
                  name: tabsdata-pods-function.yaml
              - configMap:
                  name: tabsdata-pods-inspector.yaml
              - configMap:
                  name: tabsdata-pods-stagetrigger.yaml
        - name: configmap-configs
          projected:
            sources:
              - configMap:
                  name: tabsdata-configs-apiserver.yaml
              - configMap:
                  name: tabsdata-configs-apiserver.log.yaml
              - configMap:
                  name: tabsdata-configs-tabsdata.yaml
