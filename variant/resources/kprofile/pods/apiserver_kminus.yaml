apiVersion: apps/v1
kind: Deployment
metadata:
  name: srv-apiserver
  namespace: ${{system:tdk_namespace_name}}
  annotations:
    tabsdata.com/description: "Tabsdata apiserver worker"
    kubernetes.io/change-cause: ""
  labels:
    app.kubernetes.io/name: tabsdata
    app.kubernetes.io/instance: tabsdata
    app.kubernetes.io/version: "2.0.0"
    app.kubernetes.io/component: apiserver
    app.kubernetes.io/part-of: tabsdata
    app.kubernetes.io/managed-by: tdkserver
    tabsdata.com/tier: regular
spec:
  replicas: 1
  # Recreate: the pod binds fixed host ports, so two generations must never overlap.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tabsdata
      app.kubernetes.io/instance: tabsdata
      app.kubernetes.io/component: apiserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tabsdata
        app.kubernetes.io/instance: tabsdata
        app.kubernetes.io/version: "2.0.0"
        app.kubernetes.io/component: apiserver
        app.kubernetes.io/part-of: tabsdata
        app.kubernetes.io/managed-by: tdkserver
        tabsdata.com/tier: regular
    spec:
      restartPolicy: Always
      nodeName: tdknode
      tolerations:
        - key: virtual-kubelet.io/provider
          operator: Exists
          effect: NoSchedule
      serviceAccountName: default
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      dnsPolicy: ClusterFirst
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: 0000-dbready
          image: /dev/null
          imagePullPolicy: IfNotPresent
          command: ["$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}/td_dbready${{system:tdk_exe_suffix}}"]
          args:
            - --config-file
            - $(CONTAINER_ROOT)/tabsdata/config/apiserver.database.yaml
            - --log-config-py
            - $(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.py.yaml
            - --log-config-rs
            - $(CONTAINER_ROOT)/tabsdata/config/apiserver.log.yaml
            - --timeout
            - "600"
            - --interval
            - "2"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
              ephemeral-storage: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONTAINER_ROOT
              value: "$(KM_CONTAINER_ROOT)"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_TABSDATA_INSTANCE
              value: "${{system:tdk_instance_name}}"
            - name: TD_BEFORE_PATH
              value: "$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}"
            - name: TD_AFTER_PATH
              value: ""
          volumeMounts:
            - name: config
              mountPath: /tabsdata/config
              readOnly: true
            - name: pyenv
              mountPath: /tabsdata/pyenv
              readOnly: true
        - name: 0010-conn-resources-extractor
          image: /dev/null
          imagePullPolicy: IfNotPresent
          command: ["$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}/td_conn_resources_extractor${{system:tdk_exe_suffix}}"]
          args:
            - --output-dir
            - $(CONTAINER_ROOT)/tabsdata/resources/ui/connectors
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
              ephemeral-storage: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONTAINER_ROOT
              value: "$(KM_CONTAINER_ROOT)"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_TABSDATA_INSTANCE
              value: "${{system:tdk_instance_name}}"
            - name: TD_BEFORE_PATH
              value: "$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}"
            - name: TD_AFTER_PATH
              value: ""
          volumeMounts:
            - name: pyenv
              mountPath: /tabsdata/pyenv
              readOnly: true
            - name: resources
              mountPath: /tabsdata/resources
      containers:
        - name: 1000-apiserver
          image: /dev/null
          imagePullPolicy: IfNotPresent
          command: ["$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}/td_apiserver${{system:tdk_exe_suffix}}"]
          args:
            - --config-file
            - $(CONTAINER_ROOT)/tabsdata/config/apiserver.service.yaml
            - --config-file
            - $(CONTAINER_ROOT)/tabsdata/config/apiserver.database.yaml
            - --config-file
            - $(CONTAINER_ROOT)/tabsdata/config/apiserver.storage.yaml
            - --log-config
            - $(CONTAINER_ROOT)/tabsdata/config/apiserver.log.yaml
            - --resources-folder
            - $(CONTAINER_ROOT)/tabsdata/resources
          ports:
            - name: public-http
              containerPort: ${{system:tdk_apiserver_public_port}}
              protocol: TCP
            - name: private-http
              containerPort: ${{system:tdk_apiserver_private_port}}
              protocol: TCP
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
              ephemeral-storage: "4Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /tabsdata/config
              readOnly: true
            - name: settings
              mountPath: /tabsdata/settings
              readOnly: true
            - name: pyenv
              mountPath: /tabsdata/pyenv
              readOnly: true
            - name: resources
              mountPath: /tabsdata/resources
              readOnly: true
          env:
            - name: CONTAINER_ROOT
              value: "$(KM_CONTAINER_ROOT)"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
            - name: POD_TABSDATA_INSTANCE
              value: "${{system:tdk_instance_name}}"
            - name: TDK_KUBECONFIG
              valueFrom:
                secretKeyRef:
                  name: td-sys-tabsdata-secret-kubeconfig
                  key: kubeconfig
            - name: TD_BEFORE_PATH
              value: "$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}"
            - name: TD_AFTER_PATH
              value: ""
      volumes:
        - name: config
          projected:
            sources:
              - configMap:
                  name: td-app-apiserver-config-apiserver.service.yaml
              - configMap:
                  name: td-app-apiserver-config-apiserver.database.yaml
              - configMap:
                  name: td-app-apiserver-config-apiserver.storage.yaml
              - configMap:
                  name: td-app-apiserver-config-apiserver.log.yaml
              - configMap:
                  name: td-app-tabsdata-config-tabsdata.log.py.yaml
              - configMap:
                  name: td-app-tabsdata-config-tabsdata.yaml
        - name: settings
          configMap:
            name: td-sys-tabsdata-settings-settings.json
        - name: pyenv
          hostPath:
            path: "${{system:tdk_pyenv_td_root}}"
        - name: resources
          emptyDir: {}
