apiVersion: batch/v1
kind: Job
metadata:
  name: td-venvloader
  namespace: ${{system:tdk_namespace_name}}
  annotations:
    tabsdata.com/description: "Tabsdata venvloader init job"
    kubernetes.io/change-cause: ""
  labels:
    app.kubernetes.io/name: tabsdata
    app.kubernetes.io/instance: tabsdata
    app.kubernetes.io/version: "2.0.0"
    app.kubernetes.io/component: venvloader
    app.kubernetes.io/part-of: tabsdata
    app.kubernetes.io/managed-by: tdkserver
    tabsdata.com/tier: init
    tabsdata.com/sequence: "20"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tabsdata
        app.kubernetes.io/instance: tabsdata
        app.kubernetes.io/version: "2.0.0"
        app.kubernetes.io/component: venvloader
        app.kubernetes.io/part-of: tabsdata
        app.kubernetes.io/managed-by: tdkserver
        tabsdata.com/tier: init
    spec:
      restartPolicy: Never
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
          effect: NoSchedule
      serviceAccountName: default
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      dnsPolicy: ClusterFirst
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: 1000-venvloader
        image: python:3.12-slim
        imagePullPolicy: IfNotPresent
        command: ["bash"]
        args:
        - $(CONTAINER_ROOT)/tabsdata/assets/venvloader.sh
        - --output
        - ${{system:tdk_runtimes_root}}
        - --image
        - tdvenvs-${{system:tdk_cluster_name}}-${{system:tdk_namespace_name}}.tar.zst
        - --venv
        - td
        - --storage-config
        - $(CONTAINER_ROOT)/tabsdata/config/apiserver.storage.yaml
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
            ephemeral-storage: "16Gi"
        env:
        - name: CONTAINER_ROOT
          value: ""
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_TABSDATA_INSTANCE
          value: "${{system:tdk_instance_name}}"
        - name: TD_LOG_CONFIG
          value: "$(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.rs.yaml"
        envFrom:
        - secretRef:
            name: td-app-apiserver-secret-config-apiserver.storage.yaml
          prefix: SECRETS__
        volumeMounts:
        - name: assets
          mountPath: /tabsdata/assets
          readOnly: true
        - name: config
          mountPath: /tabsdata/config
          readOnly: true
        - name: runtimes
          mountPath: ${{system:tdk_runtimes_root}}
      volumes:
      - name: assets
        projected:
          defaultMode: 493
          sources:
          - configMap:
              name: td-app-venvloader-asset-venvloader.sh
          - configMap:
              name: td-app-venvloader-asset-venvloader.py
      - name: config
        projected:
          sources:
          - configMap:
              name: td-app-apiserver-config-apiserver.storage.yaml
          - configMap:
              name: td-app-tabsdata-config-tabsdata.log.rs.yaml
      - name: runtimes
        emptyDir: {}
