apiVersion: batch/v1
kind: CronJob
metadata:
  name: td-cron-publisher
  namespace: ${{system:tdk_namespace_name}}
  annotations:
    tabsdata.com/description: "Tabsdata cron publisher worker"
    kubernetes.io/change-cause: ""
  labels:
    app.kubernetes.io/name: tabsdata
    app.kubernetes.io/instance: tabsdata
    app.kubernetes.io/version: "2.0.1"
    app.kubernetes.io/component: cron-publisher
    app.kubernetes.io/part-of: tabsdata
    app.kubernetes.io/managed-by: tdkserver
    tabsdata.com/tier: ephemeral
    tabsdata.com/decorator: cron_publisher
    tabsdata.com/worker: function
spec:
  schedule: "${{system:tdk_cron_schedule}}"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 100
  suspend: false
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: tabsdata
        app.kubernetes.io/instance: tabsdata
        app.kubernetes.io/version: "2.0.1"
        app.kubernetes.io/component: cron-publisher
        app.kubernetes.io/part-of: tabsdata
        app.kubernetes.io/managed-by: tdkserver
        tabsdata.com/tier: ephemeral
        tabsdata.com/decorator: cron_publisher
        tabsdata.com/worker: function
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: tabsdata
            app.kubernetes.io/instance: tabsdata
            app.kubernetes.io/version: "2.0.1"
            app.kubernetes.io/component: cron-publisher
            app.kubernetes.io/part-of: tabsdata
            app.kubernetes.io/managed-by: tdkserver
            tabsdata.com/tier: ephemeral
            tabsdata.com/decorator: cron_publisher
            tabsdata.com/worker: function
        spec:
          restartPolicy: Never
          serviceAccountName: default
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 60
          dnsPolicy: ClusterFirst
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: 0000-cabundle
              image: curlimages/curl:8.11.1
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c"]
              args:
              - |
                set -eu
                curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
                   --output /tabsdata/certs/ca-public.pem https://curl.se/ca/cacert.pem
                curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
                   --output /tabsdata/certs/ca.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
              - name: certs
                mountPath: /tabsdata/certs
            - name: 0010-venvloader
              image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
              imagePullPolicy: IfNotPresent
              command: ["bash"]
              args:
                - $(CONTAINER_ROOT)/tabsdata/assets/venvloader.sh
                - --output
                - ${{system:tdk_runtimes_root}}
                - --image
                - tdvenvs-${{system:tdk_cluster_name}}-${{system:tdk_namespace_name}}.tar.zst
                - --venv
                - fn
                - --storage-config
                - $(CONTAINER_ROOT)/tabsdata/config-storage/apiserver.storage.yaml
              env:
                - name: CONTAINER_ROOT
                  value: ""
              envFrom:
                - secretRef:
                    name: td-app-apiserver-secret-config-apiserver.storage.yaml
                  prefix: SECRETS__
              volumeMounts:
                - name: assets
                  mountPath: /tabsdata/assets
                  readOnly: true
                - name: config-storage
                  mountPath: /tabsdata/config-storage
                  readOnly: true
                - name: runtimes
                  mountPath: /tabsdata/runtimes
          containers:
            - name: 1000-cron-publisher
              image: ubuntu:24.04
              imagePullPolicy: IfNotPresent
              command: ["${{system:tdk_pyenv_fn_root}}/bin/td_run_cron_trigger"]
              args:
                - --shared-dir
                - $(CONTAINER_ROOT)/tabsdata/shared
                - --work-dir
                - $(CONTAINER_ROOT)/tabsdata/work
                - --log-config
                - $(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.py.yaml
                - --liveness
                - $(CONTAINER_ROOT)/tabsdata/liveness/liveness
                - --responder-url
                - env:SECRET__TD_RESPONDER_URL
                - --responder-method
                - env:SECRET__TD_RESPONDER_METHOD
                - --responder-authorization
                - env:SECRET__TD_RESPONDER_AUTHORIZATION
                - --journal-file
                - $(CONTAINER_ROOT)/tabsdata/shared/journal/journal.yaml
                - --trigger-url
                - env:SECRET__TD_TRIGGER_URL
                - --trigger-method
                - env:SECRET__TD_TRIGGER_METHOD
                - --trigger-authorization
                - env:SECRET__TD_TRIGGER_AUTHORIZATION
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: CONTAINER_ROOT
                  value: ""
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: POD_TABSDATA_INSTANCE
                  value: "${{system:tdk_instance_name}}"
                - name: TD_LOG_CONFIG
                  value: "$(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.rs.yaml"
                - name: SSL_CERT_FILE
                  value: "/tabsdata/certs/ca-public.pem"
                - name: TD_BEFORE_PATH
                  value: "${{system:tdk_pyenv_fn_root}}/${{system:tdk_pyenv_scripts_folder}}"
                - name: TD_AFTER_PATH
                  value: ""
              volumeMounts:
                - name: config-cron-publisher
                  mountPath: /tabsdata/config
                  readOnly: true
                - name: runtimes
                  mountPath: /tabsdata/runtimes
                  readOnly: true
                - name: shared
                  mountPath: /tabsdata/shared
                - name: certs
                  mountPath: /tabsdata/certs
                  readOnly: true
                - name: liveness
                  mountPath: /tabsdata/liveness
                - name: work
                  mountPath: /tabsdata/work
          volumes:
            - name: certs
              emptyDir: {}
            - name: config-cron-publisher
              projected:
                sources:
                  - configMap:
                      name: td-app-tabsdata-config-tabsdata.log.py.yaml
                  - configMap:
                      name: td-app-tabsdata-config-tabsdata.log.rs.yaml
            - name: assets
              projected:
                defaultMode: 493
                sources:
                  - configMap:
                      name: td-app-venvloader-asset-venvloader.sh
                  - configMap:
                      name: td-app-venvloader-asset-venvloader.py
            - name: config-storage
              projected:
                sources:
                  - configMap:
                      name: td-app-apiserver-config-apiserver.storage.yaml
            - name: runtimes
              emptyDir: {}
            - name: shared
              emptyDir: {}
            - name: liveness
              emptyDir: {}
            - name: work
              emptyDir: {}
