apiVersion: batch/v1
kind: Job
metadata:
  name: td-dbmanager
  namespace: ${{system:tdk_namespace_name}}
  annotations:
    tabsdata.com/description: "Tabsdata dbmanager"
    kubernetes.io/change-cause: ""
  labels:
    app.kubernetes.io/name: tabsdata
    app.kubernetes.io/instance: tabsdata
    app.kubernetes.io/version: "2.0.0"
    app.kubernetes.io/component: dbmanager
    app.kubernetes.io/part-of: tabsdata
    app.kubernetes.io/managed-by: tdkserver
    tabsdata.com/tier: setup
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tabsdata
        app.kubernetes.io/instance: tabsdata
        app.kubernetes.io/component: dbmanager
        app.kubernetes.io/part-of: tabsdata
        app.kubernetes.io/managed-by: tdkserver
    spec:
      restartPolicy: Never
      serviceAccountName: default
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      dnsPolicy: ClusterFirst
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: dbcreate
        image: tabsdata/kube/tabsdata:2.0.0
        imagePullPolicy: IfNotPresent
        command: ["$(CONTAINER_ROOT)/tabsdata/pyenv/bin/td_dbmanager"]
        args:
        - db
        - create
        - --config-file
        - /tabsdata/config/apiserver.database.yaml
        - --config-file
        - /tabsdata/config/dbmanager.database.yaml
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        env:
        - name: CONTAINER_ROOT
          value: ""
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_TABSDATA_INSTANCE
          value: "${{system:tdk_instance_name}}"
        - name: TD_LOG_CONFIG
          value: "/tabsdata/config/tabsdata.log.rs.yaml"
        volumeMounts:
        - name: config
          mountPath: /tabsdata/config
          readOnly: true
      volumes:
      - name: config
        projected:
          sources:
          - configMap:
              name: td-app-apiserver-config-apiserver.database.yaml
          - configMap:
              name: td-app-dbmanager-config-dbmanager.database.yaml
          - configMap:
              name: td-app-tabsdata-config-tabsdata.log.rs.yaml
