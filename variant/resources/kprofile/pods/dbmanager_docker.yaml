apiVersion: batch/v1
kind: Job
metadata:
  name: ins-dbmanager
  namespace: ${{system:tdk_namespace_name}}
  annotations:
    tabsdata.com/description: "Tabsdata dbmanager"
    kubernetes.io/change-cause: ""
  labels:
    app.kubernetes.io/name: tabsdata
    app.kubernetes.io/instance: tabsdata
    app.kubernetes.io/version: "2.0.1"
    app.kubernetes.io/component: dbmanager
    app.kubernetes.io/part-of: tabsdata
    app.kubernetes.io/managed-by: tdkserver
    tabsdata.com/tier: setup
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tabsdata
        app.kubernetes.io/instance: tabsdata
        app.kubernetes.io/component: dbmanager
        app.kubernetes.io/part-of: tabsdata
        app.kubernetes.io/managed-by: tdkserver
    spec:
      restartPolicy: Never
      serviceAccountName: default
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      dnsPolicy: ClusterFirst
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: 0000-cabundle
        image: curlimages/curl:8.11.1
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c"]
        args:
        - |
          set -eu
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
             --output /tabsdata/certs/ca-public.pem https://curl.se/ca/cacert.pem
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
             --output /tabsdata/certs/ca.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: certs
          mountPath: /tabsdata/certs
      - name: 0010-venvloader
        image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
        imagePullPolicy: IfNotPresent
        command: ["bash"]
        args:
        - $(CONTAINER_ROOT)/tabsdata/assets/venvloader.sh
        - --output
        - ${{system:tdk_runtimes_root}}
        - --venv
        - td
        - --storage-config
        - $(CONTAINER_ROOT)/tabsdata/config/apiserver.storage.yaml
        env:
        - name: CONTAINER_ROOT
          value: ""
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_TABSDATA_INSTANCE
          value: "${{system:tdk_instance_name}}"
        envFrom:
        - secretRef:
            name: td-app-apiserver-secret-config-apiserver.storage.yaml
          prefix: SECRETS__
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: storage
          mountPath: /tabsdata/repository/storage
        - name: assets
          mountPath: /tabsdata/assets
          readOnly: true
        - name: config
          mountPath: /tabsdata/config
          readOnly: true
        - name: runtimes
          mountPath: /tabsdata/runtimes
      containers:
      - name: 1000-dbcreate
        image: ubuntu:24.04
        imagePullPolicy: IfNotPresent
        command: ["${{system:tdk_pyenv_td_root}}/bin/td_dbmanager"]
        args:
        - db
        - create
        - --config-file
        - /tabsdata/config/apiserver.database.yaml
        - --config-file
        - /tabsdata/config/dbmanager.database.yaml
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        env:
        - name: CONTAINER_ROOT
          value: ""
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_TABSDATA_INSTANCE
          value: "${{system:tdk_instance_name}}"
        - name: TD_LOG_CONFIG
          value: "/tabsdata/config/tabsdata.log.rs.yaml"
        - name: SSL_CERT_FILE
          value: "/tabsdata/certs/ca-public.pem"
        - name: TD_BEFORE_PATH
          value: "${{system:tdk_pyenv_td_root}}/${{system:tdk_pyenv_scripts_folder}}"
        - name: TD_AFTER_PATH
          value: ""
        volumeMounts:
        - name: config
          mountPath: /tabsdata/config
          readOnly: true
        - name: runtimes
          mountPath: /tabsdata/runtimes
        - name: certs
          mountPath: /tabsdata/certs
          readOnly: true
      volumes:
      - name: storage
        hostPath:
          path: ${{system:tdk_storage_path}}
          type: DirectoryOrCreate
      - name: certs
        emptyDir: {}
      - name: assets
        projected:
          defaultMode: 493
          sources:
          - configMap:
              name: td-app-venvloader-asset-venvloader.sh
          - configMap:
              name: td-app-venvloader-asset-venvloader.py
      - name: config
        projected:
          sources:
          - configMap:
              name: td-app-apiserver-config-apiserver.storage.yaml
          - configMap:
              name: td-app-apiserver-config-apiserver.database.yaml
          - configMap:
              name: td-app-dbmanager-config-dbmanager.database.yaml
          - configMap:
              name: td-app-tabsdata-config-tabsdata.log.rs.yaml
      - name: runtimes
        emptyDir: {}
