apiVersion: batch/v1
kind: Job
metadata:
  name: td-dbmanager
  namespace: ${{system:tdk_namespace_name}}
  annotations:
    tabsdata.com/description: "Tabsdata dbmanager"
    kubernetes.io/change-cause: ""
  labels:
    app.kubernetes.io/name: tabsdata
    app.kubernetes.io/instance: tabsdata
    app.kubernetes.io/version: "2.0.0"
    app.kubernetes.io/component: dbmanager
    app.kubernetes.io/part-of: tabsdata
    app.kubernetes.io/managed-by: tdkserver
    tabsdata.com/tier: setup
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tabsdata
        app.kubernetes.io/instance: tabsdata
        app.kubernetes.io/component: dbmanager
        app.kubernetes.io/part-of: tabsdata
        app.kubernetes.io/managed-by: tdkserver
    spec:
      restartPolicy: Never
      serviceAccountName: default
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      dnsPolicy: ClusterFirst
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: venvloader
        image: python:3.12-slim
        imagePullPolicy: IfNotPresent
        command: ["bash"]
        args:
        - $(CONTAINER_ROOT)/tabsdata/assets/venvloader.sh
        - --output
        - ${{system:tdk_runtimes_root}}
        - --storage-config
        - $(CONTAINER_ROOT)/tabsdata/config/apiserver.storage.yaml
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
            ephemeral-storage: "4Gi"
        env:
        - name: CONTAINER_ROOT
          value: ""
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_TABSDATA_INSTANCE
          value: "${{system:tdk_instance_name}}"
        envFrom:
        - secretRef:
            name: td-app-apiserver-secret-config-apiserver.storage.yaml
          prefix: SECRETS__
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: assets
          mountPath: /tabsdata/assets
          readOnly: true
        - name: config
          mountPath: /tabsdata/config
          readOnly: true
        - name: runtimes
          mountPath: ${{system:tdk_runtimes_root}}
      containers:
      - name: dbcreate
        image: ubuntu:24.04
        imagePullPolicy: IfNotPresent
        command: ["${{system:tdk_pyenv_td_root}}/bin/td_dbmanager"]
        args:
        - db
        - create
        - --config-file
        - /tabsdata/config/apiserver.database.yaml
        - --config-file
        - /tabsdata/config/dbmanager.database.yaml
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
            ephemeral-storage: "4Gi"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        env:
        - name: PATH
          value: "${{system:tdk_pyenv_td_root}}/bin:/usr/local/bin:/usr/bin:/bin"
        - name: CONTAINER_ROOT
          value: ""
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_TABSDATA_INSTANCE
          value: "${{system:tdk_instance_name}}"
        - name: TD_LOG_CONFIG
          value: "/tabsdata/config/tabsdata.log.rs.yaml"
        volumeMounts:
        - name: config
          mountPath: /tabsdata/config
          readOnly: true
        - name: runtimes
          mountPath: ${{system:tdk_runtimes_root}}
      volumes:
      - name: assets
        projected:
          defaultMode: 493
          sources:
          - configMap:
              name: td-app-venvloader-asset-venvloader.sh
          - configMap:
              name: td-app-venvloader-asset-venvloader.py
      - name: config
        projected:
          sources:
          - configMap:
              name: td-app-apiserver-config-apiserver.storage.yaml
          - configMap:
              name: td-app-apiserver-config-apiserver.database.yaml
          - configMap:
              name: td-app-dbmanager-config-dbmanager.database.yaml
          - configMap:
              name: td-app-tabsdata-config-tabsdata.log.rs.yaml
      - name: runtimes
        emptyDir: {}
