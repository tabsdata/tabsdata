apiVersion: batch/v1
kind: CronJob
metadata:
  name: td-heartbeat-alpha
  namespace: default
  annotations:
    tabsdata.com/description: "Tabsdata heartbeat alpha test cronjob"
    kubernetes.io/change-cause: ""
  labels:
    app.kubernetes.io/name: tabsdata
    app.kubernetes.io/instance: tabsdata
    app.kubernetes.io/version: "2.0.0"
    app.kubernetes.io/component: heartbeat-alpha
    app.kubernetes.io/part-of: tabsdata
    app.kubernetes.io/managed-by: tdkserver
    tabsdata.com/tier: regular
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 100
  suspend: false
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: tabsdata
        app.kubernetes.io/instance: tabsdata
        app.kubernetes.io/version: "2.0.0"
        app.kubernetes.io/component: heartbeat-alpha
        app.kubernetes.io/part-of: tabsdata
        app.kubernetes.io/managed-by: tdkserver
        tabsdata.com/tier: regular
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: tabsdata
            app.kubernetes.io/instance: tabsdata
            app.kubernetes.io/version: "2.0.0"
            app.kubernetes.io/component: heartbeat-alpha
            app.kubernetes.io/part-of: tabsdata
            app.kubernetes.io/managed-by: tdkserver
            tabsdata.com/tier: regular
        spec:
          restartPolicy: Never
          nodeName: tdknode
          serviceAccountName: default
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 30
          dnsPolicy: ClusterFirst
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: heartbeat-alpha
              image: /dev/null
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c", "echo \"heartbeat-alpha tick at $(date -u +%Y-%m-%dT%H:%M:%SZ)\""]
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
