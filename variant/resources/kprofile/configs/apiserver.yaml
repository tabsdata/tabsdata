addresses:
  - 0.0.0.0:2457
internal_addresses:
  - 0.0.0.0:2458
password:
  algorithm: argon2id
  version: 19
  memory_cost_mib: 20
  time_cost: 2
  parallelism_cost: 1
jwt:
  secret: ${secret:jwt_signing_key}
  access_token_expiration: 3600
request_timeout: 60
orchestrator: kubernetes
database:
  # Embedded Postgres rooted at <instance>/repository/database/. Both
  # `tdkserver create` (host-side schema creation) and the runtime apiserver
  # pod must agree on this path; if it's left to postgresql_embedded's
  # default ($HOME/.theseus/...), the two sides diverge and the pod fails
  # with DatabaseSchemaDoesNotExist.
  #
  # To point at an external server instead, comment out data_dir/persistent
  # and set `url`. SQLite is supported when built with the `sqlite` feature
  # (`url: file:///path/to/tabsdata.db`).
  # url: postgres://user:pass@host:5432/tabsdata
  data_dir: ${sys:TDK_DATABASE_PATH}
  persistent: true
  username: ${secret:postgres_user}
  password: ${secret:postgres_password}
  min_connections: 1
  max_connections: 10
  acquire_timeout: 30
  max_lifetime: 3600
  idle_timeout: 60
  test_before_acquire: true
  log_level: off
storage:
  mounts:
    - id: ROOT
      path: /
      uri: ${sys:TDK_STORAGE_URL}data/
    # IMPORTANT: /bundles must be a local mount.
    - id: BUNDLES
      path: /bundles
      uri: ${sys:TDK_STORAGE_URL}bundles/
#    # Mount configuration sample:
#    - id: PREFIX
#      path: /foo
#      uri: ${sys:TDK_STORAGE_URL}data/
#      options:
#        - option_1: value1
#          option_2: value2
