addresses:
  - 0.0.0.0:2457
internal_addresses:
  - 0.0.0.0:2458
password:
  algorithm: argon2id
  version: 19
  memory_cost_mib: 20
  time_cost: 2
  parallelism_cost: 1
jwt:
  secret: ${secret:jwt_signing_key}
  access_token_expiration: 3600
request_timeout: 60
orchestrator: kubernetes
database:
  mode: embedded
  system:
    data_dir: ${sys:TDK_DATABASE_PATH}
    persistent: true
    schema: public
    username: ${secret:postgres_system_user}
    password: ${secret:postgres_password}
    min_connections: 1
    max_connections: 10
    acquire_timeout: 30
    max_lifetime: 3600
    idle_timeout: 60
    test_before_acquire: true
    log_level: off
  apiserver:
    schema: td_apiserver
    password: ${secret:postgres_password}
storage:
  mounts:
    - id: ROOT
      path: /
      uri: ${sys:TDK_STORAGE_URL}data/
    # IMPORTANT: /bundles must be a local mount.
    - id: BUNDLES
      path: /bundles
      uri: ${sys:TDK_STORAGE_URL}bundles/
#    # Mount configuration sample:
#    - id: PREFIX
#      path: /foo
#      uri: ${sys:TDK_STORAGE_URL}data/
#      options:
#        - option_1: value1
#          option_2: value2
