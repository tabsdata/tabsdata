storage:
  mounts:
  - id: ROOT
    path: /
    uri: ${{secret}}
    options:
      aws_region: ${{secret}}
      aws_access_key_id: ${{secret}}
      aws_secret_access_key: ${{secret}}
      google_service_account_key: ${{secret}}
      azure_storage_account_name: ${{secret}}
      azure_storage_account_key: ${{secret}}
  - id: BUNDLES
    path: /bundles
    uri: ${{secret}}
    options:
      aws_region: ${{secret}}
      aws_access_key_id: ${{secret}}
      aws_secret_access_key: ${{secret}}
      google_service_account_key: ${{secret}}
      azure_storage_account_name: ${{secret}}
      azure_storage_account_key: ${{secret}}
  - id: IMAGES
    path: /images
    uri: ${{secret}}
    options:
      aws_region: ${{secret}}
      aws_access_key_id: ${{secret}}
      aws_secret_access_key: ${{secret}}
      google_service_account_key: ${{secret}}
      azure_storage_account_name: ${{secret}}
      azure_storage_account_key: ${{secret}}
