# The privileged server connection and boot target, read only by td_dbmanager.
database_server:
  url: postgres://localhost:${{system:tdk_database_port}}/postgres
  username: ${{secretAuto:postgres_system_user}}
  password: ${{secretAuto:postgres_password}}
  min_connections: 1
  max_connections: 2
  acquire_timeout: 30
  max_lifetime: 1800
  idle_timeout: 30
  test_before_acquire: true
  log_level: off
