database:
  mode: sidecar
  system:
    data_dir: ${{system:tdk_database_path}}
    port: ${{system:tdk_database_port}}
    persistent: true
    username: ${{secretAuto:postgres_system_user}}
    password: ${{secretAuto:postgres_password}}
    min_connections: 1
    max_connections: 2
    acquire_timeout: 30
    max_lifetime: 1800
    idle_timeout: 30
    test_before_acquire: true
    log_level: off
  components:
    apiserver:
      schema: td_apiserver
      password: ${{secretAuto:postgres_password}}
      min_connections: 1
      max_connections: 10
      acquire_timeout: 30
      max_lifetime: 3600
      idle_timeout: 60
      test_before_acquire: true
      log_level: off
