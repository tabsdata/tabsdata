pods:
  global:
    # Every entry here is injected as an environment variable into every
    # container of every pod, replacing any value a container declares for the
    # same name, so these are overrides rather than defaults.
    envs:
      UV_DEFAULT_INDEX: https://pypi.org/simple/
      UV_INDEX:
      UV_INDEX_STRATEGY: unsafe-best-match
      UV_HTTP_RETRIES: 16
      UV_HTTP_TIMEOUT: 60
      UV_HTTP_CONNECT_TIMEOUT: 60

    # Seconds a finished job is kept, with its pods and their logs, before
    # the cluster removes it, for every job and cron job tabsdata creates.
    # It sets spec.ttlSecondsAfterFinished of the job descriptors under pods
    # (spec.jobTemplate.spec.ttlSecondsAfterFinished for cron jobs); empty
    # keeps the value each descriptor sets there.
    ttl_seconds_after_finished:

  # Sizing and placement. These values are what tabsdata applies: the pod
  # descriptors carry none of their own, so what is written here is what the
  # cluster receives.
  #
  # `service` covers the pods that run alongside the instance. Its own resources
  # and placement apply to every service pod; the named entries below override
  # them for one component each.
  #
  # `function` covers the pods created per execution: publishers, transformers,
  # subscribers, crons and streams.
  #
  # `probe` covers the connection-probe pods: one connector call (check,
  # metadata, sample) against one connection.
  #
  # `selectors` chooses which nodes a pod may land on; `tolerations` lets it onto
  # nodes that are otherwise reserved. A tolerations list replaces what tabsdata
  # would apply, so it must be complete.
  service:
    priority: tabsdata-service
    # dbmanager / pymanager / inspector / venvloader
    resources:
      cpu: "2"
      memory: 1Gi
      disk: 16Gi
    placement:
      selectors: {}
      tolerations: []
    apiserver:
      resources:
        cpu: "2"
        memory: 4Gi
        disk: 16Gi
      placement:
        selectors: {}
        tolerations: []
      # Annotations for the apiserver's service account. To serve worker logs
      # from CloudWatch once a worker's pod is gone, set
      # eks.amazonaws.com/role-arn to an IAM role allowed logs:DescribeLogStreams
      # and logs:GetLogEvents on the log group /tabsdata/<namespace>.
      service_account:
        annotations: {}

  function:
    priority: tabsdata-function
    resources:
      cpu: "1"
      memory: 16Gi
      disk: 64Gi
    placement:
      selectors: {}
      tolerations:
        - key: workload
          value: batch
          effect: NoSchedule
    dataflow:
      temporary_folder: /tabsdata/dataflow/temporary
      spill:
        enabled: true
        folder: /tabsdata/dataflow/spill
        memory_threshold_percent: 40
        disk_limit_percent: 80
      abort:
        memory_threshold_percent: 95

  probe:
    priority: tabsdata-function
    resources:
      cpu: 250m
      memory: 1Gi
      disk: 2Gi
    placement:
      selectors: {}
      tolerations:
        - key: workload
          value: batch
          effect: NoSchedule
