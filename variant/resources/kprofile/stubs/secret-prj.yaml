# Secrets of a project, for:
#
#   tdk project create --name NAME --secrets-file secret-prj.yaml
#   tdk project update --name NAME --secrets-file secret-prj.yaml
#
# Each top-level entry is a secret, and each of its entries a key with its
# value. Functions of the project read a value with ctx.secret("aws", "key1")
# or ctx.secret("aws.key1"); names and keys ignore case.
#
# Names and keys are letters and digits, starting with a letter, with single
# underscores between words (up to 63 characters).
#
# A value is either:
#
#   key: value                 the value itself; "" stores an empty value
#   key: $secret:VARIABLE      read from that environment variable when the
#                              tdk command runs; the value never touches
#                              this file
#   key:                       no value: keep the value already stored, or
#                              store an empty one when there is none
#
# Every update replaces all the secrets of the project: a secret or a key
# left out of the file is removed, and an empty file removes them all.
#
# Examples (uncomment and adapt):
#
# aws:
#   access_key_id: $secret:AWS_ACCESS_KEY_ID
#   secret_access_key: $secret:AWS_SECRET_ACCESS_KEY
#   region: eu-west-1
#
# warehouse:
#   user: etl
#   password:
#
# api:
#   token: $secret:API_TOKEN
