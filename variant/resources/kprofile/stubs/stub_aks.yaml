files:
  apiserver.storage:
    storage.mounts[id=ROOT]:
      uri: env:TDK_STORAGE_ROOT_URI
      options.azure_storage_account_name: env:AZURE_STORAGE_ACCOUNT_NAME
      options.azure_storage_account_key: env:AZURE_STORAGE_ACCOUNT_KEY
    storage.mounts[id=BUNDLES]:
      uri: env:TDK_STORAGE_BUNDLES_URI
      options.azure_storage_account_name: env:AZURE_STORAGE_ACCOUNT_NAME
      options.azure_storage_account_key: env:AZURE_STORAGE_ACCOUNT_KEY
    storage.mounts[id=IMAGES]:
      uri: env:TDK_STORAGE_IMAGES_URI
      options.azure_storage_account_name: env:AZURE_STORAGE_ACCOUNT_NAME
      options.azure_storage_account_key: env:AZURE_STORAGE_ACCOUNT_KEY
values:
  tdk_database_host: ""
  tdk_database_port: ""
  tdk_database_name: ""
  postgres_system_user: env:POSTGRES_SYSTEM_USER
  postgres_system_password: env:POSTGRES_SYSTEM_PASSWORD
