          to: 1
  tabsdata.yaml:
    tabsdata_aks.yaml:
      action: create
    tabsdata_docker.yaml:
      action: modify
      changes:
        - op: insert-child-if-missing
          leaf: pods.global.envs
          child: UV_DEFAULT_INDEX
          value: https://pypi.org/simple/
        - op: insert-child-if-missing
          leaf: pods.global.envs
          child: UV_INDEX
          value: null
        - op: insert-child-if-missing
          leaf: pods.global.envs
          child: UV_INDEX_STRATEGY
          value: unsafe-best-match
    tabsdata_eks.yaml:
      action: retain
    tabsdata_fargate.yaml:
