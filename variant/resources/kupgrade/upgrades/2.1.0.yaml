  dbmanager.database.yaml:
    dbmanager.database_aks.yaml:
      action: create
    dbmanager.database_docker.yaml:
      action: modify
      changes:
        - op: nest-children-if-flat
          leaf: database_server.pool
          under: admin
        - op: modify-leaf-value-if
          leaf: database_server.pool.admin.max_connections
          from: 2
          to: 1
    dbmanager.database_eks.yaml:
      action: modify
      changes:
        - op: nest-children-if-flat
          leaf: database_server.pool
          under: admin
