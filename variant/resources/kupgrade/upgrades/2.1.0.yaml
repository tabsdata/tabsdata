configs:
  apiserver.database.yaml:
    apiserver.database_aks.yaml:
      action: create
    apiserver.database_docker.yaml:
      action: modify
      changes:
        - op: nest-children-if-flat
          leaf: database.apiserver.pool
          under: regular
        - op: insert-sibling-if-existing
          leaf: database.apiserver.pool.regular
          sibling: exclusive
          placement: after
          value:
            min_connections: 1
            max_connections: 10
            acquire_timeout: 30
            max_lifetime: 3600
            idle_timeout: 60
            test_before_acquire: true
    apiserver.database_eks.yaml:
      action: modify
      changes:
        - op: nest-children-if-flat
          leaf: database.apiserver.pool
          under: regular
        - op: insert-sibling-if-existing
          leaf: database.apiserver.pool.regular
          sibling: exclusive
          placement: after
          value:
            min_connections: 1
            max_connections: 10
            acquire_timeout: 30
            max_lifetime: 3600
            idle_timeout: 60
            test_before_acquire: true
    apiserver.database_fargate.yaml:
      action: modify
      changes:
        - op: nest-children-if-flat
          leaf: database.apiserver.pool
          under: regular
        - op: insert-sibling-if-existing
          leaf: database.apiserver.pool.regular
          sibling: exclusive
          placement: after
          value:
            min_connections: 1
            max_connections: 10
            acquire_timeout: 30
            max_lifetime: 3600
            idle_timeout: 60
            test_before_acquire: true
    apiserver.database_gke.yaml:
      action: create
    apiserver.database_kminus.yaml:
      action: modify
      changes:
        - op: nest-children-if-flat
          leaf: database.apiserver.pool
          under: regular
        - op: insert-sibling-if-existing
          leaf: database.apiserver.pool.regular
          sibling: exclusive
          placement: after
          value:
            min_connections: 1
            max_connections: 10
            acquire_timeout: 30
            max_lifetime: 3600
            idle_timeout: 60
            test_before_acquire: true
