          child: options
          value: {}
  tabsdata.yaml:
    tabsdata_aks.yaml:
      action: modify
      changes:
        - op: insert-child-if-missing
          leaf: pods.global.envs
          child: UV_HTTP_RETRIES
          value: 16
        - op: insert-child-if-missing
          leaf: pods.global.envs
          child: UV_HTTP_TIMEOUT
          value: 60
        - op: insert-child-if-missing
          leaf: pods.global.envs
          child: UV_HTTP_CONNECT_TIMEOUT
          value: 60
        - op: insert-sibling-if-existing
          leaf: pods.function.placement
          sibling: dataflow
          placement: after
          value:
            temporary_folder: /tabsdata/dataflow/temporary
            spill:
              enabled: true
              folder: /tabsdata/dataflow/spill
              memory_threshold_percent: 40
              disk_limit_percent: 80
            abort:
              memory_threshold_percent: 95
