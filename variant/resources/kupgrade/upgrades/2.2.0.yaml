schema: 1
configs:
  apiserver.service.yaml:
    apiserver.service_aks.yaml:
      action: modify
      changes:
        - op: derive-item-if-missing
          leaf: addresses
          pattern: ^0\.0\.0\.0:(?<port>.+)$
          item: '[::]:${port}'
        - op: derive-item-if-missing
          leaf: internal_addresses
          pattern: ^0\.0\.0\.0:(?<port>.+)$
          item: '[::]:${port}'
