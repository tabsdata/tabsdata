            - name: dataflow
              mountPath: /tabsdata/dataflow
            - name: liveness
              mountPath: /tabsdata/liveness
            - name: runtimes
              mountPath: /tabsdata/runtimes
              readOnly: true
            - name: shared
              mountPath: /tabsdata/shared
            - name: work
              mountPath: /tabsdata/work
        - name: 0070-plan-input
          image: ubuntu:24.04
          imagePullPolicy: IfNotPresent
          command: ["${{system:tdk_pyenv_fn_root}}/bin/td-plan-input"]
