pods:
  global:
    # Every entry here is injected as an environment variable into every
    # container of every pod. A variable a container declares itself is left
    # alone, so these are defaults rather than overrides.
    envs:
      UV_INDEX: ""
      UV_DEFAULT_INDEX: https://pypi.org/simple/
      UV_INDEX_STRATEGY: unsafe-best-match

  # Sizing and placement. These values are what tabsdata applies: the pod
  # descriptors carry none of their own, so what is written here is what the
  # cluster receives.
  #
  # `service` covers the pods that run alongside the instance. Its own resources
  # and placement apply to every service pod; the named entries below override
  # them for one component each.
  #
  # `function` covers the pods created per execution: publishers, transformers,
  # subscribers, crons and streams.
  #
  # `selectors` chooses which nodes a pod may land on; `tolerations` lets it onto
  # nodes that are otherwise reserved. A tolerations list replaces what tabsdata
  # would apply, so it must be complete.
  service:
    priority: tabsdata-service
    # dbmanager / pymanager / inspector / venvloader
    resources:
      cpu: "2"
      memory: 1Gi
      disk: 16Gi
    placement:
      selectors: {}
      tolerations: []
    apiserver:
      resources:
        cpu: "2"
        memory: 4Gi
        disk: 16Gi
      placement:
        selectors: {}
        tolerations: []

  function:
    priority: tabsdata-function
    resources:
      cpu: "1"
      memory: 16Gi
      disk: 64Gi
    placement:
      selectors: {}
      tolerations:
        - key: workload
          value: batch
          effect: NoSchedule
