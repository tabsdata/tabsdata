apiVersion: batch/v1
kind: Job
metadata:
  name: td-stream-publisher
  namespace: ${{system:tdk_namespace_name}}
  annotations:
    tabsdata.com/description: "Tabsdata stream publisher worker"
    kubernetes.io/change-cause: ""
  labels:
    app.kubernetes.io/name: tabsdata
    app.kubernetes.io/instance: tabsdata
    app.kubernetes.io/version: "${{system:tdk_tabsdata_version}}"
    app.kubernetes.io/component: stream-publisher
    app.kubernetes.io/part-of: tabsdata
    app.kubernetes.io/managed-by: tdkserver
    tabsdata.com/tier: ephemeral
    tabsdata.com/decorator: stream_publisher
    tabsdata.com/worker: function
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tabsdata
        app.kubernetes.io/instance: tabsdata
        app.kubernetes.io/version: "${{system:tdk_tabsdata_version}}"
        app.kubernetes.io/component: stream-publisher
        app.kubernetes.io/part-of: tabsdata
        app.kubernetes.io/managed-by: tdkserver
        tabsdata.com/tier: ephemeral
        tabsdata.com/decorator: stream_publisher
        tabsdata.com/worker: function
    spec:
      restartPolicy: Never
      nodeName: tdknode
      serviceAccountName: default
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      dnsPolicy: ClusterFirst
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: 0000-begin-execution
          image: function
          imagePullPolicy: IfNotPresent
          command: ["$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}/td_begin_execution${{system:tdk_exe_suffix}}"]
          args:
            - --shared-dir
            - $(CONTAINER_ROOT)/tabsdata/shared
            - --work-dir
            - $(CONTAINER_ROOT)/tabsdata/work
            - --log-config
            - $(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.py.yaml
            - --liveness
            - $(CONTAINER_ROOT)/tabsdata/liveness/liveness
            - --responder-url
            - env:SECRET__TD_RESPONDER_URL
            - --responder-method
            - env:SECRET__TD_RESPONDER_METHOD
            - --responder-authorization
            - env:SECRET__TD_RESPONDER_AUTHORIZATION
            - --journal-file
            - $(CONTAINER_ROOT)/tabsdata/shared/journal/journal.yaml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONTAINER_ROOT
              value: "$(KM_CONTAINER_ROOT)"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_TABSDATA_INSTANCE
              value: "${{system:tdk_instance_name}}"
            - name: TD_LOG_CONFIG
              value: "$(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.rs.yaml"
            - name: TD_BEFORE_PATH
              value: "$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}"
            - name: TD_AFTER_PATH
              value: ""
          volumeMounts:
            - name: config-begin-execution
              mountPath: /tabsdata/config
              readOnly: true
            - name: pyenv
              mountPath: /tabsdata/pyenv
              readOnly: true
            - name: shared
              mountPath: /tabsdata/shared
        - name: 0010-fetch-request
          image: function
          imagePullPolicy: IfNotPresent
          command: ["$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}/td_fetch_request${{system:tdk_exe_suffix}}"]
          args:
            - --shared-dir
            - $(CONTAINER_ROOT)/tabsdata/shared
            - --work-dir
            - $(CONTAINER_ROOT)/tabsdata/work
            - --log-config
            - $(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.py.yaml
            - --liveness
            - $(CONTAINER_ROOT)/tabsdata/liveness/liveness
            - --responder-url
            - env:SECRET__TD_RESPONDER_URL
            - --responder-method
            - env:SECRET__TD_RESPONDER_METHOD
            - --responder-authorization
            - env:SECRET__TD_RESPONDER_AUTHORIZATION
            - --journal-file
            - $(CONTAINER_ROOT)/tabsdata/shared/journal/journal.yaml
            - --resolver-url
            - env:SECRET__TD_RESOLVER_URL
            - --resolver-method
            - env:SECRET__TD_RESOLVER_METHOD
            - --resolver-authorization
            - env:SECRET__TD_RESOLVER_AUTHORIZATION
            - --request-file
            - $(CONTAINER_ROOT)/tabsdata/shared/request/request.yaml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONTAINER_ROOT
              value: "$(KM_CONTAINER_ROOT)"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_TABSDATA_INSTANCE
              value: "${{system:tdk_instance_name}}"
            - name: TD_LOG_CONFIG
              value: "$(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.rs.yaml"
            - name: TD_BEFORE_PATH
              value: "$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}"
            - name: TD_AFTER_PATH
              value: ""
          volumeMounts:
            - name: config-fetch-request
              mountPath: /tabsdata/config
              readOnly: true
            - name: pyenv
              mountPath: /tabsdata/pyenv
              readOnly: true
            - name: shared
              mountPath: /tabsdata/shared
        - name: 0020-localize-fn-bundle
          image: function
          imagePullPolicy: IfNotPresent
          command: ["$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}/td_localize_fn_bundle${{system:tdk_exe_suffix}}"]
          args:
            - --shared-dir
            - $(CONTAINER_ROOT)/tabsdata/shared
            - --work-dir
            - $(CONTAINER_ROOT)/tabsdata/work
            - --log-config
            - $(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.py.yaml
            - --liveness
            - $(CONTAINER_ROOT)/tabsdata/liveness/liveness
            - --responder-url
            - env:SECRET__TD_RESPONDER_URL
            - --responder-method
            - env:SECRET__TD_RESPONDER_METHOD
            - --responder-authorization
            - env:SECRET__TD_RESPONDER_AUTHORIZATION
            - --journal-file
            - $(CONTAINER_ROOT)/tabsdata/shared/journal/journal.yaml
            - --request
            - $(CONTAINER_ROOT)/tabsdata/shared/request/request.yaml
            - --bundle-dir
            - $(CONTAINER_ROOT)/tabsdata/shared/bundle/folder
            - --bundle-archive
            - $(CONTAINER_ROOT)/tabsdata/shared/bundle/archive/bundle.tar.zst
            - --transporter-request
            - $(CONTAINER_ROOT)/tabsdata/shuttle/request/bundle-fetch.yaml
            - --transporter-response
            - $(CONTAINER_ROOT)/tabsdata/shuttle/response/bundle-fetch.yaml
            - --storage-config
            - $(CONTAINER_ROOT)/tabsdata/config/apiserver.storage.yaml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONTAINER_ROOT
              value: "$(KM_CONTAINER_ROOT)"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_TABSDATA_INSTANCE
              value: "${{system:tdk_instance_name}}"
            - name: TD_LOG_CONFIG
              value: "$(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.rs.yaml"
            - name: TD_BEFORE_PATH
              value: "$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}"
            - name: TD_AFTER_PATH
              value: ""
          envFrom:
            - secretRef:
                name: td-app-apiserver-secret-config-apiserver.storage.yaml
              prefix: SECRETS__
          volumeMounts:
            - name: config-localize-fn-bundle
              mountPath: /tabsdata/config
              readOnly: true
            - name: pyenv
              mountPath: /tabsdata/pyenv
              readOnly: true
            - name: shared
              mountPath: /tabsdata/shared
        - name: 0030-manifest-trigger
          image: function
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          command: ["$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}/td_run_manifest_trigger${{system:tdk_exe_suffix}}"]
          args:
            - --shared-dir
            - $(CONTAINER_ROOT)/tabsdata/shared
            - --work-dir
            - $(CONTAINER_ROOT)/tabsdata/work
            - --log-config
            - $(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.py.yaml
            - --liveness
            - $(CONTAINER_ROOT)/tabsdata/liveness/liveness
            - --responder-url
            - env:SECRET__TD_RESPONDER_URL
            - --responder-method
            - env:SECRET__TD_RESPONDER_METHOD
            - --responder-authorization
            - env:SECRET__TD_RESPONDER_AUTHORIZATION
            - --journal-file
            - $(CONTAINER_ROOT)/tabsdata/shared/journal/journal.yaml
            - --request
            - $(CONTAINER_ROOT)/tabsdata/shared/request/request.yaml
            - --trigger-url
            - env:SECRET__TD_TRIGGER_URL
            - --trigger-method
            - env:SECRET__TD_TRIGGER_METHOD
            - --trigger-authorization
            - env:SECRET__TD_TRIGGER_AUTHORIZATION
            - --back-off-secs
            - "30"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONTAINER_ROOT
              value: "$(KM_CONTAINER_ROOT)"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_TABSDATA_INSTANCE
              value: "${{system:tdk_instance_name}}"
            - name: TD_LOG_CONFIG
              value: "$(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.rs.yaml"
            - name: TD_BEFORE_PATH
              value: "$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}"
            - name: TD_AFTER_PATH
              value: ""
          envFrom:
            - secretRef:
                name: td-app-apiserver-secret-config-apiserver.storage.yaml
              prefix: SECRETS__
          volumeMounts:
            - name: config-manifest-trigger
              mountPath: /tabsdata/config
              readOnly: true
            - name: pyenv
              mountPath: /tabsdata/pyenv
              readOnly: true
            - name: shared
              mountPath: /tabsdata/shared
      containers:
        - name: 1000-run-streamer
          image: function
          imagePullPolicy: IfNotPresent
          command: ["$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}/td_run_streamer${{system:tdk_exe_suffix}}"]
          args:
            - --shared-dir
            - $(CONTAINER_ROOT)/tabsdata/shared
            - --work-dir
            - $(CONTAINER_ROOT)/tabsdata/work
            - --connection-file
            - $(CONTAINER_ROOT)/tabsdata/connection/connection.yaml
            - --log-config
            - $(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.py.yaml
            - --liveness
            - $(CONTAINER_ROOT)/tabsdata/liveness/liveness
            - --responder-url
            - env:SECRET__TD_RESPONDER_URL
            - --responder-method
            - env:SECRET__TD_RESPONDER_METHOD
            - --responder-authorization
            - env:SECRET__TD_RESPONDER_AUTHORIZATION
            - --journal-file
            - $(CONTAINER_ROOT)/tabsdata/shared/journal/journal.yaml
            - --request
            - $(CONTAINER_ROOT)/tabsdata/shared/request/request.yaml
            - --bundle-dir
            - $(CONTAINER_ROOT)/tabsdata/shared/bundle/folder
            - --out-dir
            - $(CONTAINER_ROOT)/tabsdata/shared/out
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONTAINER_ROOT
              value: "$(KM_CONTAINER_ROOT)"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_TABSDATA_INSTANCE
              value: "${{system:tdk_instance_name}}"
            - name: TD_LOG_CONFIG
              value: "$(CONTAINER_ROOT)/tabsdata/config/tabsdata.log.rs.yaml"
            - name: TD_BEFORE_PATH
              value: "$(CONTAINER_ROOT)/tabsdata/pyenv/${{system:tdk_pyenv_scripts_folder}}"
            - name: TD_AFTER_PATH
              value: ""
          envFrom:
            - secretRef:
                name: ${{system:tdk_connection_secret_name}}
            - secretRef:
                name: td-app-apiserver-secret-config-apiserver.storage.yaml
              prefix: SECRETS__
          volumeMounts:
            - name: config-run-streamer
              mountPath: /tabsdata/config
              readOnly: true
            - name: connection
              mountPath: /tabsdata/connection
              readOnly: true
            - name: pyenv
              mountPath: /tabsdata/pyenv
              readOnly: true
            - name: shared
              mountPath: /tabsdata/shared
      volumes:
        - name: config-begin-execution
          projected:
            sources:
              - configMap:
                  name: td-app-tabsdata-config-tabsdata.log.py.yaml
              - configMap:
                  name: td-app-tabsdata-config-tabsdata.log.rs.yaml
        - name: config-fetch-request
          projected:
            sources:
              - configMap:
                  name: td-app-tabsdata-config-tabsdata.log.py.yaml
              - configMap:
                  name: td-app-tabsdata-config-tabsdata.log.rs.yaml
        - name: config-localize-fn-bundle
          projected:
            sources:
              - configMap:
                  name: td-app-tabsdata-config-tabsdata.log.py.yaml
              - configMap:
                  name: td-app-tabsdata-config-tabsdata.log.rs.yaml
              - configMap:
                  name: td-app-apiserver-config-apiserver.storage.yaml
        - name: config-manifest-trigger
          projected:
            sources:
              - configMap:
                  name: td-app-tabsdata-config-tabsdata.log.py.yaml
              - configMap:
                  name: td-app-tabsdata-config-tabsdata.log.rs.yaml
        - name: config-run-streamer
          projected:
            sources:
              - configMap:
                  name: td-app-tabsdata-config-tabsdata.log.py.yaml
              - configMap:
                  name: td-app-tabsdata-config-tabsdata.log.rs.yaml
        - name: connection
          projected:
            sources:
              - configMap:
                  name: ${{system:tdk_connection_configmap_name}}
                  items:
                    - key: connection.yaml
                      path: connection.yaml
        - name: pyenv
          hostPath:
            path: "${{system:tdk_pyenv_fn_root}}"
        - name: shared
          emptyDir: {}
