          - kminus
          - --port
          - "{port}"
          - --loglevel
          - debug
          - --uv-index
          - "{uv_index}"
          - --verbose
          - --accept-terms
          - "yes"
          - --yes
      - arguments:
          - venv
          - update
          - --instance
          - "{instance}"
          - --name
          - fn
          - --requirements
          - "{requirements}"
          - --verbose
          - --accept-terms
          - "yes"
          - --yes
  - versions: ">=2.2.0,<2.3.0"
