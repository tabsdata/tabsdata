releases:
  - versions: "==2.0.0"
    commands:
      - arguments:
          - quickstart
          - --instance
          - "{instance}"
          - --provider
          - kminus
          - --port
          - "{port}"
          - --loglevel
          - debug
          - --reqs-td
          - "{requirements}"
          - --verbose
          - --accept-terms
          - "yes"
          - --yes
        environment:
          UV_INDEX: "{uv_index}"
