files:
  apiserver.storage:
    storage.mounts[id=ROOT]:
      uri: env:${TD_STORAGE__URI}/${TD_STORAGE__INSTANCE}/data/
      options.google_service_account_key: env:TD_STORAGE__OPTIONS__GOOGLE_SERVICE_ACCOUNT_KEY
      options.allow_http: env:TD_STORAGE__OPTIONS__ALLOW_HTTP
    storage.mounts[id=BUNDLES]:
      uri: env:${TD_STORAGE__URI}/${TD_STORAGE__INSTANCE}/bundles/
      options.google_service_account_key: env:TD_STORAGE__OPTIONS__GOOGLE_SERVICE_ACCOUNT_KEY
      options.allow_http: env:TD_STORAGE__OPTIONS__ALLOW_HTTP
    storage.mounts[id=IMAGES]:
      uri: env:${TD_STORAGE__URI}/${TD_STORAGE__INSTANCE}/images/
      options.google_service_account_key: env:TD_STORAGE__OPTIONS__GOOGLE_SERVICE_ACCOUNT_KEY
      options.allow_http: env:TD_STORAGE__OPTIONS__ALLOW_HTTP
