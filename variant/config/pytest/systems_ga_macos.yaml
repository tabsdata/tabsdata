- name: azureblob
  type: azureblob
  container$: AZ__CONTAINER
  account-name$: AZ__ACCOUNT_NAME
  account-key$: AZ__ACCOUNT_KEY
  sys-path$: AZ__SYS_PATH
- name: bigquery
  type: bigquery
  project$: BIGQUERY__PROJECT
  bucket$: BIGQUERY__BUCKET
  service-account-key$: BIGQUERY__SERVICE_ACCOUNT_KEY
  sys-path$: BIGQUERY__SYS_PATH
- name: databricks
  type: databricks
  host$: DATABRICKS__HOST
  token$: DATABRICKS__TOKEN
  warehouse-id$: DATABRICKS__WAREHOUSE_ID
  catalog$: DATABRICKS__CATALOG
  volume$: DATABRICKS__VOLUME
- name: fs
  type: fs
- name: gcs
  type: gcs
  bucket$: GCS__BUCKET
  service-account-key$: GCS__SERVICE_ACCOUNT_KEY
  hmac-access-key$: GCS__HMAC_ACCESS_KEY
  hmac-secret-key$: GCS__HMAC_SECRET_KEY
  sys-path$: GCS__SYS_PATH
- name: s3
  type: s3
  bucket$: S3__BUCKET
  region$: S3__REGION
  access-key$: S3__ACCESS_KEY
  secret-key$: S3__SECRET_KEY
  sys-path$: S3__SYS_PATH
- name: salesforce
  type: salesforce
  url$: SALESFORCE__URL
  username$: SALESFORCE__USERNAME
  password$: SALESFORCE__PASSWORD
  token$: SALESFORCE__TOKEN
- name: snowflake
  type: snowflake
  account$: SNOWFLAKE__ACCOUNT
  username$: SNOWFLAKE__USERNAME
  pat$: SNOWFLAKE__PAT
  database$: SNOWFLAKE__DATABASE
  warehouse$: SNOWFLAKE__WAREHOUSE
