# Caution!!!
# The flattened union of all `names` below is replicated in project python file
# 'bundle_utils.py' in folder 'client/platform/src/main/python/tabsdata/_utils',
# to ensure that when testing with pytest, the binaries are distributed and
# available from tabsdata as a local package.
# Please, make sure you update both places.
#
# Each group describes a set of binaries that ship together as part of a
# tabsdata wheel. A group with neither `source` nor `km_subpath` resolves its
# source folder dynamically via `get_target_release_folder()` (profile and
# td_target aware). A group with an explicit `source` is interpreted relative
# to the project root. A group with `km_subpath` is interpreted relative to
# the resolved km sibling project (preferring `KM_PROJECT_PRIMARY_NAME`,
# falling back to `KM_PROJECT_ALTERNATE_NAME` from
# tabsdatax.setup.common.platform). External groups are auto-detected: if
# the folder is missing, the group is silently skipped.
#
# `install_dest` (optional) is the wheel install destination relative to
# `<sys.prefix>`. When omitted, defaults to the Python scripts folder
# (`bin` on POSIX, `Scripts` on Windows) — i.e., on PATH. Set explicitly
# to place a group off PATH (e.g., `libexec/tabsdata` for internal helpers).

[[binary_groups]]
name = "tabsdata"
names = [
    "td_about",
    "td_apiserver",
    "td_bootloader",
    "td_crontrigger",
    "td_dbmanager",
    "td_supervisor",
    "td_transporter1",
    "td_transporter2",
    "tdkserver",
    "tdserver",
]

[[binary_groups]]
name = "kubernetes-cli"
km_subpath = "target/dist"
names = [
    "km",
    "kmc",
]

[[binary_groups]]
name = "kubernetes-srv"
km_subpath = "target/dist"
install_dest = "libexec/tabsdata"
names = [
    "control-plane",
    "etcd",
    "kube-apiserver",
    "kube-controller-manager",
    "pod-runner",
    "virtual-kubelet",
]
