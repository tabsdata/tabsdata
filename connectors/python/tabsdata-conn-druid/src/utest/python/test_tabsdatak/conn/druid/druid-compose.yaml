# Docker-compose stack for Apache Druid integration tests.
#
# Mirrors the legacy ``client/platform/.../druid-compose.yaml`` shape:
# six containers (zookeeper + coordinator/overlord + broker + historical
# + middlemanager + router) sharing a single named volume for segments
# and indexing logs. The Druid services share a single environment
# block via a YAML anchor; ``micro-quickstart`` runs every Druid role
# with embedded Derby for metadata so no external Postgres is needed.
#
# Worker capacity is set to 16 to match the default pytest-xdist worker
# count so concurrent ingestion tasks don't queue.

x-druid-env: &druid-env
  DRUID_SINGLE_NODE_CONF: micro-quickstart
  AWS_EC2_METADATA_DISABLED: "true"
  AWS_REGION: us-east-1
  druid_extensions_loadList: '["druid-parquet-extensions", "druid-s3-extensions", "druid-google-extensions", "druid-azure-extensions"]'
  druid_zk_service_host: zookeeper
  druid_storage_type: local
  druid_storage_storageDirectory: /opt/shared/segments
  druid_indexer_logs_type: file
  druid_indexer_logs_directory: /opt/shared/indexing-logs
  druid_processing_numThreads: "1"
  druid_processing_numMergeBuffers: "1"
  druid_worker_capacity: "16"
  druid_emitter_logging_logLevel: info
  druid_indexer_runner_javaOptsArray: '["-server", "-Xmx512m", "-XX:MaxDirectMemorySize=400m"]'

services:
  zookeeper:
    image: zookeeper:3.5.10
    container_name: tdpytest_c_conn_druid-zookeeper
    environment:
      ZOO_MY_ID: 1
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/commands/ruok || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  coordinator:
    image: apache/druid:31.0.0
    container_name: tdpytest_c_conn_druid-coordinator
    command: ["coordinator"]
    ports:
      - "8081/tcp"
    environment:
      <<: *druid-env
    volumes:
      - druid_shared:/opt/shared
    depends_on:
      zookeeper:
        condition: service_healthy

  broker:
    image: apache/druid:31.0.0
    container_name: tdpytest_c_conn_druid-broker
    command: ["broker"]
    ports:
      - "8082/tcp"
    environment:
      <<: *druid-env
    volumes:
      - druid_shared:/opt/shared
    depends_on:
      zookeeper:
        condition: service_healthy
      coordinator:
        condition: service_started

  historical:
    image: apache/druid:31.0.0
    container_name: tdpytest_c_conn_druid-historical
    command: ["historical"]
    ports:
      - "8083/tcp"
    environment:
      <<: *druid-env
    volumes:
      - druid_shared:/opt/shared
    depends_on:
      zookeeper:
        condition: service_healthy
      coordinator:
        condition: service_started

  middlemanager:
    image: apache/druid:31.0.0
    container_name: tdpytest_c_conn_druid-middlemanager
    command: ["middleManager"]
    ports:
      - "8091/tcp"
    environment:
      <<: *druid-env
    volumes:
      - druid_shared:/opt/shared
    depends_on:
      zookeeper:
        condition: service_healthy
      coordinator:
        condition: service_started

  router:
    image: apache/druid:31.0.0
    container_name: tdpytest_c_conn_druid-router
    command: ["router"]
    ports:
      - "8888/tcp"
    environment:
      <<: *druid-env
    volumes:
      - druid_shared:/opt/shared
    depends_on:
      zookeeper:
        condition: service_healthy
      coordinator:
        condition: service_started

volumes:
  druid_shared:
