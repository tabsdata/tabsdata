[build-system]
requires = []
build-backend = "setuptools.build_meta"

[project]
name = "tabsdata-conn-oracle"
description = "Oracle Database connector."
authors = [{name = "Tabsdata Inc."}]
keywords = [
    "tabsdata",
    "tabsdatak",
    "data",
    "tables",
    "pub/sub",
    "publish/subscribe",
    "oracle",
    "sql",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: JavaScript",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
]
dynamic = [
    "version",
    "license",
    "readme",
    "requires-python",
    "dependencies",
    "optional-dependencies",
]

[project.urls]
Homepage = "https://tabsdata.com"
Documentation = "https://docs.tabsdata.com"
Source = "https://github.com/tabsdata/tabsdata"

[project.entry-points."tabsdatak.connectors"]
src_oracle = "tabsdatak.conn.oracle._plugin:ORACLE_SRC"
dest_oracle = "tabsdatak.conn.oracle._plugin:ORACLE_DEST"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
consider_namespace_packages = true
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::pytest.PytestUnknownMarkWarning",
    "ignore::authlib.deprecate.AuthlibDeprecationWarning",
]
markers = [
    "agent: mark tests that require the tabsdata-agent package.",
    "ai_provider: mark tests that require an ai provider (accepted values: openai).",
    "api: mark tests for the API layer.",
    "asyncio: async tests requiring pytest-asyncio.",
    "azure: mark tests that require credentials to Azure.",
    "azureblob: test exercises the AzureBlob connector.",
    "azureblob_live: live test that needs the td_transporter binary + real Azure.",
    "backend: mark tests that require the tabsdata-backend package.",
    "bigquery: mark tests that require the tabsdata-bigquery package.",
    "catalog: mark tests for catalog functionality.",
    "cdc_common: mark tests that require the tabsdata-cdc-common package.",
    "cdc_db2: mark tests that require the tabsdata-cdc-db2 package.",
    "cdc_mysql: mark tests that require the tabsdata-cdc-mysql package.",
    "cdc_postgres: mark tests that require the tabsdata-cdc-postgres package.",
    "chipset: test that might give false positives or negatives due to chipset behaviour (specially on numbers precision).",
    "cli: mark tests for the CLI layer.",
    "clickhouse: mark tests that require a ClickHouse docker container.",
    "common: mark tests that require the tabsdata-common package.",
    "config_resolver: tests for the config_resolver tool in tabsserver.",
    "conn_dev: mark tests that require the tabsdata-conn-dev package.",
    "conn_kafka: mark tests that require the tabsdata-conn-kafka package.",
    "conn_stream_stage: mark tests that require the tabsdata-conn-stream-stage package.",
    "control_plane: mark tests that require the tabsdata-control-plane package.",
    "crontrigger: mark tests for the CronTrigger class.",
    "databricks: mark tests that require the tabsdata-databricks package.",
    "databricks_live: live test that needs a real Databricks workspace.",
    "db2: mark test as requiring a db2 docker container.",
    "db2_docker: end-to-end test that needs a docker daemon and a Db2 image.",
    "db2_seq: mark test as requiring running sequentially in the db2 scope (normally using a docker container).",
    "dq: mark tests for data quality functionality.",
    "druid: mark tests that require Druid dialect/connection logic.",
    "ep_case01: reproduce a cancel leaving a later execution half canceled (ep-case01.md).",
    "ep_case02: reproduce a finished run that is never published beside a canceled one (ep-case02.md).",
    "ep_case03: reproduce a stalled execution reported as running once canceled runs join it (ep-case03.md).",
    "execution_plane: mark tests that require the tabsdata-execution-plane package.",
    "gcs: mark tests that require credentials to GCS.",
    "gcs_live: live test that needs the td_transporter binary + real GCS.",
    "hashicorp: mark test as requiring a hashicorp vault docker container.",
    "integration: mark a test as an integration test.",
    "kafka: mark tests that require the tabsdata-kafka package.",
    "live_llm: LLM smoke tests that hit real APIs.",
    "localfile: mark tests that use local file storage.",
    "localfile_live: live test that needs the td_transporter binary.",
    "mariadb: mark test as requiring a mariadb docker container.",
    "mariadb_docker: end-to-end test that needs a docker daemon and a MariaDB image.",
    "mcp: mark tests that require the tabsdata-mcp package.",
    "medallion: mark tests that require the tabsdata-medallion package.",
    "mongodb: mark tests that require the tabsdata-mongodb package.",
    "monkey: mark randomized workload runs on a cluster instance.",
    "mount_extractor: tests for the mount_extractor tool in tabsserver.",
    "mssql: mark test as requiring a mssql docker container.",
    "mssql_docker: end-to-end test that needs a docker daemon and a SQL Server image.",
    "mysql: mark test as requiring a mysql docker container.",
    "mysql_docker: end-to-end test that needs a docker daemon and a MySQL image.",
    "oracle: mark test as requiring an oracle docker container. Also, the Oracle Instant Client must be installed.",
    "oracle_docker: end-to-end test that needs a docker daemon and an Oracle image.",
    "performance: mark tests that will be run in a purely performance environment. The amount of records used in each test can be configured through the --performance-size parameter, which defaults to 25000.",
    "postgres: mark test as requiring a postgresql docker container.",
    "postgres_docker: end-to-end test that needs a docker daemon and a Postgres image.",
    "provenance: mark tests for provenance tracking.",
    "pyo3: mark test that use a pyo3/maturin dynamic library. They are usually correlated to corresponding Rust tests.",
    "requires_internet: mark those tests that require an Internet connection to be run.",
    "s3: mark tests that require credentials to AWS S3.",
    "s3_live: live test that needs the td_transporter binary + real AWS S3.",
    "s3_specific: mark tests specific to S3 storage behaviour.",
    "salesforce: mark tests that require the tabsdata-salesforce package.",
    "schema_evolution: mark tests that require the tabsdata-schema-evolution package.",
    "sdk: mark tests that require the tabsdata-sdk package.",
    "server: mark tests that require the tabsdata-server package.",
    "slow: mark test as slow.",
    "snowflake: mark tests that require the tabsdata-snowflake package.",
    "snowflake_live: live test that needs a real Snowflake account.",
    "sql_common: mark tests that require the tabsdata-sql-common package.",
    "stagetrigger: mark tests for the StageTrigger class.",
    "starrocks: mark tests that require a StarRocks docker container.",
    "table_actions: mark tests for table action operations.",
    "tableframe: mark a test that validates the TableFrame API.",
    "tabsdata: requires tabsdata server to be started.",
    "tabsdatak: mark tests that require the tabsdatak package.",
    "tabsserver: mark tests for the tabsserver component.",
    "tdfnjob: automatically add behaviours to 'tdfnjob' tests.",
    "tdfnrun: automatically add behaviours to 'tdfnrun' tests.",
    "tdfntrigger: automatically add behaviours to 'tdfntrigger' tests.",
    "tfgen: mark a generated TableFrame API delegation test (emitted by tdx-gtableframe).",
    "timeout: mark tests with a timeout via pytest-timeout.",
    "tool_operation: tool operations against a real Tabsdata server.",
    "unit: mark a test as a unit test.",
]

[tool.coverage.html]
directory = "coverage_html_report"

[tool.coverage.report]
exclude_also = [
    "@(abc\\.)?abstractmethod",
]

[tool.licensecheck]
using = "requirements:requirements.txt"

[tool.ruff]
extend = "../../../pyproject.toml"

[tool.tabsdata]
name = "tabsdata-conn-oracle"
display = "Oracle Connector"
